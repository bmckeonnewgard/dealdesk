/* Builds a template's category/item checklist for a given deal as a wired-up DOM node — the
   shared engine behind both due-diligence lists (the standard collected-documents template and
   the "work that produces it" template), each with its own cache and setItemFn so their
   completion math never mixes.
   opts.openFirstIndex: category index to expand by default (undefined = all collapsed). */
function buildChecklistCategories(dealId, template, total, cache, setItemFn, opts){
  opts = opts || {};
  cache = cache || new Map();
  let complete=0, na=0;
  const catsWrap = document.createElement("div");
  catsWrap.style.cssText = "display:flex;flex-direction:column;gap:10px;";
  template.forEach((cat, ci)=>{
    let catComplete = 0;
    const details = document.createElement("details");
    details.className = "category";
    details.open = opts.openFirstIndex===ci;
    const summaryEl = document.createElement("summary");
    summaryEl.innerHTML = `<span></span><span class="cat-count"></span>`;
    summaryEl.querySelector("span").textContent = cat.category;
    details.appendChild(summaryEl);
    cat.items.forEach(item=>{
      const v = cache.get(item.key) || {status:"not_started", notes:""};
      if(v.status==="complete"){ complete++; catComplete++; }
      if(v.status==="na"){ na++; }
      const row = document.createElement("div");
      row.className = "dd-item";
      row.innerHTML = `
        <div class="dd-item-row">
          <span class="dd-item-label"></span>
          <span class="dd-overdue-flag" style="display:none;">Overdue</span>
          <select class="dd-status"></select>
        </div>
        <div class="dd-item-row-meta">
          <span class="dd-target-date-label">Target date</span>
          <input class="dd-target-date" type="date">
        </div>
        <input class="dd-notes" type="text" placeholder="Notes…">`;
      row.querySelector(".dd-item-label").textContent = item.label;
      const sel = row.querySelector(".dd-status");
      Object.entries(STATUS_META).forEach(([k,meta])=>{
        const o = document.createElement("option"); o.value=k; o.textContent=meta.label;
        if((v.status||"not_started")===k) o.selected = true;
        sel.appendChild(o);
      });
      const dateInput = row.querySelector(".dd-target-date");
      dateInput.value = v.targetDate||"";
      const overdueFlag = row.querySelector(".dd-overdue-flag");
      const refreshOverdue = ()=>{
        const done = sel.value==="complete" || sel.value==="na";
        const overdue = !done && dateInput.value && daysUntil(dateInput.value)<0;
        overdueFlag.style.display = overdue ? "" : "none";
      };
      colorSelectByStatus(sel, (STATUS_META[sel.value]||STATUS_META.not_started).cls);
      refreshOverdue();
      sel.addEventListener("change", ()=>{
        setItemFn(dealId, item.key, {status: sel.value});
        colorSelectByStatus(sel, STATUS_META[sel.value].cls);
        refreshOverdue();
      });
      dateInput.addEventListener("change", ()=>{
        setItemFn(dealId, item.key, {targetDate: dateInput.value});
        refreshOverdue();
      });
      const notesInput = row.querySelector(".dd-notes");
      notesInput.value = v.notes||"";
      notesInput.addEventListener("change", ()=> setItemFn(dealId, item.key, {notes: notesInput.value}));
      details.appendChild(row);
    });
    summaryEl.querySelector(".cat-count").textContent = `${catComplete}/${cat.items.length}`;
    catsWrap.appendChild(details);
  });
  const applicable = total - na;
  const pct = applicable>0 ? Math.round((complete/applicable)*100) : 0;
  return {catsWrap, complete, na, applicable, pct};
}
function buildDdCategories(dealId, opts){
  return buildChecklistCategories(dealId, DD_TEMPLATE, DD_TOTAL, checklistCache.get(dealId), setChecklistItem, opts);
}
function buildWorkChecklistCategories(dealId, opts){
  return buildChecklistCategories(dealId, DD_WORK_TEMPLATE, DD_WORK_TOTAL, workChecklistCache.get(dealId), setWorkChecklistItem, opts);
}

async function addCustomCriterion(dealId, label, requirement, type){
  const d = deals.get(dealId) || {};
  const list = (d.customCriteria || []).slice();
  const key = slugifyCriterionKey(label, list.map(c=>c.key));
  list.push({key, label, requirement, type: type==="binary"?"binary":"scale"});
  d.customCriteria = list;
  await updateDeal(dealId, {customCriteria: list});
  renderIcCriteriaSection();
}
async function removeCustomCriterion(dealId, key){
  const d = deals.get(dealId) || {};
  const list = (d.customCriteria || []).filter(c=>c.key!==key);
  d.customCriteria = list;
  await updateDeal(dealId, {customCriteria: list});
  recomputeIcCriteria(dealId);
  renderIcCriteriaSection();
}
function buildIcCriteriaList(dealId){
  const cache = criteriaCache.get(dealId) || new Map();
  const d = deals.get(dealId) || {};
  const source = criteriaSourceFor(d);
  const isAutoCondo = source.type!=="custom"; // locked, shared sheet — no per-row remove or inline add
  const list = activeIcCriteria(d);
  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex;flex-direction:column;gap:0;";
  let fit=0, watch=0, nofit=0, tbd=0;
  list.forEach(item=>{
    const v = cache.get(item.key) || {status:"tbd", notes:"", actual:"", rating:null};
    if(v.status==="fit") fit++; else if(v.status==="watch") watch++; else if(v.status==="nofit") nofit++; else tbd++;
    const smart = IC_SMART_FIELDS[item.key];
    const computedActual = (smart && smart.actual) ? smart.actual(d) : null;
    const suggestedFit = (smart && smart.fit) ? smart.fit(d) : null;
    const sugMeta = suggestedFit ? IC_STATUS_META[suggestedFit] : null;
    const critType = item.type==="binary" ? "binary" : "scale";
    const row = document.createElement("div");
    row.className = "ic-row";
    row.innerHTML = `
      <div class="ic-row-top">
        <span class="ic-row-label"></span>
        ${sugMeta ? `<span class="pill ${sugMeta.cls}" title="Auto-suggested from this deal's data">Suggested: ${sugMeta.label}</span>` : ""}
        <span class="ic-rating-wrap"></span>
        <select class="dd-status"></select>
        ${(!isAutoCondo) ? `<button type="button" class="btn-icon ic-row-remove" title="Remove criterion">✕</button>` : ""}
      </div>
      <div class="ic-row-requirement"><span class="ic-row-line-label">Requirement</span><span class="ic-row-req-text"></span></div>
      <div class="ic-row-actual"></div>
      <input class="dd-notes" type="text" placeholder="Backup / notes…">`;
    row.querySelector(".ic-row-label").textContent = item.label;
    const ratingWrap = row.querySelector(".ic-rating-wrap");
    if(critType==="binary"){
      ratingWrap.innerHTML = `
        <button type="button" class="ic-rating-bin ic-rating-bin-yes${v.rating===10?" active":""}" data-val="10">Meets</button>
        <button type="button" class="ic-rating-bin ic-rating-bin-no${v.rating===0?" active":""}" data-val="0">Doesn't</button>`;
      ratingWrap.querySelectorAll(".ic-rating-bin").forEach(btn=>{
        btn.addEventListener("click", ()=> setCriteriaItem(dealId, item.key, {rating: Number(btn.getAttribute("data-val"))}));
      });
    } else {
      ratingWrap.innerHTML = `<input type="number" class="ic-rating-input" min="0" max="10" step="0.1" placeholder="Rate…" title="Quality rating, 0–10">`;
      const ratingInput = ratingWrap.querySelector(".ic-rating-input");
      ratingInput.value = (v.rating!=null) ? v.rating : "";
      ratingInput.addEventListener("change", ()=>{
        let val = ratingInput.value===""? null : Number(ratingInput.value);
        if(val!=null && !isNaN(val)){ val = Math.max(0, Math.min(10, Math.round(val*10)/10)); ratingInput.value = val; }
        else val = null;
        setCriteriaItem(dealId, item.key, {rating: val});
      });
    }
    row.querySelector(".ic-row-req-text").textContent = item.requirement;
    const actualWrap = row.querySelector(".ic-row-actual");
    if(smart && smart.actual){
      actualWrap.innerHTML = `<span class="ic-row-line-label">This deal</span><span class="ic-row-actual-value"></span>`;
      actualWrap.querySelector(".ic-row-actual-value").textContent = computedActual || "Not enough data yet";
    } else {
      actualWrap.innerHTML = `<span class="ic-row-line-label">This deal</span><input class="ic-row-actual-input" type="text" placeholder="Enter the actual value…">`;
      const actualInput = actualWrap.querySelector(".ic-row-actual-input");
      actualInput.value = v.actual||"";
      actualInput.addEventListener("change", ()=> setCriteriaItem(dealId, item.key, {actual: actualInput.value}));
    }
    const sel = row.querySelector(".dd-status");
    Object.entries(IC_STATUS_META).forEach(([k,meta])=>{
      const o = document.createElement("option"); o.value=k; o.textContent=meta.label;
      if((v.status||"tbd")===k) o.selected = true;
      sel.appendChild(o);
    });
    colorSelectByStatus(sel, (IC_STATUS_META[sel.value]||IC_STATUS_META.tbd).cls);
    sel.addEventListener("change", ()=>{
      setCriteriaItem(dealId, item.key, {status: sel.value});
      colorSelectByStatus(sel, IC_STATUS_META[sel.value].cls);
    });
    const notesInput = row.querySelector(".dd-notes");
    notesInput.value = v.notes||"";
    notesInput.addEventListener("change", ()=> setCriteriaItem(dealId, item.key, {notes: notesInput.value}));
    const removeBtn = row.querySelector(".ic-row-remove");
    if(removeBtn) removeBtn.addEventListener("click", ()=> removeCustomCriterion(dealId, item.key));
    wrap.appendChild(row);
  });
  if(!isAutoCondo){
    const addRow = document.createElement("div");
    addRow.className = "ic-row ic-row-add";
    addRow.innerHTML = `
      <div class="field-row" style="align-items:flex-end;">
        <div class="field" style="flex:1;"><label>New criterion</label><input type="text" class="ic-add-label" placeholder="e.g. Zoning"></div>
        <div class="field" style="flex:2;"><label>Requirement</label><input type="text" class="ic-add-req" placeholder="What we're looking for…"></div>
        <div class="field"><label>Rating type</label><select class="ic-add-type"><option value="scale">Scale 0–10</option><option value="binary">Binary Yes/No</option></select></div>
        <button type="button" class="btn ic-add-btn">+ Add criterion</button>
      </div>`;
    addRow.querySelector(".ic-add-btn").addEventListener("click", ()=>{
      const labelInput = addRow.querySelector(".ic-add-label");
      const reqInput = addRow.querySelector(".ic-add-req");
      const typeInput = addRow.querySelector(".ic-add-type");
      const label = labelInput.value.trim();
      if(!label) return;
      addCustomCriterion(dealId, label, reqInput.value.trim(), typeInput.value);
    });
    wrap.appendChild(addRow);
  }
  return {wrap, fit, watch, nofit, tbd, total:list.length, isAutoCondo, source};
}

function renderIcCriteriaSection(){
  if(!openDealId) return;

  const scoreText = (scoredDeal.icScore!=null && scoredDeal.icScoreCount) ? `${scoredDeal.icScore.toFixed(1)}/10` : "Not rated";
  const scoreColor = scoredDeal.icScore==null ? "var(--ink-faint)" : scoredDeal.icScore>=7.5 ? "var(--good)" : scoredDeal.icScore>=5 ? "var(--warn)" : "var(--bad)";

  const summary = document.createElement("div");

    <div style="flex:1;display:flex;gap:8px;flex-wrap:wrap;">
      <span class="pill pill-good">${fit} Fits</span>
      <span class="pill pill-warn">${watch} Watch</span>

      <span class="num" style="color:${scoreColor};">${scoreText}</span>

      <span class="cat-count" style="margin-left:0;">${fit+watch+nofit} of ${total} assessed</span>

    </span>`;
  box.appendChild(head);

  if(source.type!=="custom"){
    const btn = head.querySelector("#editMasterSheetBtn");

  }

  wrap.innerHTML = "";
  wrap.appendChild(summary);
  wrap.appendChild(box);
  renderIcDecisionSection();

    row.querySelector(".deposit-extra-amount").addEventListener("change", commit);

      empty: "No competing projects logged.",
      cols: [
        {key:"name", type:"text", placeholder:"Project name", flex:2},

        {key:"sourceDate", type:"text", placeholder:"Effective / published", flex:1},
        {key:"captured", type:"date", flex:1},

        {key:"url", type:"text", placeholder:"https://… viewer link", flex:2},
      ],
      row: ()=>({layer:SITE_LAYERS[0], finding:"", sourceDate:"", captured:new Date().toISOString().slice(0,10), by:(whoName()||""), url:""}),
    },

      cols: [

function renderRepeatableList(dealId, fieldKey, containerId){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  const spec = repeatableListSpecs()[fieldKey];
  const d = deals.get(dealId) || {};
  const list = d[fieldKey] || [];
  if(!list.length){
    wrap.innerHTML = `<div class="locked-note">${spec.empty}</div>`;
    return;
  }
  wrap.innerHTML = "";
  list.forEach((item, i)=>{
    const row = document.createElement("div");
    row.className = "repeat-row";
    row.innerHTML = spec.cols.map(c=>
      c.type==="select"
        ? `<select class="repeat-input" data-key="${c.key}" style="flex:${c.flex||1};"></select>`
        : `<input class="repeat-input" data-key="${c.key}" type="${c.type}" placeholder="${escapeAttr(c.placeholder||"")}" style="flex:${c.flex||1};">`
    ).join("") + `<button type="button" class="btn-icon repeat-remove" title="Remove">✕</button>`;
    spec.cols.forEach(c=>{
      const el = row.querySelector(`[data-key="${c.key}"]`);
      if(c.type==="select"){
        c.options.forEach(o=>{
          const opt = document.createElement("option"); opt.value=o; opt.textContent=o;
          if((item[c.key]||c.options[0])===o) opt.selected = true;
          el.appendChild(opt);
        });
      } else {
        el.value = item[c.key]??"";
      }
    });
    const commit = ()=>{
      const cur = deals.get(dealId);
      if(!cur) return;
      const next = (cur[fieldKey]||[]).slice();
      const rowData = {};
      spec.cols.forEach(c=>{
        const el = row.querySelector(`[data-key="${c.key}"]`);
        rowData[c.key] = c.type==="number" ? (el.value?Number(el.value):null) : el.value.trim ? el.value.trim() : el.value;
      });
      next[i] = rowData;
      cur[fieldKey] = next;
      updateDeal(dealId, {[fieldKey]: next});
    };
    row.querySelectorAll(".repeat-input").forEach(el=> el.addEventListener("change", commit));
    row.querySelector(".repeat-remove").addEventListener("click", ()=>{
      const cur = deals.get(dealId);
      if(!cur) return;
      const next = (cur[fieldKey]||[]).filter((_,idx)=>idx!==i);
      cur[fieldKey] = next;
      updateDeal(dealId, {[fieldKey]: next});
      renderRepeatableList(dealId, fieldKey, containerId);
    });
    wrap.appendChild(row);
  });
}
function addRepeatableRow(dealId, fieldKey, containerId){
  const spec = repeatableListSpecs()[fieldKey];
  const cur = deals.get(dealId);
  if(!cur) return;
  const next = (cur[fieldKey]||[]).concat([spec.row()]);
  cur[fieldKey] = next;
  updateDeal(dealId, {[fieldKey]: next});
  renderRepeatableList(dealId, fieldKey, containerId);
}

/* ---------- lookup deep-links & AI-draft helpers ----------
   Deal Desk runs as a published page with no server of its own, so it can't reach outside APIs
   (Census, county GIS, DOT traffic maps) directly from the browser — there's no live "fetch zoning"
   button that actually works. What it CAN do: open a direct, pre-filled link to the right external
   tool (one click instead of a cold search), and use the same AI-assist pattern Screen already uses
   to draft a best-effort starting point from Claude's own knowledge — clearly a draft, not a source. */
function censusExplorerUrl(address){
  return `https://data.census.gov/all?q=${encodeURIComponent(address||"")}`;
}
function zoningLookupUrl(address){
  return `https://www.google.com/search?q=${encodeURIComponent((address||"")+" zoning map parcel")}`;
}
function trafficLookupUrl(address, state){
  return `https://www.google.com/search?q=${encodeURIComponent((address||"")+" "+(state||"")+" annual average daily traffic count DOT")}`;
}
async function aiDraftField(dealId, kind){
  const d = deals.get(dealId);
  if(!d) return;
  const sample = sampleApi;
  if(!sample){ showToast("AI drafting isn't available right now", "bad"); return; }
  const place = [d.address, d.state].filter(Boolean).join(", ") || d.name || "this site";
  const prompts = {
    zoning: `You're helping a real estate acquisitions analyst at Newgard Development Group draft a rough first-pass note. Property: ${place}. In one short sentence, state the most LIKELY zoning classification for this property based on general knowledge of the area (e.g. "likely Commercial or Light Industrial, typical for this corridor"). Be clear this is a general best guess, not a confirmed lookup — the analyst will verify against the actual county zoning map. Respond with just the sentence, no preamble.`,
    employers: `You're helping a real estate acquisitions analyst at Newgard Development Group draft a rough first-pass note. Property: ${place}. Name up to 4 major employers or employment centers you're aware of within roughly a 20-30 minute drive, as a short comma-separated list. If you don't have reliable knowledge of this specific area, say "No confident answer — needs manual research" instead of guessing. Respond with just the list or that phrase, no preamble.`,
    traffic: `You're helping a real estate acquisitions analyst at Newgard Development Group draft a rough first-pass note. Property: ${place}. In one short sentence, give a general sense of the traffic character of the roads fronting this type of location (e.g. "likely a moderate-traffic arterial, not a highway frontage") based on general knowledge — not a specific vehicles-per-day count, since that needs an actual DOT count. Respond with just the sentence, no preamble.`,
  };
  const prompt = prompts[kind];
  if(!prompt) return;
  showToast("Drafting…", "good");
  try{
    const result = await sample(prompt, {modelTier:"quick"});
    const text = (result && result.text || "").trim();
    if(!text) return;
    const draftText = "[AI draft, verify] " + text;
    if(kind==="zoning") await updateDeal(dealId, {zoningDesignation: draftText});
    else if(kind==="employers") await updateDeal(dealId, {majorEmployers: draftText});
    else if(kind==="traffic") await updateDeal(dealId, {trafficNote: draftText});
    const cur = deals.get(dealId);
    if(kind==="zoning" && cur) cur.zoningDesignation = draftText;
    if(kind==="employers" && cur) cur.majorEmployers = draftText;
    if(kind==="traffic" && cur) cur.trafficNote = draftText;
    if(openDealId===dealId) refreshMarketFieldInputs();
    showToast("Draft added — please verify", "good");
  }catch(e){
    console.error("AI draft failed:", e);
    showToast("Couldn't draft that right now", "bad");
  }
}
function refreshMarketFieldInputs(){
  if(!openDealId) return;
  const d = deals.get(openDealId);
  if(!d) return;
  const zoningEl = document.getElementById("slideZoning");
  if(zoningEl) zoningEl.value = d.zoningDesignation||"";
  const employersEl = document.getElementById("slideEmployers");
  if(employersEl) employersEl.value = d.majorEmployers||"";
  const trafficEl = document.getElementById("slideTrafficNote");
  if(trafficEl) trafficEl.value = d.trafficNote||"";
}

/* ---------- site conditions & overlay maps ----------
   Same sandbox limit as the lookups above: the page can't query FEMA / USFWS / NRCS / EPA live,
   so site conditions are entered by hand and backed by one-click deep links to each layer's
   authoritative viewer. What makes an overlay diligence rather than decoration is the stamp on
   every row — what the layer said, the source's own effective or published date, and who checked
   it when. A layer nobody has checked prints as "Not checked" in the memo rather than vanishing.
   Screening is not determination: NWI is not a wetlands delineation and the NFHL is not an
   elevation certificate; each row names the report that will eventually replace it. */
const SITE_LAYERS = [
  "Flood (FEMA NFHL)",
  "Wetlands (USFWS NWI)",
  "Soils (NRCS)",
  "Environmental (EPA)",
  "Opportunity zone",
  "Zoning / parcel",
  "Traffic (state DOT)",
  "Airport / height",
  "Other",
];
const WETLANDS_STATUS_OPTIONS = ["Not checked","None mapped on site","Mapped nearby","Mapped on site","Delineation ordered"];
const SITE_FIELD_MAP = {
  slideSiteLat:        {field:"siteLat",        type:"float"},
  slideSiteLng:        {field:"siteLng",        type:"float"},
  slideFloodZone:      {field:"floodZone",      type:"text"},
  slideFloodPanel:     {field:"floodPanel",     type:"text"},
  slideFloodPanelDate: {field:"floodPanelDate", type:"text"},
  slideFloodBfe:       {field:"floodBfe",       type:"text"},
  slideWetlandsStatus: {field:"wetlandsStatus", type:"text"},
  slideEnvSummary:     {field:"envSummary",     type:"text"},
  slideSiteCondNote:   {field:"siteCondNote",   type:"text"},
  slideFloodMapUrl:    {field:"floodMapUrl",    type:"text"},
  slideWetlandsMapUrl: {field:"wetlandsMapUrl", type:"text"},
  slideSoilsMapUrl:    {field:"soilsMapUrl",    type:"text"},
  slideEnvMapUrl:      {field:"envMapUrl",      type:"text"},
};
function siteCoords(d){
  const lat = Number(d && d.siteLat), lng = Number(d && d.siteLng);
  if(!isFinite(lat) || !isFinite(lng) || (lat===0 && lng===0)) return null;
  return {lat, lng};
}
function siteAddressFor(d){ return ((d && (d.mapAddress || d.address)) || "").trim(); }
/* FEMA's Map Service Center is the authoritative flood source (it's what produces the FIRMette
   the lender will ask for). If the address parameter is ever dropped the link still lands on the
   search page, so the button degrades to "one click closer" rather than breaking. */
function femaFloodUrl(d){
  const a = siteAddressFor(d);
  return a ? `https://msc.fema.gov/portal/search?AddressQuery=${encodeURIComponent(a)}` : "https://msc.fema.gov/portal/search";
}
function nfhlViewerUrl(d){
  const a = siteAddressFor(d);
  const base = "https://www.arcgis.com/apps/webappviewer/index.html?id=8b0adb51996444d4879338b5529aa9cd";
  return a ? `${base}&find=${encodeURIComponent(a)}` : base;
}
function wetlandsMapperUrl(){ return "https://fwsprimary.wim.usgs.gov/wetlands/apps/wetlands-mapper/"; }
/* Web Soil Survey takes a bounding box in the URL as (upperLeftLng upperLeftLat, lowerRightLng
   lowerRightLat) — so a lat/long on the deal record opens it already zoomed to the parcel. */
function soilSurveyUrl(d){
  const c = siteCoords(d);
  const base = "https://websoilsurvey.nrcs.usda.gov/app/WebSoilSurvey.aspx";
  if(!c) return base;
  const dd = 0.006;
  const box = `(${(c.lng-dd).toFixed(5)} ${(c.lat+dd).toFixed(5)},${(c.lng+dd).toFixed(5)} ${(c.lat-dd).toFixed(5)})`;
  return `${base}?location=${encodeURIComponent(box)}`;
}
function nepAssistUrl(){ return "https://nepassisttool.epa.gov/nepassist/entry.html"; }
function ozMapUrl(){ return "https://www.cdfifund.gov/cims"; }
function siteLookupLinks(d){
  return [
    {id:"floodLookupLink",    label:"🌊 FEMA flood map",   url: femaFloodUrl(d)},
    {id:"nfhlLookupLink",     label:"🗺 NFHL viewer",       url: nfhlViewerUrl(d)},
    {id:"wetlandsLookupLink", label:"🪷 Wetlands (NWI)",    url: wetlandsMapperUrl()},
    {id:"soilsLookupLink",    label:"⛰ Soils (NRCS)",      url: soilSurveyUrl(d)},
    {id:"envLookupLink",      label:"🏭 EPA NEPAssist",     url: nepAssistUrl()},
    {id:"ozLookupLink",       label:"💠 Opportunity zone",  url: ozMapUrl()},
  ];
}
/* Shared renderer — the slideover preview and the printed IC memo both call this, so the two can't
   drift apart (same contract as demographicsPanelHtml). */
function siteConditionsPanelHtml(d){
  const rows = (d.siteConditions || []).filter(r=> r && (r.layer || r.finding));
  const tiles = [
    ["Flood zone", d.floodZone || "Not checked", !d.floodZone],
    ["Wetlands", d.wetlandsStatus || "Not checked", !d.wetlandsStatus || d.wetlandsStatus==="Not checked"],
    ["Environmental", d.envSummary || "Not checked", !d.envSummary],
  ];
  const tilesHtml = `<div class="wealth-tiles">${tiles.map(([l,v,unset])=>`
    <div class="wealth-tile">
      <div class="wealth-tile-label">${escapeHtml(l)}</div>
      <div class="wealth-tile-value" style="font-size:15px;${unset?"color:var(--ink-faint);font-weight:600;":""}">${escapeHtml(String(v))}</div>
    </div>`).join("")}</div>`;
  const floodBits = [
    d.floodPanel ? `FIRM panel ${d.floodPanel}` : "",
    d.floodPanelDate ? `effective ${d.floodPanelDate}` : "",
    d.floodBfe ? `BFE ${d.floodBfe}` : "",
  ].filter(Boolean).join(" · ");
  const c = siteCoords(d);
  const stampBits = [
    floodBits,
    c ? `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}` : "No coordinates on file — soils and wetlands links open unzoomed",
  ].filter(Boolean).join("  ·  ");
  const stampHtml = `<p class="wealth-source-note" style="margin-top:8px;">${escapeHtml(stampBits)}</p>`;
  const tableHtml = rows.length ? `<table class="memo-table ic-scorecard-table" style="margin-top:12px;">
    <thead><tr><th>Layer</th><th>Finding</th><th>Source date</th><th>Checked</th><th>Link</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td class="memo-td">${escapeHtml(r.layer||"—")}</td>
      <td class="memo-td ic-scorecard-req">${escapeHtml(r.finding||"—")}</td>
      <td class="memo-td">${escapeHtml(r.sourceDate||"—")}</td>
      <td class="memo-td">${r.captured?fmtDate(r.captured):"—"}${r.by?` · ${escapeHtml(r.by)}`:""}</td>
      <td class="memo-td">${r.url?`<a href="${escapeAttr(normalizeUrl(r.url))}" target="_blank" rel="noopener">Open →</a>`:"—"}</td>
    </tr>`).join("")}</tbody>
  </table>` : `<p class="ic-memo-notes" style="font-style:italic;color:var(--ink-faint);margin-top:12px;">No layers checked yet — flood, wetlands, soils and environmental should each be logged before this deal goes to IC.</p>`;
  const unchecked = SITE_LAYERS.slice(0,5).filter(l=> !rows.some(r=> r.layer===l));
  const gapHtml = (rows.length && unchecked.length) ? `<p class="wealth-source-note">Not checked: ${escapeHtml(unchecked.join(", "))}</p>` : "";
  const maps = [
    ["Flood zones", d.floodMapUrl],
    ["Wetlands", d.wetlandsMapUrl],
    ["Soils", d.soilsMapUrl],
    ["Environmental", d.envMapUrl],
  ].filter(([,u])=> !!u);
  const mapsHtml = maps.length ? `<div class="ic-memo-media-grid" style="margin-top:14px;">${maps.map(([label,u])=>`
    <div class="ic-memo-media-box">
      <div class="ic-memo-media-label">${escapeHtml(label)} overlay</div>
      <img src="${escapeAttr(normalizeUrl(u))}" onerror="this.closest('.ic-memo-media-box').style.display='none'">
    </div>`).join("")}</div>` : "";
  const noteHtml = d.siteCondNote ? `<p class="ic-memo-notes" style="margin-top:10px;">${escapeHtml(d.siteCondNote)}</p>` : "";
  return `${tilesHtml}${stampHtml}${tableHtml}${gapHtml}${mapsHtml}${noteHtml}`;
}

let ddTasksUnsubs = new Map();
function teardownDdTasksSubs(){
  ddTasksUnsubs.forEach(unsub=>{ try{ unsub(); }catch(e){} });
  ddTasksUnsubs.clear();
}
function reconcileDdTasksSubs(dealEntries){
  const wantIds = new Set(dealEntries.map(([id])=>id));
  ddTasksUnsubs.forEach((unsub, id)=>{
    if(!wantIds.has(id)){ try{ unsub(); }catch(e){} ddTasksUnsubs.delete(id); }
  });
  dealEntries.forEach(([id])=>{
    if(!checklistCache.has(id)) checklistCache.set(id, new Map());
    if(ddTasksUnsubs.has(id) || !db) return;
    const unsub = db.collection("deals/"+id+"/checklist").onSnapshot(snap=>{
      const cache = new Map();
      snap.docs.forEach(doc=> cache.set(doc.id, doc.data()));
      checklistCache.set(id, cache);
      recomputeDealProgress(id);
      if(view==="ddchecklist") renderDdTasksView();
    }, ()=>{});
    ddTasksUnsubs.set(id, unsub);
  });
}

/* =================== debt financing view =================== */
/* High-level financing tracker for deals under contract: is the debt side of the capital stack
   actually committed with a lender, or still missing? calcCapitalStack's debtAmount is a modeled
   assumption (basis × debt%) — this tracks whether that assumption has become real. A deal can
   carry more than one debt tranche (acquisition loan, one or more construction lines, mezz, a
   bridge loan, etc.), so debt lives as a debtSources[] array on the deal — same add/edit/remove-
   row pattern as the extra-deposits list, one row per tranche, each with its own status. */
function debtDealTotals(d){
  const cap = calcCapitalStack(d);
  const needed = cap ? cap.debtAmount : 0;
  const sources = d.debtSources || [];
  const committed = sources
    .filter(s=> s.status==="committed" || s.status==="funded")
    .reduce((sum,s)=> sum+(Number(s.committedAmount)||0), 0);
  return {needed, committed, gap: Math.max(0, needed-committed)};
}
function debtSourceRowHtml(dealId, source, idx){
  const status = source.status || "";
  return `<div class="debt-source-row" data-deal="${escapeAttr(dealId)}" data-idx="${idx}">
    <input type="text" class="debt-source-type" placeholder="e.g. Construction loan — Line B" value="${escapeAttr(source.type||"")}">
    <select class="debt-source-status">
      ${DEBT_STATUS_OPTIONS.map(k=>`<option value="${k}"${k===status?" selected":""}>${DEBT_STATUS_META[k].label}</option>`).join("")}
    </select>
    <input type="text" class="debt-source-lender" placeholder="Lender" value="${escapeAttr(source.lenderName||"")}">
    <input type="number" class="debt-source-amount" placeholder="Amount" value="${source.committedAmount!=null?source.committedAmount:""}">
    <input type="date" class="debt-source-date" value="${escapeAttr(source.commitmentDate||"")}">
    <button type="button" class="btn-icon debt-source-remove" title="Remove debt source">✕</button>
  </div>`;
}
function debtDealCardHtml(id, d){
  const name = d.name || d.address || "Untitled deal";
  const sources = d.debtSources || [];
  const {needed, committed, gap} = debtDealTotals(d);
  return `<div class="debt-deal-card">
    <div class="debt-deal-head">
      <button type="button" class="debt-deal-name" data-deal="${escapeAttr(id)}">${escapeHtml(name)}</button>
      <span class="debt-deal-stat">Needed <b>${needed?fmtMoneyShort(needed):"—"}</b></span>
      <span class="debt-deal-stat">Committed <b>${fmtMoneyShort(committed)}</b></span>
      <span class="debt-deal-stat${gap>0?" debt-deal-stat-bad":""}">${gap>0?`Short <b>${fmtMoneyShort(gap)}</b>`:"<b>Covered</b>"}</span>
    </div>
    <div class="debt-source-list" data-deal="${escapeAttr(id)}">
      ${sources.length ? sources.map((s,i)=>debtSourceRowHtml(id,s,i)).join("") : `<div class="empty-hint" style="padding:6px 0;">No debt sources yet.</div>`}
    </div>
    <button type="button" class="btn-icon debt-add-source" data-deal="${escapeAttr(id)}">+ Add debt source</button>
  </div>`;
}
function wireDebtView(wrap){
  wrap.querySelectorAll(".debt-deal-name").forEach(btn=> btn.addEventListener("click", ()=> openDealDetail(btn.getAttribute("data-deal"))));
  wrap.querySelectorAll(".debt-add-source").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-deal");
      const d = deals.get(id); if(!d) return;
      const next = (d.debtSources||[]).concat([{type:"", status:"", lenderName:"", committedAmount:null, commitmentDate:""}]);
      d.debtSources = next;
      updateDeal(id, {debtSources: next});
      renderDebtView();
    });
  });
  wrap.querySelectorAll(".debt-source-row").forEach(row=>{
    const id = row.getAttribute("data-deal");
    const idx = Number(row.getAttribute("data-idx"));
    const d = deals.get(id); if(!d) return;
    const commit = patch=>{
      const next = (d.debtSources||[]).slice();
      next[idx] = Object.assign({}, next[idx], patch);
      d.debtSources = next;
      updateDeal(id, {debtSources: next});
    };
    const statusSel = row.querySelector(".debt-source-status");
    colorSelectByStatus(statusSel, (DEBT_STATUS_META[statusSel.value]||DEBT_STATUS_META[""]).cls);
    statusSel.addEventListener("change", ()=>{
      commit({status: statusSel.value});
      colorSelectByStatus(statusSel, (DEBT_STATUS_META[statusSel.value]||DEBT_STATUS_META[""]).cls);
      renderDebtView();
    });
    row.querySelector(".debt-source-type").addEventListener("change", e=> commit({type: e.target.value.trim()}));
    row.querySelector(".debt-source-lender").addEventListener("change", e=> commit({lenderName: e.target.value.trim()}));
    row.querySelector(".debt-source-amount").addEventListener("change", e=>{ commit({committedAmount: e.target.value===""?null:Number(e.target.value)}); renderDebtView(); });
    row.querySelector(".debt-source-date").addEventListener("change", e=> commit({commitmentDate: e.target.value}));
    row.querySelector(".debt-source-remove").addEventListener("click", ()=>{
      const next = (d.debtSources||[]).slice();
      next.splice(idx,1);
      d.debtSources = next;
      updateDeal(id, {debtSources: next});
      renderDebtView();
    });
  });
}

function renderDebtView(){
  const wrap = document.getElementById("debtWrap");
  if(!wrap) return;
  const all = [...deals.entries()];
  const preClose = all.filter(([id,d])=> (d.stage||"prospecting")==="signed_psa_dd");
  const closed = all.filter(([id,d])=> (d.stage||"prospecting")==="onboarded");
  preClose.sort((a,b)=> debtDealTotals(b[1]).gap - debtDealTotals(a[1]).gap);
  closed.sort((a,b)=> (b[1].actualCloseDate||"").localeCompare(a[1].actualCloseDate||""));

  let neededTotal=0, committedTotal=0;
  preClose.forEach(([id,d])=>{
    const t = debtDealTotals(d);
    neededTotal += t.needed; committedTotal += t.committed;
  });
  const gapTotal = Math.max(0, neededTotal-committedTotal);
  const noSourcesCount = preClose.filter(([id,d])=> !(d.debtSources && d.debtSources.length)).length;

  wrap.innerHTML = `
    <h3 class="capital-section-title">💳 Debt financing</h3>
    <div class="kpi-grid" style="margin-bottom:16px;">
      <div class="kpi-tile"><span class="kpi-label">Debt needed</span><span class="kpi-value">${fmtMoneyShort(neededTotal)}</span><span class="kpi-sub">across ${preClose.length} in-contract deal${preClose.length===1?"":"s"}</span></div>
      <div class="kpi-tile"><span class="kpi-label">Committed</span><span class="kpi-value good">${fmtMoneyShort(committedTotal)}</span></div>
      <div class="kpi-tile"><span class="kpi-label">Gap</span><span class="kpi-value${gapTotal>0?" bad":""}">${fmtMoneyShort(gapTotal)}</span><span class="kpi-sub">${gapTotal>0?"not yet covered by a lender":"fully covered"}</span></div>
      <div class="kpi-tile"><span class="kpi-label">No sources yet</span><span class="kpi-value">${noSourcesCount}</span><span class="kpi-sub">of ${preClose.length} deal${preClose.length===1?"":"s"}</span></div>
    </div>
    ${preClose.length ? preClose.map(([id,d])=>debtDealCardHtml(id,d)).join("") : `<div class="empty-hint">No deals are under contract yet — this fills in once a deal reaches Signed PSA/DD.</div>`}
    ${closed.length ? `<details class="weekly-group" style="margin-top:16px;">
      <summary>Closed / funded<span class="weekly-group-count">${closed.length}</span></summary>
      <div style="padding:10px 13px;">${closed.map(([id,d])=>debtDealCardHtml(id,d)).join("")}</div>
    </details>` : ""}`;
  wireDebtView(wrap);
}

/* Mirrors the debt tracker above: is the equity side of the capital stack actually lined up —

function equityDealTotals(d){
