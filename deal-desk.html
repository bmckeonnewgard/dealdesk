  /* ---------- project timeline (Gantt) ---------- */
  .gantt-scroll{ overflow-x:auto; }
  .gantt-chart{ min-width:640px; display:flex; flex-direction:column; }
  .gantt-header{ display:flex; align-items:center; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--border); }
  .gantt-row-name-spacer{ width:170px; flex:none; }
  .gantt-row-pill-spacer{ width:120px; flex:none; margin-left:10px; }
  .gantt-header-track{ flex:1; position:relative; height:14px; }
  .gantt-tick{ position:absolute; top:0; transform:translateX(-50%); font-size:10px; color:var(--ink-faint); font-weight:700; white-space:nowrap; text-transform:uppercase; letter-spacing:.02em; }
  .gantt-tick-today{ color:var(--accent); }
  .gantt-body{ display:flex; flex-direction:column; gap:7px; }
  .gantt-row{ display:flex; align-items:center; }
  .gantt-row-name{
    width:170px; flex:none; background:none; border:none; padding:0 10px 0 0; text-align:left; cursor:pointer;
    font-weight:700; font-size:12px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .gantt-row-name:hover{ color:var(--accent); text-decoration:underline; }
  .gantt-row-track{ flex:1; position:relative; height:22px; background:var(--surface-2); border-radius:6px; }
  .gantt-seg{ position:absolute; top:2px; bottom:2px; border-radius:4px; }
  .gantt-seg-ongoing{ opacity:.82; border-right:2px dashed var(--surface); }
  .gantt-today-line{ position:absolute; top:-2px; bottom:-2px; width:0; border-left:1px dashed var(--ink-faint); z-index:1; }
  .gantt-marker{
    position:absolute; top:50%; width:10px; height:10px; border-radius:50%; transform:translate(-50%,-50%);
    border:2px solid var(--surface); cursor:pointer; padding:0; z-index:2;
  }
  .gantt-marker-accent{ background:var(--accent); }
  .gantt-marker-brass{ background:var(--brass); }
  .gantt-marker-bad{ background:var(--bad); }
  .gantt-row-pill{ width:120px; flex:none; margin-left:10px; text-align:center; font-size:10.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .cal-head .section-label{ margin:0; }
  .cal-range-toggle{ display:flex; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .cal-range-toggle .btn-icon{ border:none; border-radius:0; }
  .cal-range-toggle .btn-icon.active{ background:var(--accent-soft); color:var(--accent-strong); font-weight:700; }
  .closed-asof{ display:flex; align-items:center; gap:7px; margin-bottom:10px; }
  .closed-asof label{ font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; }
  .closed-asof input[type=date]{
    font-size:12px; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:6px; padding:4px 7px; font-family:var(--font-body);
  }
  .closed-asof .btn-icon{ padding:3px 7px; }
  .cal-range-toggle .btn-icon + .btn-icon{ border-left:1px solid var(--border); }
  .cal-grid{ display:flex; flex-direction:column; gap:10px; }
  .cal-pastdue{ display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; background:var(--bad-soft); border:1px solid var(--bad); border-radius:8px; padding:8px 12px; }
  .cal-pastdue-label{ font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--bad); flex:none; padding-top:4px; }
  .cal-pastdue-list{ display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .cal-pastdue-chip{
    font-size:11px; font-weight:600; color:var(--bad); background:var(--surface); border:1px solid var(--bad);
    border-radius:20px; padding:3px 10px; cursor:pointer; font-family:var(--font-body);
  }
  .cal-pastdue-chip:hover{ filter:brightness(0.97); }
  .cal-tl-scroll{ overflow-x:auto; border:1px solid var(--border); border-radius:10px; }
  .cal-tl-inner{ display:inline-flex; flex-direction:column; min-width:100%; }
  .cal-tl-row{ display:flex; }
  .cal-tl-year{
    flex:none; font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--ink-soft);
    padding:7px 0 6px 8px; border-bottom:2px solid var(--border-strong); box-sizing:border-box;
  }
  .cal-tl-month{
    flex:none; font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700;
    padding:6px 8px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); box-sizing:border-box;
  }
  .cal-tl-month.is-current{ color:var(--accent-strong); background:var(--accent-soft); }
  .cal-tl-row-content{ align-items:stretch; }
  .cal-tl-col{
    flex:none; display:flex; flex-direction:column; gap:5px; padding:7px 6px; border-right:1px solid var(--border);
    box-sizing:border-box; min-height:56px;
  }
  .cal-tl-col.is-current{ background:var(--accent-soft); }
  .cal-tl-card{
    display:flex; flex-direction:column; gap:2px; text-align:left; border:none; border-left:3px solid var(--neutral);
    border-radius:6px; padding:5px 7px; font-size:10.5px; cursor:pointer; background:var(--neutral-soft);
    font-family:var(--font-body); width:100%;
  }
  .cal-tl-card:hover{ filter:brightness(0.97); }
  .cal-tl-card-neutral{ border-left-color:var(--neutral); background:var(--neutral-soft); }
  .cal-tl-card-accent{ border-left-color:var(--accent); background:var(--accent-soft); }
  .cal-tl-card-brass{ border-left-color:var(--brass); background:var(--brass-soft); }
  .cal-tl-card-warn{ border-left-color:var(--warn); background:var(--warn-soft); }
  .cal-tl-card-good{ border-left-color:var(--good); background:var(--good-soft); }
  .cal-tl-card-bad{ border-left-color:var(--bad); background:var(--bad-soft); }
  .cal-tl-card-name{ font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-tl-card-date{ color:var(--ink-soft); font-size:10px; }
  .cal-tl-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:2px; font-size:11px; color:var(--ink-soft); }
  .upcoming-list{ display:flex; flex-direction:column; gap:6px; max-height:340px; overflow-y:auto; }
  .upcoming-row{
    display:grid; grid-template-columns:auto 1fr auto auto; gap:10px; align-items:center;
    padding:7px 8px; border-radius:8px; cursor:pointer; font-size:12px;
  }
  .upcoming-row:hover{ background:var(--surface-2); }
  .upcoming-date{ white-space:nowrap; }
  .upcoming-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); font-weight:600; }
  .upcoming-type{ display:flex; align-items:center; gap:5px; color:var(--ink-faint); font-size:11px; white-space:nowrap; }
  .upcoming-amt{ color:var(--ink-soft); font-weight:600; white-space:nowrap; min-width:48px; text-align:right; }
  .dd-stage-pill{ margin-left:auto; flex:none; }
  .locked-panel{
    border:1.5px dashed var(--border-strong); border-radius:10px; padding:20px 16px; text-align:center;
    color:var(--ink-soft); font-size:12.5px; display:flex; flex-direction:column; gap:6px; align-items:center;
  }
  .locked-panel .lock-icon{ font-size:20px; }
  .category{ border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .category > summary{
    list-style:none; cursor:pointer; padding:10px 13px; display:flex; align-items:center; gap:9px;
    font-family:var(--font-display); font-weight:800; font-size:13.5px; color:var(--brass);
    background:var(--surface-2); letter-spacing:.005em;
  }
  .category > summary::-webkit-details-marker{ display:none; }
  .category > summary::before{ content:"▸"; color:var(--ink-faint); font-size:11px; transition:transform .12s; }
  .category[open] > summary::before{ content:"▾"; }
  .category .cat-count{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); font-weight:500; }
  .dd-item{ padding:9px 13px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }
  .dd-item-row{ display:flex; align-items:center; gap:8px; }
  .dd-item-label{ font-size:12.5px; flex:1; line-height:1.35; }
  .dd-status{
    font-size:11px; font-weight:800; border-radius:6px; padding:4px 6px; border:1.5px solid var(--border);
    background:var(--surface); flex:none; width:118px; transition:background .1s,color .1s,border-color .1s;
  }
  .dd-item-row-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .dd-target-date{
    font-size:11px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
    border-radius:6px; padding:3px 6px; font-family:var(--font-body); flex:none;
  }
  .dd-target-date-label{ font-size:10px; color:var(--ink-faint); font-weight:600; flex:none; }
  .dd-overdue-flag{
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--bad-ink);
    background:var(--bad); border-radius:20px; padding:2px 8px; flex:none;
  }
  .dd-notes{
    font-size:12px; border:1px solid var(--border); background:var(--surface-2); border-radius:6px;
    padding:5px 8px; width:100%; color:var(--ink-soft);
  }
  .dd-notes:focus{ color:var(--ink); }
  .ic-criteria-head{
    padding:10px 13px; display:flex; align-items:center; gap:9px;
    font-family:var(--font-display); font-weight:800; font-size:14.5px; color:var(--brass);
    background:var(--surface-2); letter-spacing:-.005em;
  }
  /* ---------- IC screening scorecard rows (requirement / actual / fit / backup) ---------- */
  .ic-row{ padding:10px 13px 12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }
  .ic-row-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .ic-row-label{ font-size:12.5px; font-weight:700; flex:1; line-height:1.35; }
  .ic-row-requirement, .ic-row-actual{ display:flex; align-items:baseline; gap:8px; font-size:11.5px; }
  .ic-row-line-label{ flex:none; width:92px; white-space:nowrap; font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700; }
  .ic-row-req-text{ color:var(--ink-soft); line-height:1.4; }
  .ic-row-actual-value{ color:var(--ink); font-weight:700; }
  .ic-row-actual-input{
    font-size:12px; border:1px solid var(--border); background:var(--surface-2); border-radius:6px;
    padding:4px 8px; flex:1; color:var(--ink); min-width:120px;
  }
  .ic-row-actual-input:focus{ color:var(--ink); }
  .ic-criteria-source{ font-size:10.5px; font-weight:600; text-transform:none; letter-spacing:0; color:var(--ink-faint); font-family:var(--font-body); }
  .ic-rating-wrap{ display:flex; align-items:center; gap:4px; flex:none; }
  .ic-rating-input{
    width:56px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
    border-radius:6px; padding:3px 6px; font-size:11.5px; font-family:var(--font-mono); text-align:center; font-weight:700;
  }
  .ic-rating-input::placeholder{ color:var(--ink-faint); opacity:1; font-weight:400; }
  .ic-rating-bin{
    border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-soft);
    border-radius:6px; padding:3px 8px; font-size:10.5px; font-weight:700; cursor:pointer; font-family:var(--font-body);
  }
  .ic-rating-bin-yes.active{ background:var(--good); border-color:var(--good); color:var(--good-ink); }
  .ic-rating-bin-no.active{ background:var(--bad); border-color:var(--bad); color:var(--bad-ink); }
  .ic-row-remove{ flex:none; }
  .ic-row-add{ background:var(--surface-2); }
  .ic-row-add .field label{ font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700; }
  .ic-row-add .field input{
    font-size:12px; border:1px solid var(--border); background:var(--surface); border-radius:6px;
    padding:5px 8px; width:100%; box-sizing:border-box; color:var(--ink); font-family:var(--font-body);
  }
  /* ---------- master screening-criteria sheet editor ---------- */
  .mc-row{
    display:flex; align-items:flex-end; gap:8px; padding:8px 10px; border:1px solid var(--border);
    border-radius:8px; background:var(--surface-2); margin-bottom:6px;
  }
  .mc-row .field{ margin:0; }
  .mc-row .field label{ font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700; }
  .mc-row .field:first-child{ flex:0 0 160px; }
  .mc-row .field:nth-child(2){ flex:1; }
  .mc-row input{
    font-size:12px; border:1px solid var(--border); background:var(--surface); border-radius:6px;
    padding:5px 7px; width:100%; box-sizing:border-box; color:var(--ink); font-family:var(--font-body);
  }
  .mc-remove{ flex:none; margin-bottom:2px; }

  /* ---------- go / no-go decision (gates onboarding, feeds the IC memo) ---------- */
  .ic-decision-box{
    border:1px solid var(--border); border-radius:10px; padding:13px 14px;
    display:flex; flex-direction:column; gap:11px; background:var(--surface-2);
  }
  .ic-decision-suggest{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .ic-decision-suggest-label{ color:var(--ink-faint); font-weight:600; font-size:11.5px; }
  .ic-flag-toggle{
    display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--ink);
    cursor:pointer; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface);
  }
  .ic-flag-toggle input{ width:15px; height:15px; accent-color:#C0392B; cursor:pointer; }
  .ic-flag-badge{
    display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; padding:2px 7px;
    border-radius:20px; background:#C0392B; color:#fff; letter-spacing:.01em;
  }
  /* ---------- Harvey/Jay review flag (tasks) ---------- */
  .hj-flag-toggle{
    display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--ink);
    cursor:pointer; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2);
  }
  .hj-flag-toggle input{ width:15px; height:15px; accent-color:#6D4AA6; cursor:pointer; }
  .pill-hj{ background:#6D4AA6; color:#fff; font-weight:800; }
  .card-hj-flagged{ border-left-color:#6D4AA6 !important; box-shadow:inset 0 0 0 1px rgba(109,74,166,.25); }

  /* ---------- debt financing tracker (multi-source per deal) ---------- */
  .debt-wrap{ padding:2px 0; display:flex; flex-direction:column; gap:12px; }
  .capital-wrap{ display:flex; flex-direction:column; gap:0; }
  .capital-filter-bar{ display:flex; gap:6px; margin-bottom:16px; }
  .capital-chip{
    border:1px solid var(--border-strong); border-radius:20px; padding:6px 14px; font-size:12.5px; font-weight:700;
    background:var(--surface); color:var(--ink-soft);
  }
  .capital-chip.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .capital-section-title{
    font-family:var(--font-display); font-size:16px; font-weight:800; color:var(--brass); margin:0 0 12px;
    padding-bottom:6px; border-bottom:1px solid var(--border);
  }
  #equityWrap .capital-section-title{ margin-top:6px; }
  .debt-deal-card{
    border:1px solid var(--border); border-radius:10px; background:var(--surface);
    padding:12px 14px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow);
  }
  .debt-deal-head{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .debt-deal-name{
    background:none; border:none; padding:0; text-align:left; cursor:pointer; font-weight:700; font-size:13.5px;
    color:var(--ink); margin-right:auto;
  }
  .debt-deal-name:hover{ color:var(--accent); text-decoration:underline; }
  .debt-deal-stat{ font-size:11px; color:var(--ink-faint); font-weight:600; white-space:nowrap; }
  .debt-deal-stat b{ color:var(--ink); font-weight:700; }
  .debt-deal-stat-bad{ color:var(--bad); }
  .debt-deal-stat-bad b{ color:var(--bad); }
  .debt-source-list{ display:flex; flex-direction:column; gap:6px; }
  .debt-source-row{
    display:grid; grid-template-columns:minmax(140px,1.4fr) 150px minmax(110px,1fr) 110px 130px 28px;
    gap:8px; align-items:center; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2);
  }
  .debt-source-type, .debt-source-status, .debt-source-lender, .debt-source-amount, .debt-source-date{
    border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:6px;
    padding:5px 7px; font-size:11.5px; font-family:var(--font-body); width:100%; min-width:0;
  }
  .debt-source-remove{
    background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:13px; padding:4px;
    border-radius:6px; line-height:1;
  }
  .debt-source-remove:hover{ color:var(--bad); background:var(--bad-soft); }
  .debt-add-source{
    align-self:flex-start; background:none; border:1px dashed var(--border); color:var(--ink-soft);
    cursor:pointer; font-size:11.5px; font-weight:600; padding:6px 11px; border-radius:8px;
  }
  .debt-add-source:hover{ border-color:var(--accent); color:var(--accent); }

  /* ---------- brokers (CRM) ---------- */
  .brokers-wrap{ padding:2px 0; }
  .screen-wrap{ padding:2px 0; }
  .screen-card{ max-width:820px; }
  .screen-section-label{ font-weight:800; font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; margin:0 0 8px; }
  .screen-actions{ display:flex; gap:8px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  .criteria-wrap{ padding:2px 0; }
  .criteria-line-picker{ display:flex; flex-wrap:wrap; gap:7px; }
  .criteria-line-chip{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft); font-weight:600; font-size:12.5px;
    padding:7px 13px; border-radius:20px; cursor:pointer; font-family:var(--font-body);
  }
  .criteria-line-chip:hover{ border-color:var(--accent); color:var(--ink); }
  .criteria-line-chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .criteria-line-chip-add{ background:transparent; border-style:dashed; }
  .criteria-line-chip-wrap{ display:inline-flex; align-items:stretch; }
  .criteria-line-chip-wrap .criteria-line-chip{ border-radius:20px 0 0 20px; border-right:none; }
  .criteria-line-chip-del{
    border:1px solid var(--border); border-left:none; background:var(--surface-2); color:var(--ink-faint);
    font-size:11px; padding:7px 10px; border-radius:0 20px 20px 0; cursor:pointer; font-family:var(--font-body); line-height:1;
  }
  .criteria-line-chip-del:hover{ background:var(--bad-soft); color:var(--bad); border-color:var(--bad); }
  .criteria-line-chip-wrap:has(.criteria-line-chip.active) .criteria-line-chip-del{ border-color:var(--accent); }
  .suggested-tasks-wrap:empty{ display:none; }
  .suggested-tasks-list{ display:flex; flex-direction:column; gap:8px; }
  .suggested-task-row{
    display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--border);
    border-radius:9px; background:var(--surface-2);
  }
  .suggested-task-body{ display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
  .suggested-task-title{ font-weight:700; font-size:13px; color:var(--ink); }
  .suggested-task-notes{ font-size:11.5px; color:var(--ink-soft); }
  .suggested-task-add{ flex:none; padding:6px 12px; font-size:12px; }
  .suggested-task-dismiss{ flex:none; padding:6px 8px; font-size:12px; }
  @media (max-width:640px){ .suggested-task-row{ flex-wrap:wrap; } }
  /* ---------- brokers: vertical tier-grouped stacked layout (mirrors the Acquisitions
     pipeline's .stage-section/.stage-row pattern — reuses its generic row-content classes
     (.stage-row-top/-title/-sub/-fields/-actions), just with a 3-column grid since brokers
     have no "responsible owner" column). ---------- */
  .broker-row{
    background:var(--surface-2); border:1px solid var(--border); border-left:4px solid var(--neutral);
    border-radius:10px; padding:12px 14px; cursor:pointer; display:grid;
    grid-template-columns:minmax(200px,1.4fr) minmax(320px,2fr) 150px;
    gap:16px; align-items:start;
  }
  .broker-row:hover{ border-color:var(--ink-faint); }
  @media (max-width:980px){
    .broker-row{ grid-template-columns:1fr; }
    .broker-row .stage-row-actions{ flex-direction:row; align-items:center; justify-content:space-between; }
  }
  .broker-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .broker-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:13px 14px; display:flex; flex-direction:column; gap:8px; cursor:pointer; box-shadow:var(--shadow);
    transition:border-color .12s, transform .12s;
  }
  .broker-card:hover{ border-color:var(--border-strong); transform:translateY(-1px); }
  .broker-card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .broker-card-name{ font-weight:800; font-size:13.5px; color:var(--ink); }
  .broker-card-firm{ font-size:11.5px; color:var(--ink-soft); margin-top:-6px; }
  .broker-card-markets{ display:flex; flex-wrap:wrap; gap:4px; }
  .broker-card-contact{ display:flex; flex-direction:column; gap:2px; font-size:11px; color:var(--ink-soft); }
  .broker-card-nocontact{ color:var(--ink-faint); font-style:italic; }
  .broker-card-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; border-top:1px solid var(--border); padding-top:8px; margin-top:2px; }
  .broker-stat{ display:flex; flex-direction:column; gap:1px; align-items:center; text-align:center; }
  .broker-stat-value{ font-family:var(--font-mono); font-weight:800; font-size:14px; color:var(--accent-strong); }
  .broker-stat-label{ font-size:9px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700; }
  .broker-card-last{ font-size:10.5px; color:var(--ink-faint); }

  .broker-modal{ width:min(560px,100%); max-height:88vh; overflow-y:auto; }
  .broker-log-row{
    display:grid; grid-template-columns:120px 1fr 1fr auto; gap:8px; align-items:start;
    padding:9px 0; border-top:1px solid var(--border);
  }
  .broker-log-row .broker-log-date{
    font-size:11.5px; border:1px solid var(--border); background:var(--surface-2); border-radius:6px; padding:5px 6px; font-family:var(--font-body);
  }
  .broker-log-row .broker-log-note{
    font-size:12px; border:1px solid var(--border); background:var(--surface-2); border-radius:6px; padding:5px 8px; min-height:34px; resize:vertical; color:var(--ink-soft);
  }
  .broker-log-row .broker-log-link{
    font-size:11.5px; border:1px solid var(--border); background:var(--surface-2); border-radius:6px; padding:5px 8px; color:var(--ink-soft);
  }
  @media (max-width:560px){ .broker-log-row{ grid-template-columns:1fr; } }
  .broker-log-attach-area{ grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:1px; }
  .broker-log-attachments{ display:flex; flex-wrap:wrap; gap:6px; }
  .broker-log-attachment-open{ cursor:pointer; }
  .broker-log-attachment-open:hover{ text-decoration:underline; }
  .broker-log-file-label{
    display:inline-flex; align-items:center; gap:5px; cursor:pointer; font-size:11px; font-weight:600;
    color:var(--ink-soft); border:1px dashed var(--border); border-radius:6px; padding:4px 9px;
  }
  .broker-log-file-label:hover{ border-color:var(--accent); color:var(--ink); }
  .broker-log-file-label input[type=file]{ display:none; }
  .broker-log-attach-status{ font-size:11px; color:var(--ink-faint); }
  .broker-log-attach-status.warn{ color:var(--warn); }
  /* ---------- deal Excel-model upload + AI-extracted "gist" (Financial model / Full model built
     out) — same visual pattern as the broker call-log's file attachments (upload pill, status
     line) but scoped to a single file per deal rather than a list, plus a summary panel below. ---------- */
  .model-file-attach-area{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:2px; }
  .model-file-open{ cursor:pointer; }
  .model-file-open:hover{ text-decoration:underline; }
  .model-file-label{
    display:inline-flex; align-items:center; gap:5px; cursor:pointer; font-size:11.5px; font-weight:600;
    color:var(--ink-soft); border:1px dashed var(--border-strong); border-radius:6px; padding:5px 10px;
  }
  .model-file-label:hover{ border-color:var(--accent); color:var(--ink); }
  .model-file-label input[type=file]{ display:none; }
  .model-file-status{ font-size:11px; color:var(--ink-faint); }
  .model-file-status.warn{ color:var(--warn); }
  .model-gist-box{ border:1px solid var(--border-strong); border-radius:8px; padding:12px 14px; margin-top:10px; background:var(--surface-2); }
  .model-gist-summary{ font-size:12.5px; color:var(--ink); line-height:1.55; margin:0; white-space:pre-wrap; }
  .model-gist-figures{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin-top:10px; }
  .model-gist-figure{ display:flex; flex-direction:column; gap:1px; }
  .model-gist-figure-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700; }
  .model-gist-figure-value{ font-size:13px; font-weight:700; color:var(--ink); font-family:var(--font-mono); }
  .model-gist-meta{ font-size:10.5px; color:var(--ink-faint); margin-top:10px; }

  /* ---------- Contract documents (PSA/LOI/amendment upload + AI term extraction) — a list
     rather than the single-file model upload above, since a deal accumulates an LOI, then a PSA,
     then amendments over time; each upload gets its own extraction pass and review step before
     anything is written to the deal, since these are financial/legal terms worth double-checking
     rather than a low-stakes summary. ---------- */
  .contract-docs-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .contract-doc-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:7px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); font-size:12.5px; }
  .contract-doc-open{ cursor:pointer; font-weight:600; }
  .contract-doc-open:hover{ text-decoration:underline; }
  .contract-doc-summary{ color:var(--ink-soft); flex:1 1 100%; }
  .contract-doc-meta{ color:var(--ink-faint); font-size:11px; flex:1 1 100%; }
  .contract-doc-actions{ display:flex; gap:6px; align-items:center; margin-left:auto; }
  .contract-extract-review{ margin-top:8px; padding:10px 12px; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface-2); }
  .contract-extract-review-head{ font-size:12.5px; font-weight:700; margin-bottom:8px; color:var(--ink); }
  .contract-extract-review-rows{ display:flex; flex-direction:column; gap:7px; }
  .contract-extract-review-row{ display:flex; align-items:baseline; flex-wrap:wrap; gap:6px; font-size:12.5px; cursor:pointer; }
  .contract-extract-review-row input[type=checkbox]{ margin-right:2px; }
  .contract-extract-review-label{ font-weight:600; color:var(--ink); min-width:150px; }
  .contract-extract-review-from{ color:var(--ink-faint); text-decoration:line-through; }
  .contract-extract-review-arrow{ color:var(--ink-faint); }
  .contract-extract-review-to{ color:var(--good); font-weight:700; }
  .contract-extract-review-notes{ align-items:flex-start; margin-top:4px; }
  .contract-extract-notes-preview{ color:var(--ink-soft); white-space:pre-wrap; flex:1 1 260px; line-height:1.5; }
  .contract-extract-actions{ display:flex; gap:8px; margin-top:10px; }
  .broker-deal-list{ display:flex; flex-direction:column; }
  .broker-deal-row{
    display:flex; align-items:center; gap:10px; padding:8px 4px; border-top:1px solid var(--border);
    cursor:pointer; font-size:12px;
  }
  .broker-deal-row:hover{ background:var(--surface-2); }
  .broker-deal-name{ flex:1; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .broker-deal-price{ color:var(--ink-soft); font-size:11.5px; }

  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  @media (max-width:640px){
    .topbar{ gap:10px; }
    .search-input{ width:120px; }
    .who-input{ display:none; }
    .who-label{ display:none; }
  }
</style>
</head>
<body>

<div id="pwGateOverlay" style="position:fixed;inset:0;z-index:99999;background:var(--bg,#F6F9F9);display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;">
  <form id="pwGateForm" style="max-width:360px;width:calc(100% - 40px);padding:32px;background:var(--surface,#fff);border:1px solid var(--border,#CDDBDD);border-radius:var(--radius,10px);box-shadow:var(--shadow,0 10px 28px -14px rgba(24,49,57,.26));">
    <div style="font-family:'Source Serif 4',Georgia,serif;font-size:22px;font-weight:600;color:var(--ink,#183139);margin-bottom:4px;">Deal Desk</div>
    <div style="font-size:13px;color:var(--ink-soft,#526468);margin-bottom:20px;">Enter the password to continue.</div>
    <input type="password" id="pwGateInput" autocomplete="current-password" placeholder="Password" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border-strong,#AFC2C5);border-radius:8px;font-size:14px;margin-bottom:10px;">
    <div id="pwGateError" style="color:var(--bad,#B7382F);font-size:13px;min-height:18px;margin-bottom:6px;"></div>
    <button type="submit" id="pwGateSubmit" style="width:100%;padding:10px 12px;border:none;border-radius:8px;background:var(--accent,#183139);color:var(--accent-ink,#fff);font-size:14px;font-weight:600;cursor:pointer;">Enter</button>
  </form>
</div>

function gateAnswerTone(answer){
  const a = (answer||"").toLowerCase();
  if(/no-go|^pass$|pass —|terminate/.test(a)) return "bad";
  if(/hold|extend|gap|watch|lower ceiling/.test(a)) return "warn";
  if(a) return "good";
  return "neutral";
}
function gateNeedsReasonCode(answer){
  return /pass|no-go|terminate/i.test(answer||"");
}
function latestGateEntry(d, gateKey){
  const list = (d.gateLog||[]).filter(e=>e.gate===gateKey);
  if(!list.length) return null;
  return list.slice().sort((a,b)=> (a.at||"").localeCompare(b.at||"") || (a.loggedAt||"").localeCompare(b.loggedAt||""))[list.length-1];
}

const TARGET_MARKET_STATES = new Set(["FL","NY","NJ","CT","GA","TX","CO","AZ","NC","SC","CA","NV"]);
function icMarketActual(d){
  const code = dealStateCode(d);
  if(!code) return null;
  return `${code} — ${TARGET_MARKET_STATES.has(code) ? "target market" : "not a listed target market"}`;
}
function icMarketFit(d){
  const code = dealStateCode(d);
  if(!code) return null;
  return TARGET_MARKET_STATES.has(code) ? "fit" : "nofit";

function icSiteSizeActual(d){
  if(d.lotSizeAcres===undefined||d.lotSizeAcres===null||d.lotSizeAcres==="") return null;

function icSiteSizeFit(d){
  const ac = Number(d.lotSizeAcres);
  if(!ac) return null;
  if(ac>=2 && ac<=5) return "fit";

  return "nofit";
}
function icFootprintActual(d){
  const sf = Number(d.grossDevelopableSf);
  if(!sf) return null;
  return sf.toLocaleString()+" SF (gross developable)";
}
function icFootprintFit(d){
  const sf = Number(d.grossDevelopableSf);
  if(!sf) return null;
  if(sf>=40000) return "fit";

  return "nofit";
}

function icEconomicsActual(d){

function icEconomicsFit(d){

   non-binding, just a starting point for the analyst's actual decision below it */
function icSuggestion(d){
  const total = d.icTotal || activeIcCriteria(d).length;
  const fit = d.icFit||0, watch = d.icWatch||0, nofit = d.icNoFit||0;
  const assessed = fit+watch+nofit;
  if(!assessed) return null;
  if(nofit>0) return "no_go";
  if(watch>0 || assessed<total) return "hold";
  if(fit===total) return "go";
  return null;
}

function migrateDealStages(){
  deals.forEach((d,id)=>{
    const cur = d.stage || "prospecting";
    let mapped = STAGE_MIGRATION[cur];
    if(!mapped && !DEAL_STAGES.find(s=>s.key===cur)) mapped = DEAL_STAGES[0].key;
    if(mapped && mapped!==cur){
      d.stage = mapped;
      if(db) updateDeal(id, {stage: mapped});
    }
  });
}
/* one-time upgrade from the original single-lender debt fields to a debtSources[] array, so a
   deal can carry an acquisition loan, one or more construction lines, mezz debt, etc. as separate
   tranches — each with its own status, lender, committed amount and date. */
function migrateDebtSources(){
  deals.forEach((d,id)=>{
    if(Array.isArray(d.debtSources)) return;
    const hasLegacy = d.debtStatus || d.lenderName || d.debtCommittedAmount!=null || d.debtCommitmentDate;
    const sources = hasLegacy ? [{
      type: "Acquisition loan",
      lenderName: d.lenderName || "",
      status: d.debtStatus || "",
      committedAmount: d.debtCommittedAmount ?? null,
      commitmentDate: d.debtCommitmentDate || "",
    }] : [];
    d.debtSources = sources;
    if(db) updateDeal(id, {debtSources: sources});
  });
}

const STATE_OPTIONS = Object.entries(STATE_META)
  .sort((a,b)=>a[1].name.localeCompare(b[1].name))
  .map(([code,m])=>`<option value="${code}">${m.name} (${code})</option>`).join("");

const STATE_NAME_TO_CODE = Object.fromEntries(Object.entries(STATE_META).map(([code,m])=>[m.name.toLowerCase(), code]));
function parseStateFromAddress(addr){
  if(!addr) return null;
  const s = String(addr);
  // 1) a trailing 2-letter abbreviation, e.g. "…, Austin, TX 78701"
  const abbrMatches = [...s.matchAll(/,\s*([A-Za-z]{2})\b(?:\s*\d{5}(-\d{4})?)?/g)];
  if(abbrMatches.length){
    const code = abbrMatches[abbrMatches.length-1][1].toUpperCase();
    if(STATE_META[code]) return code;
  }
  // 2) fall back to a full state name written out anywhere in the address, e.g. "…, Phoenix, Arizona 85032"
  const lower = s.toLowerCase();
  let bestCode = null, bestIdx = -1;
  for(const [name, code] of Object.entries(STATE_NAME_TO_CODE)){
    const re = new RegExp("\\b"+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g");
    let m, lastIdx = -1;
    while((m = re.exec(lower))) lastIdx = m.index;
    if(lastIdx > bestIdx){ bestIdx = lastIdx; bestCode = code; }
  }
  return bestCode;
}
function dealStateCode(d){
  const explicit = (d.state||"").trim().toUpperCase();
  if(explicit && STATE_META[explicit]) return explicit;
  return parseStateFromAddress(d.address||"");
}

/* City-level "market" resolution for the by-market map view — same spirit as parseStateFromAddress:
   scan comma-separated address segments from the end for one that looks like a state code, and take
   the segment right before it as the city (handles "…, Brentwood, TN (Williamson County)" style
   trailing notes since the state-code match only needs to anchor the start of its segment). */
function parseCityStateFromAddress(addr){
  if(!addr) return null;
  const segments = String(addr).split(",").map(s=>s.trim()).filter(Boolean);
  for(let i=segments.length-1;i>=1;i--){
    const m = segments[i].match(/^([A-Za-z]{2})\b/);
    if(m && STATE_META[m[1].toUpperCase()]){
      const city = segments[i-1].replace(/\s+\d{5}(-\d{4})?$/,"").trim();
      if(city) return {city, state: m[1].toUpperCase()};
    }
  }
  return null;
}
function dealMarketKey(d){
  const cs = parseCityStateFromAddress(d.address||"");
  return cs ? `${cs.city}, ${cs.state}` : null;
}
/* Falls back to just the state when the address doesn't parse into a clean "City, ST" (e.g. a
   plot name with no city segment) — still better than a blank cell in the pipeline list, and only
   falls all the way back to "—" when neither is resolvable. */
function dealMarketLabel(d){
  return dealMarketKey(d) || (dealStateCode(d) ? (STATE_META[dealStateCode(d)]||{}).name : null) || "—";
}
function marketCoords(marketKey){
  if(!marketKey) return null;
  const c = MARKET_COORDS[marketKey.toLowerCase()];
  return c ? {lat:c[0], lon:c[1]} : null;
}

const PRIORITY_META = {
  low:    {label:"Low",    cls:"pill-neutral"},
  medium: {label:"Medium", cls:"pill-priority-medium"},
  high:   {label:"High",   cls:"pill-priority-high"},
};
/* Same high/medium/low scheme as PRIORITY_META, now also used to prioritize deals (not just
   tasks) — a manually-set field per deal, defaulting to "medium" when never set, so existing
   deals don't all read as unset. Priority gets its own dedicated green/yellow palette (--priority-high/
   --priority-medium) rather than reusing the good/warn/bad status tokens — "high priority" is not
   the same idea as "bad", so it shouldn't read as red. */
const DEAL_PRIORITY_RANK = {high:0, medium:1, low:2};
function dealPriority(d){ return (d && d.priority) || "medium"; }
function dealPriorityCompare(a,b){ return DEAL_PRIORITY_RANK[dealPriority(a)] - DEAL_PRIORITY_RANK[dealPriority(b)]; }
/* Small solid "color card" badge for priority, styled to sit alongside productLineBadgeHtml so
   priority reads at a glance in the same badge row — not just in the priority-select dropdown.
   Low priority is the default/unflagged state, so it's left off to avoid cluttering every card. */
function priorityBadgeHtml(d){
  const p = dealPriority(d);
  if(p==="low") return "";
  const meta = PRIORITY_META[p];
  return `<span class="pill pill-solid ${meta.cls}" title="Priority: ${meta.label}">${p==="high"?"HIGH":"MED"}</span>`;
}
/* Overall screening-criteria quality score (0–10, tenths) — the average of every numeric
   criterion rating entered for a deal (see setCriteriaItem's "rating" field, recomputed in
   recomputeIcCriteria and denormalized onto the deal as icScore/icScoreCount so lists that
   don't have the criteria subcollection loaded — e.g. the prospecting list — can still show it). */
function icScoreBadgeHtml(d){
  if(d.icScore==null || !d.icScoreCount) return "";
  const cls = d.icScore>=7.5 ? "pill-good" : d.icScore>=5 ? "pill-warn" : "pill-bad";
  return `<span class="pill ${cls}" title="Average of ${d.icScoreCount} rated screening criteria">★ ${d.icScore.toFixed(1)}/10</span>`;
}
function icScorePillHtml(d){
  if(d.icScore==null || !d.icScoreCount) return "";
  const cls = d.icScore>=7.5 ? "pill-good" : d.icScore>=5 ? "pill-warn" : "pill-bad";
  return `<span class="pill pill-solid ${cls}" title="Average of ${d.icScoreCount} rated screening criteria">★ ${d.icScore.toFixed(1)}/10</span>`;
}

  "1": {label:"Tier 1", cls:"pill-accent"},

/* Product line color coding — a stable color per distinct product line (e.g. "Porsche Design Clubhouse"
   vs "Highlands Ranch"), recomputed whenever the deals collection changes so it stays consistent across
   every render without colliding, up to 5 concurrent product lines. */
const PRODUCT_LINE_PALETTE = ["accent","brass","good","warn","neutral"];
let productLineColorMap = new Map();
function recomputeProductLineColors(){
  const names = [...new Set([...deals.values()].map(d=>(d.productLine||"").trim()).filter(Boolean))].sort();
  productLineColorMap = new Map(names.map((n,i)=>[n, PRODUCT_LINE_PALETTE[i % PRODUCT_LINE_PALETTE.length]]));
}
function productLineAbbr(pl){
  const words = pl.trim().split(/\s+/).filter(Boolean);
  if(words.length===1) return words[0].slice(0,4).toUpperCase();
  return words.map(w=>w[0]).join("").toUpperCase().slice(0,4);
}
function productLineBadgeHtml(d){
  const pl = (d.productLine||"").trim();
  if(!pl) return "";
  const color = productLineColorMap.get(pl) || "neutral";
  return `<span class="pill pill-${color}" title="Product line: ${escapeAttr(pl)}">${escapeHtml(productLineAbbr(pl))}</span>`;
}
function tierPillHtml(d){
  const t = MARKET_TIER_META[d.marketTier];
  return t ? `<span class="pill ${t.cls}" title="Market tier ${d.marketTier}">${t.label}</span>` : "";
}
function icSummaryPillHtml(d){
  const total = d.icTotal || activeIcCriteria(d).length;
  const assessed = (d.icFit||0)+(d.icWatch||0)+(d.icNoFit||0);
  if(!assessed) return "";
  let cls = "pill-neutral";
  if(d.icNoFit>0) cls = "pill-bad";
  else if(d.icWatch>0) cls = "pill-warn";
  else if(d.icFit===assessed) cls = "pill-good";
  return `<span class="pill ${cls}" title="Investment criteria: ${d.icFit||0} fit, ${d.icWatch||0} watch, ${d.icNoFit||0} doesn't fit">${assessed}/${total} criteria</span>`;
}

const PSA_STATUS_OPTIONS = ["Not Started","Under Negotiation","Executed","Terminated"];
const DEPOSIT_STATUS_OPTIONS = ["Not Due","Due","Paid","Applied to Price","Refunded"];

function psaPillClass(s){
  if(s==="Executed") return "pill-good";
  if(s==="Under Negotiation") return "pill-warn";
  if(s==="Terminated") return "pill-bad";
  return "pill-neutral";
}
function depositDotClass(s){
  if(s==="Paid" || s==="Applied to Price") return "dot-good";
  if(s==="Due") return "dot-warn";
  if(s==="Refunded") return "dot-accent";
  return "dot-neutral";
}

/* Property type & product line are user-maintained category lists (add/edit from the dropdown
   itself, see openCategoryManagerModal), not hardcoded like deal type / source below — so they
   start as plain `let` arrays with sensible defaults and are persisted to settings/categories
   when db is connected. Product line starts empty and is seeded once from whatever values are
   already in use on deals (see migrateProductLineOptions). */
let propertyTypeOptions = ["Auto Condo","Multi-Family","Retail","Office","Industrial","Land","Mixed-Use","Hospitality","Self-Storage","Other"];
let productLineOptions = [];
let categorySettingsLoaded = false;
function saveCategorySettings(){
  if(db) db.doc("settings/categories").set({propertyTypes: propertyTypeOptions, productLines: productLineOptions});
}
function migrateProductLineOptions(){
  if(db && !categorySettingsLoaded) return;
  if(productLineOptions.length) return;
  const seeded = [...new Set([...deals.values()].map(d=>(d.productLine||"").trim()).filter(Boolean))].sort();
  if(seeded.length){ productLineOptions = seeded; saveCategorySettings(); }

   entirely computed from the deals collection so it never goes stale */
function brokerDealStats(brokerId){
  const linked = [...deals.entries()].filter(([id,d])=>(d.brokerId||"")===brokerId);
  const active = linked.filter(([id,d])=>(d.stage||"prospecting")!=="dead");

   trimmed) and reuses that record; otherwise creates a new one. Fills in firm/phone/email on an
   existing match only where it's currently blank, so it never clobbers info someone already
   entered. Returns the broker id. */
async function findOrCreateBrokerByName(name, extra){
  extra = extra || {};
  const cleanName = (name||"").trim();
  if(!cleanName) return "";
  const match = [...brokers.entries()].find(([id,b])=> (b.name||"").trim().toLowerCase()===cleanName.toLowerCase());
  if(match){
    const [id, b] = match;
    const patch = {};
    if(extra.firm && !b.firm) patch.firm = extra.firm;
    if(extra.phone && !b.phone) patch.phone = extra.phone;
    if(extra.email && !b.email) patch.email = extra.email;
    if(Object.keys(patch).length) await updateBroker(id, patch);
    return id;
  }
  return await createBroker({
    name: cleanName,
    firm: extra.firm||"",
    phone: extra.phone||"",
    email: extra.email||"",
    tier: "",
    notes: "",
  });

/* funnel progress (excludes the "dead" stage from the sequence) */
function dealStageProgressPct(d){
  const seq = DEAL_STAGES.filter(s=>s.key!=="dead");
  const stage = d.stage || "prospecting";
  if(stage==="dead") return {pct:100, dead:true};
  const idx = seq.findIndex(s=>s.key===stage);
  const pct = seq.length>1 ? Math.round((Math.max(idx,0)/(seq.length-1))*100) : 0;
  return {pct, dead:false};
}
/* Red -> yellow -> green heat-map scale for progress, independent of each stage's own
   categorical brand color (which pills/headers elsewhere still use) — so "how far along"
   reads instantly from color alone, the way a traffic light does. */
function progressGradientColor(idx, total){
  const i = Math.max(idx, 0);
  const hue = total>1 ? Math.round((i/(total-1))*120) : 0;
  // Fixed lightness reads fine as dark text on the light-mode surface, but the same lightness is
  // too dim against dark-mode's dark surfaces (red in particular — it's the darkest-reading hue
  // at a given lightness) — so dark mode uses a lighter variant, same hue/saturation.
  const light = isDarkModeActive() ? 62 : 42;
  return `hsl(${hue}, 68%, ${light}%)`;
}
function progressColorForDeal(d){
  const seq = DEAL_STAGES.filter(s=>s.key!=="dead");
  const stage = d.stage || "prospecting";
  if(stage==="dead") return "var(--bad)";
  return progressGradientColor(seq.findIndex(s=>s.key===stage), seq.length);
}
function dealProgressBarHtml(d, opts){
  opts = opts||{};
  const {pct, dead} = dealStageProgressPct(d);
  const size = opts.size||"sm";
  const seq = DEAL_STAGES.filter(s=>s.key!=="dead");
  const stage = DEAL_STAGES.find(s=>s.key===(d.stage||"prospecting")) || DEAL_STAGES[0];
  const curIdx = seq.findIndex(s=>s.key===(d.stage||"prospecting"));
  const curColor = progressColorForDeal(d);
  const segsHtml = dead
    ? `<span class="deal-progress-seg-dead"></span>`
    : seq.map((s,i)=>{
        const reached = i<=curIdx;
        const isCurrent = i===curIdx;
        const color = progressGradientColor(i, seq.length);
        const style = reached ? ` style="background:${color};color:${color}"` : "";
        return `<span class="deal-progress-seg${reached?" reached":""}${isCurrent?" current":""}"${style} title="${escapeAttr(s.title)}"></span>`;
      }).join("");
  return `<div class="deal-progress deal-progress-${size}${dead?" dead":""}" title="${escapeAttr(stage.title)} · ${pct}%">
    ${opts.showLabel!==false ? `<span class="deal-progress-pct" style="color:${curColor}">${dead?"Dead":stage.title}</span>` : ""}
    <span class="deal-progress-track">${segsHtml}</span>
  </div>`;
}

function dealPassesFilters(d){
  const f = dashboardFilters;
  if(f.stage && (d.stage||"prospecting")!==f.stage) return false;
  if(f.productLine && (d.productLine||"")!==f.productLine) return false;
  if(f.source && (d.source||"")!==f.source) return false;
  if(f.propertyType && (d.propertyType||"")!==f.propertyType) return false;
  if(f.lead && (d.lead||"")!==f.lead) return false;
  if(f.state && dealStateCode(d)!==f.state) return false;
  if(f.recommendation && (d.recommendation||"")!==f.recommendation) return false;
  if(f.marketTier && (d.marketTier||"")!==f.marketTier) return false;
  if(f.icDecision){
    if(f.icDecision==="none"){ if(d.icDecision) return false; }
    else if((d.icDecision||"")!==f.icDecision) return false;
  }
  if(f.modelStatus){
    const status = d.modelStatus||"boe";
    if(status!==f.modelStatus) return false;
  }
  if(f.zoningStatus){
    const hasZoning = !!(d.zoningDesignation||"").trim();
    if(f.zoningStatus==="done" && !hasZoning) return false;
    if(f.zoningStatus==="missing" && hasZoning) return false;
  }
  if(f.demoStatus){
    const hasDemo = d.demoWealthIndex!=null || d.demoHh200k_5!=null || d.demoHomeValue_5!=null || d.demoPopulation!=null;
    if(f.demoStatus==="done" && !hasDemo) return false;
    if(f.demoStatus==="missing" && hasDemo) return false;
  }
  if(f.openQuestions){
    const hasOpen = Array.isArray(d.openQuestions) && d.openQuestions.some(q=>(q.status||"Open")==="Open" && (q.question||"").trim());
    if(f.openQuestions==="yes" && !hasOpen) return false;
    if(f.openQuestions==="no" && hasOpen) return false;
  }
  return true;
}

let themeMode = (()=>{ try{ return localStorage.getItem("dealdesk_theme")||"system"; }catch(e){ return "system"; } })();

  const attr = document.documentElement.getAttribute("data-theme");

/* =================== formatting helpers =================== */
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return "";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function daysUntil(iso, refIso){
  const d = new Date(iso+"T00:00:00");
  if(isNaN(d)) return null;
  const now = refIso ? new Date(refIso+"T00:00:00") : new Date();
  now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function urgencyClass(iso){
  const days = daysUntil(iso);
  if(days===null) return "pill-neutral";
  if(days<0) return "pill-bad";
  if(days<=14) return "pill-warn";
  return "pill-neutral";
}
function urgencySuffix(iso){
  const days = daysUntil(iso);
  if(days===null) return "";
  if(days<0) return " · overdue";
  if(days===0) return " · today";
  if(days<=14) return ` · ${days}d`;
  return "";
}
function fmtMoneyShort(n){
  if(n===undefined||n===null||n==="") return "";
  const num = Number(n);
  if(isNaN(num)) return "";
  if(Math.abs(num)>=1000000) return "$"+(num/1000000).toFixed(num%1000000===0?0:1)+"M";
  if(Math.abs(num)>=1000) return "$"+(num/1000).toFixed(num%1000===0?0:1)+"K";
  return "$"+num.toLocaleString();
}
function fmtAcres(n){
  if(n===undefined||n===null||n==="") return "";
  const num = Number(n);
  if(isNaN(num)) return "";
  return (Number.isInteger(num)?num:num.toFixed(1))+" ac";
}
function perAcre(d){
  if(d.purchasePrice && d.lotSizeAcres) return Number(d.purchasePrice)/Number(d.lotSizeAcres);
  return null;
}
/* Earliest deposit that's still open (not paid/applied/refunded) — mirrors the deposit logic in
   getDealEvents/getCapitalNeedItems but scoped to a single deal, for the dashboard basics table. */
function nextDepositDue(d){
  const candidates = [];
  if(d.deposit1Amount && CAPNEED_OPEN_STATUSES.has(d.deposit1Status||"Not Due")){
    const date = d.deposit1Date || d.effectiveDate;
    if(date) candidates.push({date, amount:Number(d.deposit1Amount)||0});
  }
  if(d.deposit2Date && d.deposit2Amount && CAPNEED_OPEN_STATUSES.has(d.deposit2Status||"Not Due")){
    candidates.push({date:d.deposit2Date, amount:Number(d.deposit2Amount)||0});
  }
  (d.extraDeposits||[]).forEach(dep=>{
    if(dep.date && dep.amount && CAPNEED_OPEN_STATUSES.has(dep.status||"Not Due")) candidates.push({date:dep.date, amount:Number(dep.amount)||0});
  });
  candidates.sort((a,b)=> a.date<b.date?-1:1);
  return candidates[0] || null;
}
function pricePerUnit(d){
  if(d.purchasePrice && d.targetUnits) return Number(d.purchasePrice)/Number(d.targetUnits);
  return null;
}
/* Combined "4.5 ac · $4.2M/ac" cell used in both pipeline row views, so acreage and its per-acre
   price read together at a glance without opening the deal — same spirit as the existing $/unit
   column, just for the acreage-based read of a deal rather than the density-based one. Reuses the
   existing perAcre/fmtAcres helpers (already relied on by the dashboard basics table) rather than
   re-deriving the same numbers. */
function acresSummaryText(d){
  const ppa = perAcre(d);
  if(!d.lotSizeAcres && ppa==null) return "—";
  const acresStr = d.lotSizeAcres ? fmtAcres(d.lotSizeAcres) : "—";
  const ppaStr = ppa!=null ? fmtMoneyShort(ppa)+"/ac" : "—";
  return `${acresStr} · ${ppaStr}`;
}

/* ---- back-of-envelope underwriting ---- */
function calcUnderwriting(d){
  const sf = Number(d.grossDevelopableSf)||0;
  const buildPerSf = Number(d.buildCostPerSf)||0;
  const softPct = (d.softCostPct===null||d.softCostPct===undefined?20:Number(d.softCostPct))/100;
  const contPct = (d.contingencyPct===null||d.contingencyPct===undefined?5:Number(d.contingencyPct))/100;
  const salePerSf = Number(d.salePricePerSf)||0;
  const sellPct = (d.sellingCostPct===null||d.sellingCostPct===undefined?6:Number(d.sellingCostPct))/100;
  const land = Number(d.purchasePrice)||0;
  if(!sf) return null;
  const buildCost = sf*buildPerSf;
  const softCost = buildCost*softPct;
  const contingency = (buildCost+softCost)*contPct;
  const totalDevCost = land + buildCost + softCost + contingency;
  const grossRevenue = sf*salePerSf;
  const sellingCost = grossRevenue*sellPct;
  const netProceeds = grossRevenue - sellingCost;
  const netProfit = netProceeds - totalDevCost;
  const marginRevenue = grossRevenue>0 ? netProfit/grossRevenue : null;
  const marginCost = totalDevCost>0 ? netProfit/totalDevCost : null;
  const costPerSf = sf>0 ? totalDevCost/sf : null;
  const spreadPerSf = (salePerSf && costPerSf!==null) ? salePerSf-costPerSf : null;
  return {buildCost,softCost,contingency,totalDevCost,grossRevenue,sellingCost,netProceeds,netProfit,marginRevenue,marginCost,costPerSf,spreadPerSf,sf,salePerSf};
}
/* capital needed to close/build a deal, split debt/equity by loan-to-cost %.
   Uses full development cost when back-of-envelope underwriting is filled in;
   otherwise falls back to purchase price alone so early-stage deals still show a number. */
function dealDebtPct(d){
  const rawPct = (d.debtPct===null||d.debtPct===undefined) ? 65 : Number(d.debtPct);
  return Math.max(0, Math.min(100, isNaN(rawPct)?65:rawPct));
}
function calcCapitalStack(d){
  const uw = calcUnderwriting(d);
  const basis = (uw && uw.totalDevCost) ? uw.totalDevCost : (Number(d.purchasePrice)||0);
  if(!basis) return null;
  const debtPct = dealDebtPct(d);
  const debtAmount = basis*(debtPct/100);
  const equityAmount = basis - debtAmount;
  return {basis, debtPct, debtAmount, equityAmount, fromFullUw: !!(uw && uw.totalDevCost)};
}
/* Margin sensitivity — reruns the exact same underwriting math above with a couple of stressed
   inputs (cost overrun, softer sale price) instead of the entered assumptions, so the IC memo can
   show a downside case without anyone re-typing numbers anywhere. Purely computed, no outside data. */
function calcSensitivityScenarios(d){
  const base = calcUnderwriting(d);
  if(!base) return null;
  const run = (overrides)=> calcUnderwriting(Object.assign({}, d, overrides));
  const buildCost = Number(d.buildCostPerSf)||0;
  const salePrice = Number(d.salePricePerSf)||0;
  return [
    {key:"base",  label:"Base case",              uw: base},
    {key:"cost",  label:"Construction cost +10%",  uw: run({buildCostPerSf: buildCost*1.10})},
    {key:"price", label:"Sale price −10%",         uw: run({salePricePerSf: salePrice*0.90})},
    {key:"both",  label:"Both together",           uw: run({buildCostPerSf: buildCost*1.10, salePricePerSf: salePrice*0.90})},
  ];
}
function sensitivityTableHtml(d){
  const scenarios = calcSensitivityScenarios(d);
  if(!scenarios) return `<div class="locked-note">Fill in the back-of-envelope underwriting above to see margin sensitivity.</div>`;
  return `<table class="sensitivity-table">
    <thead><tr><th>Scenario</th><th>Net profit</th><th>Margin (rev.)</th></tr></thead>
    <tbody>${scenarios.map(s=>`<tr class="${s.key==='base'?'base-case':''}">
      <td>${s.label}</td>
      <td>${s.uw&&s.uw.netProfit!=null?fmtMoneyShort(s.uw.netProfit):"—"}</td>
      <td>${s.uw&&s.uw.marginRevenue!=null?(s.uw.marginRevenue*100).toFixed(1)+"%":"—"}</td>
    </tr>`).join("")}</tbody>
  </table>`;
}
function marginPillClass(m){
  if(m===null||m===undefined) return "pill-neutral";
  if(m>=0.20) return "pill-good";
  if(m>=0.10) return "pill-warn";
  return "pill-bad";
}
/* Bold, obvious color-coding for DD/IC status <select>s — fills the select itself with the
   status's solid color (from STATUS_META/IC_STATUS_META's existing .cls, e.g. "pill-good"),
   so the checklist reads like Northspyre's colored status badges at a glance while staying
   a real inline-editable control. */
function colorSelectByStatus(sel, cls){
  const color = (cls||"pill-neutral").replace("pill-","");
  sel.style.background = `var(--${color})`;
  sel.style.color = `var(--${color}-ink)`;
  sel.style.borderColor = `var(--${color})`;
}
function numOrNull(id){
  const el = document.getElementById(id);
  if(!el) return null;
  const v = el.value;
  return v===""?null:Number(v);
}
function whoName(){ return (document.getElementById("whoInput").value||"").trim(); }
function escapeAttr(s){ return String(s||"").replace(/"/g,"&quot;"); }
function escapeHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function pageDividerHtml(label){ return `<div class="page-divider"><span class="page-divider-label">${escapeHtml(label)}</span></div>`; }
function pageDividerLineHtml(){ return `<hr class="page-divider-line">`; }
function addDaysIso(iso, n){
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function normalizeUrl(u){
  if(!u) return "";
  return /^https?:\/\//i.test(u) ? u : "https://"+u;
}

     changefeed events, and every listener on that name (collection- or doc-level) reads from the

async function supabaseSignIn(){

  try{
    const { data } = await sb.auth.getSession();
    if(!data || !data.session){

/* Generic docs(collection,id,data) table + Realtime adapter — see the big comment above this
   section for why this exists. Every logical collection this app uses (including 3-segment
   subcollection paths like deals/{id}/checklist) is flattened into one Postgres table, and this
   function keeps one client-side cache + one Realtime channel per flattened collection name so
   every listener sees the same up-to-date set of docs. */
function makeSupabaseDb(client){
  const collCache = {};        // flattened collection name -> Map(id -> data)
  const collLoaded = {};       // flattened collection name -> boolean (initial fetch done)
  const collLoadPromises = {}; // flattened collection name -> in-flight initial-fetch promise
  const collListeners = {};    // flattened collection name -> [{type:'collection'|'doc', id?, cb}]
  const collChannels = {};     // flattened collection name -> realtime channel (created once)

  function notify(collName){
    const cache = collCache[collName] || new Map();
    (collListeners[collName] || []).slice().forEach(entry=>{
      if(entry.type === "collection"){
        const docs = [...cache.entries()].map(([id, data])=>({ id, data: ()=>data }));
        entry.cb({ docs, empty: docs.length===0, size: docs.length, forEach(fn){ docs.forEach(fn); } });
      } else {
        const exists = cache.has(entry.id);
        entry.cb({ exists, id: entry.id, data: ()=> exists ? cache.get(entry.id) : undefined });
      }
    });
  }

  async function ensureLoaded(collName){
    if(collLoaded[collName]) return;
    if(!collLoadPromises[collName]){
      collLoadPromises[collName] = (async ()=>{
        const { data, error } = await client.from("docs").select("id,data").eq("collection", collName);
        if(error){ console.error("Supabase load failed for", collName, error); return; }
        const cache = collCache[collName] = collCache[collName] || new Map();
        (data || []).forEach(row=>{ cache.set(row.id, row.data); });
        collLoaded[collName] = true;
      })();
    }
    await collLoadPromises[collName];
  }

  function ensureChannel(collName){
    if(collChannels[collName]) return;
    collCache[collName] = collCache[collName] || new Map();
    collChannels[collName] = client
      .channel("docs-" + collName)
      .on("postgres_changes", { event: "*", schema: "public", table: "docs", filter: "collection=eq." + collName }, (payload)=>{
        const cache = collCache[collName];
        if(payload.eventType === "DELETE") cache.delete(payload.old.id);
        else cache.set(payload.new.id, payload.new.data);
        notify(collName);
      })
      .subscribe();
  }

  function genId(){ return "s" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

  function docRef(collName, id){
    return {
      async set(data){
        const { error } = await client.from("docs").upsert({ collection: collName, id, data, updated_at: new Date().toISOString() });
        if(error) throw error;
        (collCache[collName] = collCache[collName] || new Map()).set(id, data);
        notify(collName);
      },
      async update(patch){
        const { error } = await client.rpc("merge_doc", { p_collection: collName, p_id: id, p_patch: patch });
        if(error) throw error;
        const cache = collCache[collName] = collCache[collName] || new Map();
        cache.set(id, Object.assign({}, cache.get(id) || {}, patch));
        notify(collName);
      },
      async delete(){
        const { error } = await client.from("docs").delete().eq("collection", collName).eq("id", id);
        if(error) throw error;
        if(collCache[collName]) collCache[collName].delete(id);
        notify(collName);
      },
      onSnapshot(cb, errCb){
        const entry = { type: "doc", id, cb };
        (collListeners[collName] = collListeners[collName] || []).push(entry);
        ensureChannel(collName);
        ensureLoaded(collName).then(()=>notify(collName)).catch(e=>{ if(errCb) errCb(e); });
        return ()=>{ collListeners[collName] = (collListeners[collName] || []).filter(e=>e!==entry); };
      },
    };
  }

  function queryRef(collName, limitN){
    return {
      async get(){
        await ensureLoaded(collName);
        const cache = collCache[collName] || new Map();
        let ids = [...cache.keys()];
        if(limitN) ids = ids.slice(0, limitN);
        const docs = ids.map(id=>({ id, data: ()=>cache.get(id) }));
        return { docs, empty: docs.length===0, size: docs.length, forEach(fn){ docs.forEach(fn); } };
      },
    };
  }

  function collectionRef(collName){
    return {
      async add(data){
        const id = genId();
        const { error } = await client.from("docs").insert({ collection: collName, id, data, updated_at: new Date().toISOString() });
        if(error) throw error;
        (collCache[collName] = collCache[collName] || new Map()).set(id, data);
        notify(collName);
        return { id };
      },
      doc(id){ return docRef(collName, id); },
      limit(n){ return queryRef(collName, n); },
      onSnapshot(cb, errCb){
        const entry = { type: "collection", cb };
        (collListeners[collName] = collListeners[collName] || []).push(entry);
        ensureChannel(collName);
        ensureLoaded(collName).then(()=>notify(collName)).catch(e=>{ if(errCb) errCb(e); });
        return ()=>{ collListeners[collName] = (collListeners[collName] || []).filter(e=>e!==entry); };
      },
    };
  }

  function splitPath(p){ return p.split("/").filter(Boolean); }
  function flattenCollection(parts){
    if(parts.length===1) return parts[0];
    if(parts.length===3) return parts[2] + "__" + parts[1];
    throw new Error("Unsupported collection path: " + parts.join("/"));
  }

  return {
    collection(path){ return collectionRef(flattenCollection(splitPath(path))); },
    doc(path){
      const parts = splitPath(path);
      if(parts.length===2) return docRef(parts[0], parts[1]);
      if(parts.length===4) return docRef(parts[2] + "__" + parts[1], parts[3]);
      throw new Error("Unsupported doc path: " + path);
    },
    batch(){
      const ops = [];
      return {
        set(ref, data){ ops.push({ type: "set", ref, data }); },
        update(ref, data){ ops.push({ type: "update", ref, data }); },
        delete(ref){ ops.push({ type: "delete", ref }); },
        async commit(){
          for(const op of ops){
            if(op.type==="set") await op.ref.set(op.data);
            else if(op.type==="update") await op.ref.update(op.data);
            else if(op.type==="delete") await op.ref.delete();
          }
        },
      };
    },
  };
}

/* AI sampler ("sample" capability replacement) — proxies through this site's own /api/sample
   serverless function so the Anthropic API key never reaches the browser. Matches the shape the
   rest of the app already calls: sample(prompt, opts) -> {text}, sample.json(prompt, opts) -> parsed object. */
/* Builds a readable message from a failed server-endpoint response (/api/sample or /api/fetch-
   listing), and stows the raw detail on the thrown Error so callers can show it (rather than a
   generic "something went wrong") — this is what actually points at *why* a screening/extraction/
   fetch call failed (missing API key, a bad model name, a rate limit, a site blocking the fetch,
   etc.) instead of hiding it. */
async function apiError(res){
  let body = null;
  try{ body = await res.json(); }catch(e){}
  const detail = (body && (body.detail || body.error)) || ("HTTP " + res.status);
  const err = new Error("Request failed: " + detail);
  err.detail = detail;
  return err;
}
async function sampleApi(prompt, opts){
  const res = await fetch("/api/sample", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt, modelTier: (opts && opts.modelTier) || "default" }),
  });
  if(!res.ok) throw await apiError(res);
  const data = await res.json();
  return { text: (data.text || "").trim() };
}
sampleApi.json = async function(prompt, opts){
  const res = await fetch("/api/sample", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt, json: true, modelTier: (opts && opts.modelTier) || "default" }),
  });
  if(!res.ok) throw await apiError(res);
  const data = await res.json();
  return data.result;
};

/* Server-side fetch of a listing URL (Crexi, LoopNet, a brokerage page, etc.), routed through
   /api/fetch-listing so the browser doesn't hit that site's CORS restrictions directly. Many CRE
   listing sites block automated requests outright or render their content with JavaScript (so the
   raw HTML has no useful text) — this is best-effort, and callers are expected to show whatever
   specific reason comes back rather than a generic failure. */
async function fetchListingText(url){
  const res = await fetch("/api/fetch-listing", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url }),
  });
  if(!res.ok) throw await apiError(res);
  const data = await res.json();
  return data.text || "";
}

/* downloads capability replacement — a plain Blob + <a download> click, no capability needed in a browser. */
async function ensureDownloadsCap(){
  return {
    async save({ filename, data }){
      const blob = new Blob([data], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename || "download.csv";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    },
  };
}

function sweepCompletedTasks(){
  if(!autoClearDays || autoClearDays<=0) return;
  const cutoffMs = autoClearDays*86400000, now = Date.now();
  tasks.forEach((d,id)=>{
    if(d.column==="complete" && d.completedAt){
      const age = now - new Date(d.completedAt).getTime();
      if(age > cutoffMs) deleteTask(id);
    }
  });
}

   excludes high-frequency/low-signal fields (notes, deposits, checklist/criteria items, photos)

const DEAL_ACTIVITY_FIELDS = {
  stage:               {label:"Stage",                fmt:v=> (DEAL_STAGES.find(s=>s.key===v)||{}).title || "—"},
  name:                {label:"Deal name",             fmt:v=> v || "—"},
  purchasePrice:       {label:"Purchase price",        fmt:v=> v ? fmtMoneyShort(v) : "—"},
  closingDate:         {label:"Expected close",        fmt:v=> v ? fmtDate(v) : "—"},

  decisionRequired:    {label:"Decision needed",       fmt:v=> (v||"").trim() || "—"},
  recommendation:      {label:"Recommendation",        fmt:v=> (REC_META[v]||{}).label || "—"},

};
function logDealActivity(dealId, before, patch){
  if(!db) return;
  const b = before || {};
  const name = patch.name || b.name || b.address || "Untitled deal";
  const changes = [];
  Object.keys(DEAL_ACTIVITY_FIELDS).forEach(field=>{
    if(!(field in patch)) return;
    const meta = DEAL_ACTIVITY_FIELDS[field];
    const from = b[field], to = patch[field];
    if(String(from||"")===String(to||"")) return;
    changes.push({field, label:meta.label, from:meta.fmt(from), to:meta.fmt(to)});
  });
  if(!changes.length) return;
  db.collection("activity").add({dealId, dealName:name, at:new Date().toISOString(), who:whoName()||"", changes}).catch(()=>{});
}

function recomputeIcCriteria(dealId){
  const cache = criteriaCache.get(dealId) || new Map();
  const d = deals.get(dealId) || {};
  const list = activeIcCriteria(d);
  let fit=0, watch=0, nofit=0;
  let scoreSum=0, scoreCount=0;
  list.forEach(item=>{
    const v = cache.get(item.key);
    if(!v) return;
    if(v.status==="fit") fit++; else if(v.status==="watch") watch++; else if(v.status==="nofit") nofit++;
    if(typeof v.rating==="number" && !isNaN(v.rating)){ scoreSum += v.rating; scoreCount++; }
  });
  const icScore = scoreCount ? Math.round((scoreSum/scoreCount)*10)/10 : null;
  updateDeal(dealId, {icFit:fit, icWatch:watch, icNoFit:nofit, icTotal:list.length, icScore, icScoreCount:scoreCount});
}
