<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- Supabase (Postgres + Realtime + Anonymous Auth — no Google account required). A small adapter
     further down in this file wraps the Supabase client so the app's existing db.collection()/
     db.doc() call sites don't need to change. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.js"></script>
<!-- Leaflet (real map tiles + geocoding) — replaces the baked-in flat SVG map and the Google Maps
     iframe embed now that this page can reach live tile/geocoding hosts (it couldn't as a Claude
     artifact). Free, no API key. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- SheetJS (xlsx) — Community Edition, MIT licensed. Parses an uploaded Excel workbook entirely
     in the browser so its contents can be turned into a short, readable "gist" via the AI
     screening endpoint (see extractModelGist below). Nothing about the spreadsheet's bytes ever
     needs a server-side parser. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F6F9F9; --surface:#FFFFFF; --surface-2:#E9F1F2;
    --ink:#183139; --ink-soft:#526468; --ink-faint:#8A9CA0;
    --border:#CDDBDD; --border-strong:#AFC2C5;
    --accent:#183139; --accent-soft:#E2ECEE; --accent-strong:#0E2027; --accent-ink:#FFFFFF;
    --brass:#2C7E97; --brass-soft:#DCF1F6; --brass-ink:#FFFFFF;
    --good:#1F7A4C; --good-soft:#DFF1E6; --good-ink:#FFFFFF;
    --warn:#B4790F; --warn-soft:#FBEEDA; --warn-ink:#FFFFFF;
    --bad:#B7382F; --bad-soft:#F8E2E0; --bad-ink:#FFFFFF;
    --neutral:#7C8B92; --neutral-soft:#EBEBEB; --neutral-ink:#FFFFFF;
    --priority-high:#17803D; --priority-high-soft:#DFF3E6; --priority-high-ink:#FFFFFF;
    --priority-medium:#9E8300; --priority-medium-soft:#FBF3D0; --priority-medium-ink:#2A2100;
    --shadow:0 1px 2px rgba(24,49,57,.07), 0 10px 28px -14px rgba(24,49,57,.26);
    --font-display:'Source Serif 4',Georgia,'Times New Roman',serif;
    --font-body:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --radius:10px;
    --slideover-w:720px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1B20; --surface:#16262C; --surface-2:#122026;
      --ink:#E7EEF0; --ink-soft:#A9BAC0; --ink-faint:#728488;
      --border:#25383F; --border-strong:#35494F;
      --accent:#AAD8E5; --accent-soft:#1C333B; --accent-strong:#C7E7EF; --accent-ink:#0E2027;
      --brass:#7FC4DA; --brass-soft:#1E2F35; --brass-ink:#0E2027;
      --good:#4CBB77; --good-soft:#163826; --good-ink:#0E2027;
      --warn:#DDAE49; --warn-soft:#3A2E12; --warn-ink:#0E2027;
      --bad:#E1685F; --bad-soft:#3A1D1B; --bad-ink:#0E2027;
      --neutral:#7E8B92; --neutral-soft:#212B32; --neutral-ink:#0E2027;
      --priority-high:#5FC98A; --priority-high-soft:#1A3A2A; --priority-high-ink:#0E2027;
      --priority-medium:#E8CB4A; --priority-medium-soft:#3A3312; --priority-medium-ink:#0E2027;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1B20; --surface:#16262C; --surface-2:#122026;
    --ink:#E7EEF0; --ink-soft:#A9BAC0; --ink-faint:#728488;
    --border:#25383F; --border-strong:#35494F;
    --accent:#AAD8E5; --accent-soft:#1C333B; --accent-strong:#C7E7EF; --accent-ink:#0E2027;
    --brass:#7FC4DA; --brass-soft:#1E2F35; --brass-ink:#0E2027;
    --good:#4CBB77; --good-soft:#163826; --good-ink:#0E2027;
    --warn:#DDAE49; --warn-soft:#3A2E12; --warn-ink:#0E2027;
    --bad:#E1685F; --bad-soft:#3A1D1B; --bad-ink:#0E2027;
    --neutral:#7E8B92; --neutral-soft:#212B32; --neutral-ink:#0E2027;
    --priority-high:#5FC98A; --priority-high-soft:#1A3A2A; --priority-high-ink:#0E2027;
    --priority-medium:#E8CB4A; --priority-medium-soft:#3A3312; --priority-medium-ink:#0E2027;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-body); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.disp{ font-family:var(--font-display); font-weight:700; color:var(--brass); text-wrap:balance; }
  button{ font-family:inherit; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  ::selection{ background:var(--accent-soft); }
  a{ color:var(--accent); }

  /* ---------- shell ---------- */
  .app-shell{ display:flex; flex-direction:column; min-height:100vh; }
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px; padding:12px 20px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; margin-right:2px; }
  .brand-logo{ height:19px; width:auto; display:block; flex:none; }
  .brand-logo.logo-dark{ display:none; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .brand-logo.logo-light{ display:none; }
    :root:not([data-theme="light"]) .brand-logo.logo-dark{ display:block; }
  }
  :root[data-theme="dark"] .brand-logo.logo-light{ display:none; }
  :root[data-theme="dark"] .brand-logo.logo-dark{ display:block; }
  .brand-divider{ width:1px; height:16px; background:var(--border-strong); flex:none; }
  .brand-tag{ font-family:var(--font-body); font-weight:600; font-size:12.5px; color:var(--ink-soft); letter-spacing:.01em; }
  .tabs{ display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:3px; }
  .tab-btn{
    border:none; background:transparent; color:var(--ink-soft); font-weight:600; font-size:13px;
    padding:7px 14px; border-radius:6px; cursor:pointer; display:flex; align-items:center; gap:7px;
  }
  .tab-btn[aria-selected="true"]{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .tab-btn .count{
    font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); background:var(--neutral-soft);
    padding:1px 6px; border-radius:20px;
  }
  .tab-btn[aria-selected="true"] .count{ color:var(--accent); background:var(--accent-soft); }
  .spacer{ flex:1; }
  .search-input{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius:8px;
    padding:7px 11px; font-size:13px; width:190px; font-family:var(--font-body);
  }
  .search-input:focus{ outline:2px solid var(--accent-soft); outline-offset:0; border-color:var(--accent); }
  .mini-select{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft); border-radius:8px;
    padding:7px 9px; font-size:12px; font-family:var(--font-body);
  }
  .who-label{ font-size:11px; color:var(--ink-faint); font-weight:600; white-space:nowrap; cursor:help; }
  .who-input{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft); border-radius:8px;
    padding:7px 10px; font-size:12.5px; width:128px;
  }
  .who-input:focus{ outline:2px solid var(--accent-soft); border-color:var(--accent); color:var(--ink);}
  .btn{
    border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); border-radius:8px;
    padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-danger{ background:var(--surface); border-color:var(--bad); color:var(--bad); }
  .btn-danger:hover{ background:var(--bad-soft); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); }
  .btn-ghost:hover{ background:var(--neutral-soft); color:var(--ink); }
  .btn:focus-visible, .tab-btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .meta-bar{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px;
    padding:7px 20px; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    background:var(--surface); font-size:11px; color:var(--ink-faint); letter-spacing:.02em;
  }
  .meta-crumb{ justify-self:start; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta-center{ justify-self:center; font-weight:600; color:var(--ink-soft); white-space:nowrap; }
  .meta-status{ justify-self:end; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  @media (max-width:760px){ .meta-center{ display:none; } .meta-bar{ grid-template-columns:1fr auto; } }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--good); flex:none; display:inline-block; }
  .dot.off{ background:var(--neutral); }
  .dot-neutral{ background:var(--neutral); } .dot-accent{ background:var(--accent); }
  .dot-brass{ background:var(--brass); } .dot-warn{ background:var(--warn); }
  .dot-good{ background:var(--good); } .dot-bad{ background:var(--bad); }

  /* ---------- board ---------- */
  .board-wrap{ flex:1; overflow-x:auto; padding:18px 20px 32px; }
  .view-hero{ padding:2px 2px 16px; border-bottom:1px solid var(--border); margin-bottom:16px; }
  .view-hero-title{
    font-family:var(--font-display); font-weight:800; font-size:27px; letter-spacing:-.01em;
    margin:0 0 4px; color:var(--brass);
  }
  .view-hero-sub{ margin:0; font-size:12.5px; color:var(--ink-faint); }
  @media (max-width:640px){ .view-hero-title{ font-size:21px; } }
  .board{ display:flex; gap:14px; align-items:flex-start; min-height:60vh; }
  .column{
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    width:296px; flex:none; display:flex; flex-direction:column; max-height:calc(100vh - 130px);
  }
  .column-head{
    display:flex; align-items:center; gap:8px; padding:12px 12px 10px; border-bottom:1px solid var(--border);
  }
  .column-title{ font-weight:700; font-size:13px; letter-spacing:.01em; }
  .column-hint{ font-size:10.5px; color:var(--ink-faint); font-weight:500; }
  .column-count{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); margin-left:auto; }
  .column-add{
    width:20px; height:20px; border-radius:6px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink-soft); font-size:14px; line-height:1; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .column-add:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .column-body{ padding:10px; display:flex; flex-direction:column; gap:9px; overflow-y:auto; flex:1; min-height:80px; }
  .column-body.drag-over{ background:var(--accent-soft); border-radius:8px; }
  .empty-hint{ color:var(--ink-faint); font-size:12px; text-align:center; padding:18px 8px; border:1.5px dashed var(--border-strong); border-radius:8px; }

  /* ---------- acquisitions pipeline: vertical stage-grouped layout ---------- */
  .board.board-stack{ display:block; }
  .stage-section{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    margin-bottom:6px; overflow:hidden;
  }
  .stage-header{
    display:flex; align-items:center; gap:9px; padding:10px 16px; cursor:pointer; list-style:none;
    border-left:9px solid var(--neutral); user-select:none; transition:background .12s;
  }
  .stage-header::-webkit-details-marker{ display:none; }
  .stage-header::before{ content:"▾"; color:inherit; opacity:.8; font-size:11px; transition:transform .12s; }
  .stage-section:not([open]) .stage-header::before{ content:"▸"; }
  .stage-header-title{
    font-family:var(--font-display); font-weight:800; font-size:14px; margin:0; letter-spacing:.01em; color:inherit;
  }
  .stage-header-count{
    font-size:11.5px; color:inherit; background:transparent; border:1.5px solid currentColor; opacity:.92;
    border-radius:20px; padding:2px 9px; margin-left:6px; font-weight:700;
  }
  .stage-header-subtotal{ font-size:11.5px; color:inherit; opacity:.85; font-weight:700; margin-left:auto; padding-right:2px; }
  .stage-body{ display:flex; flex-direction:column; gap:9px; padding:10px 14px 12px; }
  .stage-body-compact{ gap:0; padding:0 0 2px; }
  .stage-empty-line{ color:var(--ink-faint); font-size:11.5px; padding:9px 16px 11px; }
  .stage-row{
    background:var(--surface-2); border:1px solid var(--border); border-left:4px solid var(--neutral);
    border-radius:10px; padding:12px 14px; cursor:pointer; display:grid;
    grid-template-columns:minmax(200px,1.4fr) minmax(320px,2fr) 150px 150px;
    gap:16px; align-items:start;
  }
  .stage-row:hover{ border-color:var(--ink-faint); }
  /* Full-card priority tint — a manual high/medium/low field per deal, colored with the same
     bad/warn tokens used everywhere else so "high priority" reads the same way across the app.
     Low priority deliberately gets no tint (stays the default card color) so only what actually
     needs attention stands out; the priority-select pill still labels every deal explicitly. */
  .stage-row-priority-high{ background:var(--priority-high-soft); }
  .stage-row-priority-medium{ background:var(--priority-medium-soft); }
  .stage-row-compact-priority-high{ background:var(--priority-high-soft); }
  .stage-row-compact-priority-medium{ background:var(--priority-medium-soft); }
  .priority-select{
    flex:none; width:auto; border-radius:20px; padding:2px 9px; font-size:10.5px; font-weight:700;
    border:none; cursor:pointer; font-family:var(--font-body);
  }
  .stage-row-top{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .stage-row-title-wrap{ display:flex; align-items:flex-start; gap:6px; justify-content:space-between; }
  .stage-row-title{ font-weight:700; font-size:13.5px; line-height:1.3; }
  .stage-row-sub{ color:var(--ink-soft); font-size:11.5px; }
  .stage-row-fields{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px 14px; align-content:start; }
  @media (max-width:1180px){ .stage-row-fields{ grid-template-columns:repeat(2,1fr); } }
  .stage-field{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .stage-field-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:700; }
  .stage-field-value{ font-size:12.5px; font-weight:600; color:var(--ink); overflow-wrap:anywhere; }
  .stage-field-value.good{ color:var(--good); }
  .stage-field-value.warn{ color:var(--warn); }
  .stage-field-value.bad{ color:var(--bad); }
  .stage-row-owner{ display:flex; flex-direction:column; gap:4px; }
  .stage-row-owner .stage-owner-input{ width:100%; }
  .stage-row-actions{ display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .stage-row-actions .move-select{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:7px;
    padding:5px 7px; font-size:11.5px; width:100%;
  }
  @media (max-width:980px){
    .stage-row{ grid-template-columns:1fr; }
    .stage-row-actions{ flex-direction:row; align-items:center; justify-content:space-between; }
  }

  .pipeline-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .pipeline-toolbar-left{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pipeline-toolbar-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .density-toggle{ display:flex; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .density-toggle .btn-icon{ border:none; border-radius:0; }
  .density-toggle .btn-icon.active{ background:var(--accent-soft); color:var(--accent-strong); font-weight:700; }
  .density-toggle .btn-icon + .btn-icon{ border-left:1px solid var(--border); }
  #compareBtn{ font-weight:600; }

  .stage-row-compact{
    display:grid;
    grid-template-columns:12px minmax(180px,2fr) minmax(80px,1fr) minmax(70px,0.9fr) minmax(96px,1fr) minmax(70px,0.9fr) minmax(110px,1.2fr) minmax(80px,0.6fr) minmax(56px,0.5fr) minmax(96px,0.7fr);
    align-items:center; gap:12px; padding:6px 12px; border-left:3px solid var(--neutral);
    border-bottom:1px solid var(--border); cursor:pointer; font-size:12px;
  }
  .stage-body-compact .stage-row-compact:last-child{ border-bottom:none; }
  .stage-row-compact:hover{ background:var(--surface-2); }
  .stage-row-compact-head{
    cursor:default; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);
    font-weight:700; padding-top:0; padding-bottom:6px; border-left-color:transparent; border-bottom:1px solid var(--border-strong);
  }
  .stage-row-compact-head:hover{ background:none; }
  .stage-row-compact-head .col-align-right{ text-align:right; }
  .stage-summary-bar{
    display:flex; gap:20px; flex-wrap:wrap; align-items:center; padding:9px 16px;
    border-top:1px solid var(--border); background:var(--surface-2);
  }
  .stage-summary-item{ display:flex; flex-direction:column; gap:1px; }
  .stage-summary-label{ font-size:9px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:700; }
  .stage-summary-value{ font-family:var(--font-mono); font-weight:700; font-size:12.5px; color:var(--ink); }
  .src-name-wrap{ display:flex; align-items:baseline; gap:7px; min-width:0; }
  .src-name{ font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .src-address{ color:var(--ink-faint); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  .src-market{ color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .src-price{ text-align:right; color:var(--ink-soft); font-weight:600; }
  .src-acres{ text-align:right; color:var(--ink-faint); font-weight:600; white-space:nowrap; }
  .src-ppu{ text-align:right; color:var(--ink-faint); font-weight:600; }
  .src-progress{ display:flex; align-items:center; gap:7px; }
  .src-progress .deal-progress-track{ width:72px; flex:none; }
  .src-progress-pct{ font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--ink-soft); width:28px; flex:none; }
  .src-owner-input{ width:100%; padding:4px 7px; font-size:11px; }
  .src-updated{ color:var(--ink-faint); font-size:10.5px; }
  .src-move{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:6px;
    padding:4px 6px; font-size:11px; width:100%;
  }
  @media (max-width:900px){
    .stage-row-compact, .stage-row-compact-head{ grid-template-columns:12px 1fr; }
    .stage-row-compact > *:not(.dot):not(.src-name-wrap){ display:none; }
  }

  /* ---------- deal comparison matrix ---------- */
  .modal.compare-modal{ width:min(960px,96vw); max-height:88vh; }
  .compare-body{ display:flex; flex:1; overflow:hidden; min-height:0; }
  .compare-picker{ width:220px; flex:none; border-right:1px solid var(--border); padding:14px; overflow-y:auto; }
  .compare-picker-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:700; margin-bottom:9px; }
  .compare-check-row{ display:flex; align-items:center; gap:7px; padding:6px 5px; font-size:12px; cursor:pointer; border-radius:6px; }
  .compare-check-row:hover{ background:var(--surface-2); }
  .compare-check-row input{ width:14px; height:14px; accent-color:var(--accent); flex:none; }
  .compare-check-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .compare-check-stage{ font-size:9.5px; color:var(--ink-faint); white-space:nowrap; }
  .compare-matrix-wrap{ flex:1; overflow:auto; padding:16px 18px; }
  .compare-table{ border-collapse:collapse; width:100%; font-size:12px; }
  .compare-crit-col{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); padding:6px 10px 10px 4px; white-space:nowrap; }
  .compare-weight-hint{ text-transform:none; font-weight:400; }
  .compare-deal-col{ text-align:center; padding:6px 10px 10px; font-family:var(--font-display); font-weight:700; font-size:13px; border-bottom:2px solid var(--border-strong); white-space:nowrap; }
  .compare-deal-col.is-top{ color:var(--good); }
  .compare-crit-label{ padding:8px 10px 8px 4px; font-weight:600; color:var(--ink-soft); white-space:nowrap; display:flex; align-items:center; }
  .compare-weight-input{ width:38px; margin-left:8px; padding:2px 4px; font-size:11px; border:1px solid var(--border); border-radius:5px; background:var(--surface-2); color:var(--ink); font-family:var(--font-mono); }
  .compare-cell{ text-align:center; padding:7px 10px; border-bottom:1px solid var(--border); min-width:100px; }
  .compare-cell-raw{ display:block; font-weight:600; color:var(--ink); }
  .compare-cell-score{ display:block; font-size:10px; color:var(--ink-faint); margin-top:1px; }
  .compare-cell-good{ background:var(--good-soft); }

  .compare-cell-warn{ background:var(--warn-soft); }

  .compare-cell-bad{ background:var(--bad-soft); }

  /* ---------- toast notices ---------- */

    border-radius:10px; box-shadow:var(--shadow); opacity:0; transition:opacity .18s, transform .18s;
    pointer-events:none; max-width:min(420px,90vw); text-align:center;
  }

  .alert-detail-type{ font-size:11px; color:var(--ink-faint); flex:none; }
  .alert-detail-date{ font-size:11px; color:var(--ink-soft); flex:none; }

  /* ---------- IC memo ---------- */

  .ic-memo-dd{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }

  .ic-memo-decisionbox-good{ background:var(--good-soft); border-color:var(--good); }
  .ic-memo-decisionbox-warn{ background:var(--warn-soft); border-color:var(--warn); }

  @media (max-width:600px){ .ic-memo-grid{ grid-template-columns:1fr; } .ic-memo-photos{ grid-template-columns:1fr 1fr; } }
  /* ---------- IC memo: exec summary, risks, pro forma quick view, site/map media ---------- */
  .ic-memo-execbox{
    border-radius:10px; padding:14px 16px; margin-bottom:14px; border:1.5px solid var(--border-strong); background:var(--surface-2);
  }
  .ic-memo-execbox-good{ background:var(--good-soft); border-color:var(--good); }
  .ic-memo-execbox-warn{ background:var(--warn-soft); border-color:var(--warn); }
  .ic-memo-execbox-bad{ background:var(--bad-soft); border-color:var(--bad); }
  .ic-memo-exec-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .ic-memo-exec-label{ font-weight:800; font-size:12px; color:var(--ink); text-transform:uppercase; letter-spacing:.04em; }
  .ic-memo-exec-text{ font-size:13px; color:var(--ink); line-height:1.55; margin:0 0 8px; white-space:pre-wrap; }

  .ic-memo-risks-label{ font-weight:700; font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; display:block; margin-bottom:3px; }
  .ic-memo-proforma{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:stretch; }

    flex:1 1 120px; border:1px solid var(--border); border-radius:8px; padding:9px 12px; background:var(--surface);
  }
  .ic-memo-proforma-tile-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700; display:block; margin-bottom:2px; }
  .ic-memo-proforma-tile-value{ font-size:15px; font-weight:800; color:var(--ink); font-family:var(--font-mono); }
  .ic-memo-proforma-link{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; padding:9px 16px; border-radius:8px;
    background:var(--accent); color:#fff; font-weight:700; font-size:12.5px; text-decoration:none; text-align:center;
  }
  .ic-memo-media-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  @media (max-width:600px){ .ic-memo-media-grid{ grid-template-columns:1fr; } }
  .ic-memo-media-box{ border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--surface-2); }
  .ic-memo-media-label{
    font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700;
    padding:5px 9px; border-bottom:1px solid var(--border);
  }
  .ic-memo-media-box img{ width:100%; height:160px; object-fit:cover; display:block; }
  .ic-memo-map-frame{ width:100%; height:160px; border:none; display:block; }
  .ic-memo-map-fallback{ padding:14px 9px; font-size:12px; color:var(--ink-soft); }
  .ic-memo-map-fallback a{ color:var(--accent); font-weight:600; }
  .memo-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .memo-table tr{ border-bottom:1px solid var(--border); }
  .memo-table tr:last-child{ border-bottom:none; }
  .memo-th{ padding:6px 10px 6px 0; color:var(--ink-faint); font-weight:600; white-space:nowrap; width:1%; }
  .memo-td{ padding:6px 0; color:var(--ink); font-weight:600; overflow-wrap:anywhere; }
  .ic-memo-notes{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; white-space:pre-wrap; margin:0; }

  /* ---------- IC memo screening-criteria scorecard table ---------- */
  .ic-scorecard-table{ font-size:11.5px; }
  .ic-scorecard-table th{ text-align:left; padding:6px 8px; color:var(--ink-faint); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.02em; border-bottom:1px solid var(--border); }
  .ic-scorecard-table td.memo-td{ padding:7px 8px; vertical-align:top; }
  .ic-scorecard-table .ic-scorecard-req,
  .ic-scorecard-table .ic-scorecard-notes{ color:var(--ink-soft); font-weight:500; }
  @media print{
    body *{ visibility:hidden; }
    #icMemoOverlay, #icMemoOverlay *, #onePagerOverlay, #onePagerOverlay *, #agendaPrintOverlay, #agendaPrintOverlay *{ visibility:visible; }
    #icMemoOverlay, #onePagerOverlay, #agendaPrintOverlay{ position:absolute; inset:0; background:#fff!important; padding:0; display:block; }
    #icMemoOverlay .modal.ic-memo-modal, #onePagerOverlay .modal.ic-memo-modal, #agendaPrintOverlay .modal.ic-memo-modal{ width:100%; max-height:none; box-shadow:none; border:none; }
    #icMemoOverlay .no-print, #onePagerOverlay .no-print, #agendaPrintOverlay .no-print{ display:none!important; }
    #icMemoOverlay .ic-memo-body, #onePagerOverlay .ic-memo-body, #agendaPrintOverlay .ic-memo-body{ overflow:visible; padding:0.4in; }
  }

  .card{
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--neutral); border-radius:9px;
    padding:11px 12px; cursor:grab; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:7px;
  }
  .card:active{ cursor:grabbing; }
  .card.dragging{ opacity:.4; }
  .card.stripe-neutral{ border-left-color:var(--neutral); }
  .card.stripe-accent{ border-left-color:var(--accent); }
  .card.stripe-brass{ border-left-color:var(--brass); }
  .card.stripe-warn{ border-left-color:var(--warn); }
  .card.stripe-good{ border-left-color:var(--good); }
  .card.stripe-bad{ border-left-color:var(--bad); }
  .card-title-row{ display:flex; align-items:flex-start; gap:6px; }
  .card-title{ font-weight:600; font-size:13.5px; line-height:1.35; flex:1; }
  .card-sub{ color:var(--ink-soft); font-size:12px; }
  .card-meta{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .pill{
    font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:20px; display:inline-flex; align-items:center; gap:4px;
    letter-spacing:.01em; white-space:nowrap;
  }
  .pill-neutral{ background:var(--neutral-soft); color:var(--ink-soft); }
  .pill-good{ background:var(--good-soft); color:var(--good); }
  .pill-warn{ background:var(--warn-soft); color:var(--warn); }
  .pill-bad{ background:var(--bad-soft); color:var(--bad); }
  .pill-accent{ background:var(--accent-soft); color:var(--accent-strong); }
  .pill-brass{ background:var(--brass-soft); color:var(--brass); }
  .pill-priority-high{ background:var(--priority-high-soft); color:var(--priority-high); }
  .pill-priority-medium{ background:var(--priority-medium-soft); color:var(--priority-medium); }
  .pill-solid{ font-weight:800; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  .pill-solid.pill-neutral{ background:var(--neutral); color:var(--neutral-ink); }
  .pill-solid.pill-good{ background:var(--good); color:var(--good-ink); }
  .pill-solid.pill-warn{ background:var(--warn); color:var(--warn-ink); }
  .pill-solid.pill-bad{ background:var(--bad); color:var(--bad-ink); }
  .pill-solid.pill-accent{ background:var(--accent); color:var(--accent-ink); }
  .pill-solid.pill-brass{ background:var(--brass); color:var(--brass-ink); }
  .pill-solid.pill-priority-high{ background:var(--priority-high); color:var(--priority-high-ink); }
  .pill-solid.pill-priority-medium{ background:var(--priority-medium); color:var(--priority-medium-ink); }
  .card-foot{ display:flex; align-items:center; gap:8px; margin-top:1px; }
  .move-select{
    font-size:11px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
    border-radius:6px; padding:3px 5px; flex:1; font-family:var(--font-body);
  }
  .link-tag{ font-size:11px; color:var(--accent); display:flex; align-items:center; gap:3px; }
  .link-icons{ display:flex; gap:4px; flex:none; }
  .icon-link{
    width:24px; height:24px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--ink-soft); text-decoration:none; flex:none;
  }
  .icon-link:hover{ border-color:var(--accent); color:var(--accent); }
  .star-btn{
    border:none; background:transparent; cursor:pointer; font-size:16px; line-height:1; color:var(--border-strong);
    padding:0 0 0 2px; flex:none;
  }
  .star-btn.active{ color:var(--brass); }
  .star-btn:hover{ color:var(--brass); }

  .econ-row, .dates-row, .deposit-row{ display:flex; flex-wrap:wrap; gap:5px; }
  .deposit-extra-head{ display:flex; align-items:center; justify-content:space-between; margin:14px 0 8px; }
  .deposit-extra-list{ display:flex; flex-direction:column; gap:6px; }
  .deposit-extra-row{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; background:var(--surface-2);
    border:1px solid var(--border); border-radius:8px; padding:7px 9px;
  }
  .deposit-extra-label{
    flex:1 1 140px; min-width:110px; font-size:12.5px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); border-radius:6px; padding:5px 7px; font-family:var(--font-body);
  }
  .deposit-extra-amount{
    font-size:12.5px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); border-radius:6px; padding:5px 7px; font-family:var(--font-body); width:100%; box-sizing:border-box;
  }
  .deposit-extra-amount-wrap{ flex:0 0 100px; width:100px; }
  .money-field{ position:relative; }
  .money-field-prefix{
    position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-faint);
    font-size:13px; font-weight:600; pointer-events:none;
  }
  .money-field input{ padding-left:22px !important; width:100%; box-sizing:border-box; }
  .deposit-extra-date{
    flex:0 0 130px; font-size:12px; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:6px; padding:5px 7px; font-family:var(--font-body);
  }
  .deposit-extra-status{
    flex:0 0 120px; font-size:11px; font-weight:700; border-radius:6px; padding:5px 6px; border:1px solid var(--border);
    background:var(--surface);
  }
  .deposit-extra-remove{ flex:none; padding:4px 8px; }
  .dep-chip{
    font-size:10.5px; color:var(--ink-soft); display:inline-flex; align-items:center; gap:4px; font-family:var(--font-mono);
    background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:2px 7px 2px 5px;
  }
  .dep-chip .dot{ width:6px; height:6px; }

  /* ---------- generic repeatable-row list fields (open questions, comps, traffic, etc.) ---------- */
  .repeat-list-head{ display:flex; align-items:center; justify-content:space-between; margin:14px 0 8px; }
  .repeat-row{
    display:flex; gap:6px; align-items:center; background:var(--surface-2); border:1px solid var(--border);
    border-radius:8px; padding:7px 9px; margin-bottom:6px;
  }
  .repeat-input{
    border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:6px;
    padding:5px 7px; font-size:12px; font-family:var(--font-body); min-width:0;
  }
  .repeat-remove{ flex:none; }
  @media (max-width:520px){ .repeat-row{ flex-wrap:wrap; } }

  /* ---------- lookup / AI-draft helpers for fields Deal Desk can't fetch live ---------- */
  .field-tools{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:2px; }
  .field-tool-btn{
    font-size:11px; font-weight:600; border:1px solid var(--border-strong); background:var(--surface);
    color:var(--ink-soft); border-radius:7px; padding:5px 9px; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  }
  .field-tool-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .field-tool-note{ font-size:10.5px; color:var(--ink-faint); font-style:italic; }

  /* ---------- financial model toggle (back-of-envelope vs full model) ---------- */
  .model-toggle-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .model-toggle{
    display:flex; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; flex:none;
  }
  .model-toggle button{
    border:none; background:var(--surface); color:var(--ink-soft); font-size:12px; font-weight:600;
    padding:7px 13px; cursor:pointer; font-family:var(--font-body);
  }
  .model-toggle button + button{ border-left:1px solid var(--border-strong); }
  .model-toggle button.active{ background:var(--accent); color:var(--accent-ink); }
  .sensitivity-table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
  .sensitivity-table th{ text-align:right; padding:5px 8px; color:var(--ink-faint); font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--border); }
  .sensitivity-table th:first-child{ text-align:left; }
  .sensitivity-table td{ text-align:right; padding:6px 8px; font-family:var(--font-mono); border-bottom:1px solid var(--border); }
  .sensitivity-table td:first-child{ text-align:left; font-family:var(--font-body); font-weight:600; color:var(--ink); }
  .sensitivity-table tr:last-child td{ border-bottom:none; }
  .sensitivity-table tr.base-case td{ color:var(--ink); font-weight:700; }

  .progress-row{ display:flex; align-items:center; gap:7px; }
  .progress-track{ flex:1; height:5px; border-radius:4px; background:var(--neutral-soft); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:4px; }
  .progress-fill.complete{ background:var(--good); }
  .progress-label{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); flex:none; }
  /* Stage-stepper progress: one segment per pipeline stage, colored with that stage's own
     established color (same palette as the stage headers/dots/pills) once reached, pale
     gray while still ahead — so the exact stage and how far through the funnel a deal is
     reads at a glance, in colors the user already recognizes from the rest of the app. */
  .deal-progress{ display:flex; align-items:center; gap:7px; }
  .deal-progress-pct{ font-family:var(--font-body); font-size:11px; font-weight:800; color:var(--ink-soft); flex:none; white-space:nowrap; }
  .deal-progress-track{
    flex:1; height:9px; border-radius:5px; background:var(--neutral-soft);
    border:1px solid var(--border); overflow:hidden; display:flex; gap:2px; padding:1.5px;
  }
  .deal-progress-seg{
    flex:1; height:100%; border-radius:2.5px; background:var(--border-strong); opacity:.55;
  }
  .deal-progress-seg.reached{ opacity:1; }
  .deal-progress-seg.current{ box-shadow:0 0 0 1.5px var(--surface), 0 0 0 3px currentColor; }
  .deal-progress.dead .deal-progress-track{ padding:0; gap:0; }
  .deal-progress-seg-dead{ flex:1; height:100%; border-radius:3px; background:var(--bad); }
  .deal-progress-lg .deal-progress-track{ height:13px; gap:3px; padding:2px; }
  .deal-progress-lg .deal-progress-seg{ border-radius:3px; }
  .deal-progress-lg .deal-progress-pct{ font-size:13px; font-weight:800; }
  .locked-note{ font-size:11px; color:var(--ink-faint); font-style:italic; }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(16,22,29,.42); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal{
    background:var(--surface); border-radius:14px; width:min(460px,100%); box-shadow:var(--shadow);
    border:1px solid var(--border); max-height:88vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-head{ padding:18px 20px 4px; display:flex; align-items:center; flex:none; }
  .modal-head h2{ font-size:17px; margin:0; }
  /* flex:1 + min-height:0 is required for a flex child's own overflow-y:auto to actually engage —
     without min-height:0 a flex item defaults to min-height:auto (never shrinks below its content),
     so long modal content silently overflows past the modal's rounded box instead of scrolling
     inside it. Applies to every scrollable modal body below (.modal-body, .ic-memo-body). */
  .modal-body{ padding:14px 20px 6px; overflow-y:auto; display:flex; flex-direction:column; gap:13px; flex:1; min-height:0; }
  .modal-foot{ padding:16px 20px 20px; display:flex; gap:8px; flex:none; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .field input, .field select, .field textarea{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius:8px;
    padding:8px 10px; font-size:13.5px; font-family:var(--font-body); width:100%;
  }
  .field textarea{ resize:vertical; min-height:60px; font-family:var(--font-body); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .confirm-text{ font-size:13.5px; color:var(--ink-soft); padding:0 20px 4px; }
  .checkbox-field{ display:flex; align-items:center; gap:8px; }
  .checkbox-field input{ width:16px; height:16px; accent-color:var(--accent); }
  .checkbox-field label{ text-transform:none; font-size:13px; font-weight:600; color:var(--ink); }
  .om-intake{ border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .om-intake > summary{ list-style:none; cursor:pointer; padding:10px 13px; font-weight:700; font-size:12.5px; background:var(--surface-2); display:flex; align-items:center; gap:8px; }
  .om-intake > summary::-webkit-details-marker{ display:none; }
  .om-intake > summary::before{ content:"▸"; color:var(--ink-faint); font-size:11px; }
  .om-intake[open] > summary::before{ content:"▾"; }
  .om-body{ padding:12px 13px 14px; display:flex; flex-direction:column; gap:9px; border-top:1px solid var(--border); }
  .om-status{ font-size:11.5px; color:var(--ink-soft); min-height:14px; }
  .om-status.warn{ color:var(--warn); }
  .om-file-row input[type=file]{ font-size:12px; color:var(--ink-soft); width:100%; }
  .om-url-row{ display:flex; gap:8px; }
  .om-url-row input[type=url]{ flex:1; min-width:0; }

  /* ---------- generic tag-input (broker markets, etc.) ---------- */
  .tag-input-wrap{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; border:1px solid var(--border);
    background:var(--surface-2); border-radius:8px; padding:6px 8px; min-height:34px;
  }
  .tag-input-wrap .tag-pill{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .tag-pill-remove{ cursor:pointer; font-weight:800; opacity:.6; }
  .tag-pill-remove:hover{ opacity:1; }
  .field .tag-input-wrap input{
    border:none; background:transparent; padding:4px 2px; flex:1; min-width:110px; width:auto;
  }
  .field .tag-input-wrap input:focus{ outline:none; }

  /* ---------- category manager (product line / property type) ---------- */
  .catmgr-list{ display:flex; flex-direction:column; gap:5px; max-height:260px; overflow-y:auto; }
  .catmgr-row{
    display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--border);
    border-radius:8px; background:var(--surface-2); font-size:12.5px;
  }
  .catmgr-name{ flex:1; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .catmgr-remove{ flex:none; padding:3px 7px; }

  /* ---------- slideover (deal detail) ---------- */
  .slide-overlay{ position:fixed; inset:0; background:rgba(16,22,29,.42); z-index:90; }
  .slideover{
    position:fixed; top:0; right:0; bottom:0; width:min(var(--slideover-w,720px),96vw); background:var(--surface);
    box-shadow:-18px 0 40px -20px rgba(0,0,0,.35); z-index:91; display:flex; flex-direction:column;
    border-left:1px solid var(--border);
  }
  /* Drag handle on the panel's left edge so the analyst can widen or narrow it to taste — the
     width lives in --slideover-w (see slideoverWidth/initSlideResizeHandle in the script), and
     is remembered per browser like the pipeline density and theme prefs. Hidden on narrow
     viewports, where the panel is already effectively full-width and there's no room to drag. */
  .slide-resize-handle{ position:absolute; left:-6px; top:0; bottom:0; width:12px; cursor:col-resize; z-index:92; touch-action:none; }
  .slide-resize-handle::after{ content:""; position:absolute; left:5px; top:0; bottom:0; width:2px; background:transparent; transition:background .12s; }
  .slide-resize-handle:hover::after, .slide-resize-handle.dragging::after{ background:var(--brass); }
  body.slide-resizing{ cursor:col-resize !important; user-select:none; }
  body.slide-resizing .slide-overlay{ pointer-events:none; }
  @media (max-width:760px){ .slide-resize-handle{ display:none; } }
  .slide-head{ padding:20px 22px 14px; border-bottom:1px solid var(--border); }
  .slide-head-top{ display:flex; align-items:flex-start; gap:10px; }
  .slide-title-input{
    font-family:var(--font-display); font-weight:800; font-size:19px; border:none; background:transparent;
    color:var(--brass); flex:1; padding:2px 0; border-bottom:1px solid transparent;
  }
  .slide-title-input:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .slide-sub{ color:var(--ink-soft); font-size:12.5px; margin-top:2px; }
  .slide-body{ flex:1; overflow-y:auto; padding:16px 22px 30px; display:flex; flex-direction:column; gap:22px; }
  .section-label{
    font-family:var(--font-display); font-size:16px; font-weight:800; text-transform:none;
    letter-spacing:-.008em; color:var(--brass);
    margin:0 0 10px; padding-bottom:7px; border-bottom:2px solid var(--brass);
  }
  .deal-fields{ display:flex; flex-direction:column; gap:11px; }
  .deal-fields[hidden]{ display:none; }

  /* ---------- demographics / wealth profile panel (edit grids + read-only display, shared
     between the slideover's live preview and the IC memo's static render) ---------- */
  .wealth-tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:14px; }
  @media (max-width:520px){ .wealth-tiles{ grid-template-columns:1fr; } }
  .wealth-tile{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 13px; }
  .wealth-tile-label{ font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700; margin-bottom:4px; }
  .wealth-tile-radius-tag{ text-transform:none; font-weight:500; color:var(--ink-faint); }
  .wealth-tile-value{ font-family:var(--font-mono); font-weight:800; font-size:20px; color:var(--ink); }
  .wealth-tile-unit{ font-size:12px; font-weight:600; color:var(--ink-faint); margin-left:2px; }
  .wealth-table-wrap{ margin-top:14px; }
  .wealth-table-title{ font-weight:700; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .wealth-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .wealth-table th{ background:var(--accent-strong); color:var(--accent-ink); text-align:left; padding:7px 10px; font-size:10.5px; text-transform:uppercase; letter-spacing:.02em; font-weight:700; }
  .wealth-table th:first-child{ border-radius:6px 0 0 0; }
  .wealth-table th:last-child{ border-radius:0 6px 0 0; }
  .wealth-table td{ padding:7px 10px; border-bottom:1px solid var(--border); color:var(--ink); }
  .wealth-table tr:last-child td{ border-bottom:none; }
  .wealth-table tr:nth-child(even) td{ background:var(--surface-2); }
  .wealth-vs-good{ color:var(--good); font-weight:700; }
  .wealth-vs-bad{ color:var(--bad); font-weight:700; }
  .wealth-metric-tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  @media (max-width:560px){ .wealth-metric-tiles{ grid-template-columns:repeat(2,1fr); } }
  .wealth-metric-tile{ background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
  .wealth-metric-tile-label{ font-size:9px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700; margin-bottom:2px; }
  .wealth-metric-tile-value{ font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--ink); }
  .wealth-source-note{ font-size:10.5px; color:var(--ink-faint); font-style:italic; margin-top:10px; }
  .wealth-edit-grid{ display:grid; grid-template-columns:110px repeat(4,1fr); gap:6px; align-items:center; margin-top:8px; }
  .wealth-edit-grid-vs{ grid-template-columns:140px 1fr 1fr; }
  .wealth-edit-col-label{ font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700; }
  .wealth-edit-row-label{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .wealth-input{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius:6px;
    padding:5px 7px; font-size:12px; font-family:var(--font-body); width:100%; box-sizing:border-box;
  }
  .wealth-derived{ font-size:12.5px; color:var(--ink-soft); padding:5px 2px; }
  .wealth-preview-wrap{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--border-strong); }
  .wealth-preview-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:700; margin-bottom:8px; }

  /* ---------- weekly agenda: section reordering + special comments ---------- */
  .agenda-reorder{ display:inline-flex; gap:2px; margin-left:auto; }
  .agenda-reorder-btn{
    width:22px; height:22px; border-radius:6px; border:1px solid var(--border); background:var(--surface);
    color:var(--ink-soft); font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .agenda-reorder-btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .agenda-reorder-btn:disabled{ opacity:.35; cursor:default; }
  .agenda-comment-list{ display:flex; flex-direction:column; gap:7px; margin-bottom:12px; }
  .agenda-comment-row{
    display:flex; align-items:flex-start; gap:9px; padding:9px 10px; border:1px solid var(--border);
    border-radius:8px; background:var(--surface-2);
  }
  .agenda-comment-row.is-discussed{ opacity:.6; }
  .agenda-comment-toggle{
    flex:none; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border-strong); background:var(--surface);
    color:var(--good); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .agenda-comment-body{ flex:1; min-width:0; }
  .agenda-comment-text{ font-size:13px; color:var(--ink); white-space:pre-wrap; overflow-wrap:anywhere; }
  .agenda-comment-owner{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .agenda-comment-remove{
    flex:none; border:none; background:transparent; color:var(--ink-faint); cursor:pointer; font-size:13px; padding:2px 4px;
  }
  .agenda-comment-remove:hover{ color:var(--bad); }
  .agenda-comment-add{ display:flex; flex-direction:column; gap:8px; }
  .agenda-comment-add textarea{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius:8px;
    padding:8px 10px; font-size:13px; font-family:var(--font-body); width:100%; box-sizing:border-box; resize:vertical;
  }
  .agenda-comment-add-row{ display:flex; gap:8px; align-items:center; }
  .agenda-comment-add-row input{
    flex:1; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius:8px;
    padding:7px 10px; font-size:12.5px; font-family:var(--font-body);
  }
  .overview-grid{ display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:12.5px; }
  .ov-label{ color:var(--ink-faint); white-space:nowrap; }
  .ov-value{ color:var(--ink); font-weight:600; overflow-wrap:anywhere; }
  .photo-strip-wrap:empty{ display:none; }
  .photo-strip{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:4px; }
  .photo-item{ margin:0; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--surface-2); }
  .photo-item img{ width:100%; height:96px; object-fit:cover; display:block; }
  .photo-item figcaption{ font-size:10px; color:var(--ink-faint); padding:5px 7px; text-transform:uppercase; letter-spacing:.03em; }
  .photo-item.broken{ display:none; }
  @media (max-width:520px){ .photo-strip{ grid-template-columns:1fr; } }
  .cdate-list{ display:flex; flex-direction:column; gap:2px; }
  .cdate-row{ display:grid; grid-template-columns:18px 1fr auto; align-items:center; gap:9px; padding:5px 2px; border-bottom:1px solid var(--border); }
  .cdate-row:last-child{ border-bottom:none; }
  .cdate-mark{ color:var(--ink-faint); font-size:12px; text-align:center; }
  .cdate-mark.done{ color:var(--good); font-weight:700; }
  .cdate-label{ font-size:12.5px; color:var(--ink-soft); }
  .cdate-input{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius:7px;
    padding:5px 7px; font-size:12px; font-family:var(--font-body); width:140px;
  }
  .calc-line{ font-size:12px; color:var(--ink-soft); }
  .calc-line .mono{ color:var(--ink); font-weight:600; }
  .dd-summary{
    display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px;
  }
  .dd-summary .num{ font-family:var(--font-mono); font-weight:600; font-size:20px; }
  .dd-summary .progress-track{ height:7px; }

  /* ---------- gate log (Screen to Close decision checkpoints) ---------- */
  .gate-log-form{ display:flex; flex-direction:column; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .gate-row{ border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .gate-row-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .gate-row-title{ font-weight:700; font-size:13.5px; }
  .gate-row-meta{ font-size:11.5px; color:var(--ink-faint); margin-top:3px; }
  .gate-row-note{ font-size:12px; color:var(--ink-soft); margin-top:5px; }
  .gate-history-toggle{ margin-top:6px; }
  .gate-history-toggle summary{ font-size:11.5px; color:var(--ink-faint); cursor:pointer; }
  .gate-history-row{ display:flex; justify-content:space-between; gap:8px; font-size:11.5px; color:var(--ink-soft); padding:4px 0 0 4px; }
  .gate-history-answer{ font-weight:600; flex:none; }
  .gate-history-meta{ color:var(--ink-faint); text-align:right; }
  .uw-tiles{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .uw-tile{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:3px; min-width:0; }
  .uw-label{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:700; }
  .uw-value{ font-family:var(--font-mono); font-weight:700; font-size:16px; overflow-wrap:anywhere; }
  .uw-value.good{ color:var(--good); } .uw-value.warn{ color:var(--warn); } .uw-value.bad{ color:var(--bad); }
  .uw-sub{ font-size:11px; font-weight:500; color:var(--ink-faint); }

  /* ---------- key metrics (Northspyre-style "Target returns" tiles) ---------- */
  .metric-tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:9px; }
  .metric-tile{
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:12px 14px;
    display:flex; flex-direction:column; gap:4px; min-width:0; border-top:4px solid var(--accent);
  }
  .metric-tile.tone-good{ border-top-color:var(--good); }
  .metric-tile.tone-bad{ border-top-color:var(--bad); }
  .metric-label{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:800; }
  .metric-value{ font-family:var(--font-mono); font-weight:800; font-size:19px; color:var(--ink); overflow-wrap:anywhere; }
  .metric-value.good{ color:var(--good); }
  .metric-value.bad{ color:var(--bad); }

  /* ---------- slideover sub-tabs (Overview / Back-of-Envelope) ---------- */
  .slide-tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin:2px 0 4px; }
  .slide-tab-btn{
    border:none; background:transparent; color:var(--ink-faint); font-family:var(--font-body); font-weight:700;
    font-size:13px; padding:9px 4px; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px;
  }
  .slide-tab-btn:hover{ color:var(--ink-soft); }
  .slide-tab-btn[aria-selected="true"]{ color:var(--accent-strong); border-bottom-color:var(--accent); }
  .slide-tab-panel{ display:flex; flex-direction:column; gap:22px; }
  .slide-tab-panel[hidden]{ display:none; }

  /* ---------- dashboard ---------- */
  .dash-filter-bar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:14px; }
  .dash-filter-bar select{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:7px;
    padding:6px 9px; font-size:12px; font-family:var(--font-body); max-width:170px;
  }
  .filter-note{ font-size:11px; color:var(--ink-faint); margin-left:2px; }
  .legend-swatch{ width:8px; height:8px; border-radius:2px; display:inline-block; flex:none; }
  .trend-chart{ display:flex; align-items:flex-end; gap:8px; height:120px; padding-top:6px; }
  .trend-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; min-width:0; }
  .trend-bars{ flex:1; display:flex; align-items:flex-end; gap:3px; width:100%; justify-content:center; }
  .trend-bar{ width:9px; border-radius:3px 3px 0 0; min-height:2px; }
  .trend-bar-new{ background:var(--accent); }
  .trend-bar-closed{ background:var(--good); }
  .trend-month{ font-size:10px; color:var(--ink-faint); font-weight:600; }
  .traj-total{ display:flex; align-items:baseline; gap:8px; margin:6px 0 10px; }
  .traj-total-value{ font-family:var(--font-display); font-weight:800; font-size:36px; letter-spacing:-.01em; color:var(--good); }
  .traj-total-label{ font-size:12px; color:var(--ink-faint); font-weight:600; }
  .traj-svg{ width:100%; height:auto; display:block; }
  .traj-area{ fill:var(--good-soft); stroke:none; }
  .traj-line{ fill:none; stroke:var(--good); stroke-width:2; }
  .traj-dot{ fill:var(--good); cursor:pointer; }
  .traj-axis-label{ font-family:var(--font-mono); font-size:8px; fill:var(--ink-faint); }
  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px; }
  .kpi-tile{
    background:var(--surface); border:1px solid var(--border-strong); border-top:3px solid var(--accent); border-radius:10px;
    padding:14px 16px; display:flex; flex-direction:column; gap:5px; box-shadow:0 2px 4px rgba(24,49,57,.1), 0 14px 30px -16px rgba(24,49,57,.32);
  }
  .kpi-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:800; }
  .kpi-value{ font-family:var(--font-mono); font-weight:800; font-size:23px; color:var(--ink); letter-spacing:-.01em; }
  .kpi-value.good{ color:var(--good); }
  .kpi-value.bad{ color:var(--bad); }
  .kpi-sub{ font-size:10.5px; color:var(--ink-faint); }
  .count-badge{
    font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--bad); background:var(--bad-soft);
    border-radius:20px; padding:1px 8px; margin-left:6px; vertical-align:middle;
  }
  .count-badge-neutral{ color:var(--ink-soft); background:var(--neutral-soft); }
  .hero-kpi-card{
    background:var(--accent-strong); color:var(--accent-ink); border-radius:14px; padding:22px 26px;
    margin-bottom:16px; box-shadow:0 4px 10px rgba(24,49,57,.18), 0 20px 40px -20px rgba(24,49,57,.45);
    display:flex; flex-direction:column; gap:14px;
  }
  .hero-kpi-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .hero-kpi-label{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:color-mix(in srgb, currentColor 75%, transparent); }
  .hero-kpi-value{ font-family:var(--font-mono); font-weight:800; font-size:42px; letter-spacing:-.01em; line-height:1.05; margin-top:4px; }
  .hero-kpi-goal{ font-size:13px; font-weight:600; color:color-mix(in srgb, currentColor 82%, transparent); margin-top:2px; }
  .hero-kpi-edit{
    border:1px solid color-mix(in srgb, currentColor 35%, transparent); background:color-mix(in srgb, currentColor 10%, transparent);
    color:inherit; border-radius:8px; padding:5px 10px; font-size:11.5px; font-weight:700; cursor:pointer; flex:none;
    font-family:var(--font-body);
  }
  .hero-kpi-edit:hover{ background:color-mix(in srgb, currentColor 20%, transparent); }
  .hero-kpi-track{ height:14px; border-radius:8px; background:color-mix(in srgb, currentColor 16%, transparent); overflow:hidden; }

  .hero-kpi-controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex:none; }

  /* Legacy flat-SVG map rules (us-map-svg/map-frame/us-state-shape/bubble-*) are unused now that
     renderPipelineMap() draws a real Leaflet+OpenStreetMap tile map instead — left in place only
     because they're harmless and a handful of other views still reference .map-legend/.map-note
     below. */
  .us-map-svg{ width:100%; height:auto; aspect-ratio:960/440; display:block; }
  .map-frame{ fill:var(--surface-2); stroke:var(--border); stroke-width:1px; }
  .us-state-shape{ fill:var(--surface-2); stroke:var(--border); stroke-width:.6px; pointer-events:none; }
  .us-state-shape-active{ fill:color-mix(in srgb, var(--accent) 16%, var(--surface-2)); stroke:color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .bubble-circle{ fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5px; cursor:pointer; transition:stroke-width .15s; }
  .bubble-circle-market{ fill:var(--brass); fill-opacity:.55; stroke:var(--brass); }
  .map-bubble:hover .bubble-circle{ stroke-width:2.5px; }
  .bubble-label{ font-family:var(--font-mono); font-size:9px; font-weight:700; fill:var(--accent-strong); text-anchor:middle; pointer-events:none; }
  .map-bubble:has(.bubble-circle-market) .bubble-label{ fill:var(--brass-ink); font-size:7.5px; }
  /* isolation:isolate contains Leaflet's own internal pane z-indices (its tile/marker/popup panes
     go up to z-index:700) inside this map's own stacking context, so they can never bleed out and
     render on top of a later-opened modal/slideover — those sit at z-index:90-100, which would
     otherwise lose to Leaflet's panes since neither this element nor its ancestors previously
     established a stacking context of their own. */
  #pipelineMap{ width:100%; aspect-ratio:960/440; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--surface-2); isolation:isolate; }
  #pipelineMap .leaflet-popup-content-wrapper, #pipelineMap .leaflet-popup-tip{ background:var(--surface); color:var(--ink); }
  #pipelineMap .leaflet-popup-content{ font-size:12px; margin:11px 14px; }

  /* Flashed by attachCtrlScrollZoom over any of the three Leaflet maps when someone scrolls
     without holding Ctrl/Cmd — same convention Google Maps embeds use, since a plain scroll is
     left alone to scroll the page instead of zooming the map. z-index:1000 only has to beat this
     one map's own panes (max 700) since isolation:isolate above scopes it to this element. */

    background:rgba(16,22,29,.5); color:#fff; font-size:12.5px; font-weight:700; text-align:center;
