  // pursued, so it shouldn't inflate the count of deals in play.
  document.getElementById("dealsCount").textContent = [...deals.values()].filter(d=>(d.stage||"prospecting")!=="dead").length;
  const brokersCountEl = document.getElementById("brokersCount");
  if(brokersCountEl) brokersCountEl.textContent = brokers.size;
  const ddCountEl = document.getElementById("ddTasksCount");
  if(ddCountEl) ddCountEl.textContent = [...deals.values()].filter(d=>(d.stage||"prospecting")==="signed_psa_dd").length;
  const capitalCountEl = document.getElementById("capitalCount");
  if(capitalCountEl){
    const preClose = [...deals.values()].filter(d=>(d.stage||"prospecting")==="signed_psa_dd");
    const gapCount = preClose.filter(d=> debtDealTotals(d).gap>0 || equityDealTotals(d).gap>0).length;
    capitalCountEl.textContent = gapCount;
  }
}

/* =================== board rendering =================== */
function matchesFilter(text, q){ return text.toLowerCase().includes(q); }

function renderBoard(){
  if(view==="dashboard"){ renderDashboard(); return; }
  if(view==="agenda"){ renderAgendaView(); return; }
  if(view==="screen"){ renderScreenView(); return; }
  if(view==="criteria"){ renderCriteriaView(); return; }
  if(view==="ddchecklist"){ renderDdTasksView(); return; }
  if(view==="brokers"){ renderBrokersView(); return; }
  if(view==="capital"){ renderCapitalView(); return; }
  const board = document.getElementById("board");
  if(view==="pipeline"){ board.classList.add("board-stack"); renderPipelineStages(); return; }
  board.classList.remove("board-stack");
  board.innerHTML = "";
  const q = (document.getElementById("searchInput").value||"").trim().toLowerCase();
  const cols = TASK_COLUMNS;
  const defaultKey = cols[0].key;

  cols.forEach(col=>{
    const colEl = document.createElement("div");
    colEl.className = "column";
    let list = [...tasks.entries()].filter(([id,d])=> (d.column||defaultKey)===col.key);
    if(q){
      list = list.filter(([id,d])=> matchesFilter([d.title,d.assignee,d.notes,d.priority].join(" ")||"", q));
    }
    list.sort((a,b)=> (a[1].order||0)-(b[1].order||0));

    colEl.innerHTML = `<div class="column-head">
        <span class="dot dot-${col.color}"></span>
        <span class="column-title">${col.title}</span>
        <span class="column-count mono">${list.length}</span>
        <button class="column-add" type="button" title="Add task to ${col.title}" aria-label="Add task to ${col.title}">+</button>
      </div>`;
    colEl.querySelector(".column-add").addEventListener("click", ()=> openEditTaskModal(null, col.key));
    const body = document.createElement("div");
    body.className = "column-body";
    body.dataset.col = col.key;
    body.addEventListener("dragover", e=>{ e.preventDefault(); body.classList.add("drag-over"); });
    body.addEventListener("dragleave", ()=> body.classList.remove("drag-over"));
    body.addEventListener("drop", e=>{
      e.preventDefault(); body.classList.remove("drag-over");
      if(!dragCard) return;
      updateTask(dragCard.id, taskColumnPatch(col.key));
      dragCard = null;
    });

    if(list.length===0){
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "No tasks here";
      body.appendChild(hint);
    }
    list.forEach(([id,d])=> body.appendChild(buildTaskCard(id,d)));
    colEl.appendChild(body);
    board.appendChild(colEl);
  });
  renderSuggestedTasks();
}

/* =================== suggested tasks (Tasks tab) =================== */
/* A read-of-the-pipeline "what needs a task" panel below the board: overdue/upcoming DD
   checklist items, deposits coming due, stalled deals, and pending IC decisions / unassessed
   screening criteria. Purely derived from existing deal data — nothing here is stored — so it
   recomputes fresh on every render and a suggestion disappears on its own once the underlying
   task exists or the condition is resolved. */
const DD_ITEMS_FLAT = DD_TEMPLATE.flatMap(cat=> cat.items.map(it=> Object.assign({category:cat.category}, it)));
const SUGGESTED_TASK_CATEGORY_META = {
  dd:      {label:"DD checklist", color:"warn"},
  deposit: {label:"Deposit",      color:"accent"},
  stalled: {label:"Stalled",      color:"neutral"},
  ic:      {label:"IC",           color:"bad"},
};
function computeSuggestedTasks(){
  const suggestions = [];
  const existingTitles = new Set([...tasks.values()].filter(t=>(t.column||"")!=="complete").map(t=> ((t.relatedDealId||"")+"::"+(t.title||"")).toLowerCase()));
  const push = (s)=>{ if(!existingTitles.has((s.dealId+"::"+s.title).toLowerCase())) suggestions.push(s); };

  const {overdue, upcoming, stalled} = getUrgentAlerts(deals);

  // Deposits coming due (overdue + upcoming deposit events only)
  [...overdue, ...upcoming].filter(e=> e.type==="deposit1" || e.type==="deposit2").forEach(e=>{
    const isOverdue = e.days<0;
    push({dealId:e.dealId, sigKey:`${e.dealId}::deposit::${e.type}`, category:"deposit",
      title:`Confirm ${EVENT_TYPE_META[e.type].label.toLowerCase()}${isOverdue?" (overdue)":""} — ${e.name}`,
      notes:`${EVENT_TYPE_META[e.type].label}${e.amount?` · ${fmtMoneyShort(e.amount)}`:""} — ${isOverdue?`${Math.abs(e.days)}d overdue`:e.days===0?"due today":`due in ${e.days}d`}`,
      priority: isOverdue?"high":"medium", dueDate: e.date});
  });

  // DD checklist items overdue / due within a week, for deals actively in DD
  [...deals.entries()].forEach(([id,d])=>{
    if((d.stage||"prospecting")!=="signed_psa_dd") return;
    const name = d.name||d.address||"Untitled deal";
    const cache = checklistCache.get(id) || new Map();
    DD_ITEMS_FLAT.forEach(item=>{
      const v = cache.get(item.key);
      if(!v || !v.targetDate || v.status==="complete" || v.status==="na") return;
      const days = daysUntil(v.targetDate);
      if(days===null || days>7) return;
      const isOverdue = days<0;
      push({dealId:id, sigKey:`${id}::dd::${item.key}`, category:"dd",
        title:`${item.label}${isOverdue?" — overdue":" — due soon"} (${name})`,
        notes:`${item.category} — ${isOverdue?`${Math.abs(days)}d overdue`:days===0?"due today":`due ${fmtDate(v.targetDate)}`}`,
        priority: isOverdue?"high":"medium", dueDate: v.targetDate});
    });
  });

  // Stalled deals — no update in a while
  stalled.forEach(s=>{
    push({dealId:s.dealId, sigKey:`${s.dealId}::stalled`, category:"stalled",
      title:`Check in — no update in ${s.days}d (${s.name})`,
      notes:`No activity logged on this deal in ${s.days} days.`,
      priority:"low", dueDate:""});
  });

  // Pending IC decisions / unassessed screening criteria
  [...deals.entries()].forEach(([id,d])=>{
    const stage = d.stage||"prospecting";
    if(stage==="dead" || stage==="onboarded") return;
    const name = d.name||d.address||"Untitled deal";
    if(d.icFlagged && !d.icDecision){
      push({dealId:id, sigKey:`${id}::ic::flag`, category:"ic",
        title:`Schedule IC discussion — ${name}`,
        notes: d.icFlagNote ? `Flagged: ${d.icFlagNote}` : "Flagged for IC discussion.",
        priority:"high", dueDate:""});
    }
    if(stage==="signed_psa_dd" && !d.icDecision){
      const cache = criteriaCache.get(id) || new Map();
      const list = activeIcCriteria(d);
      const tbd = list.filter(c=> !cache.get(c.key) || cache.get(c.key).status==="tbd").length;
      if(list.length && tbd>0){
        push({dealId:id, sigKey:`${id}::ic::criteria`, category:"ic",
          title:`Finish screening criteria — ${name}`,
          notes:`${tbd} of ${list.length} criteria not yet assessed.`,
          priority:"medium", dueDate:""});
      }
    }
  });

  const priorityRank = {high:0, medium:1, low:2};
  suggestions.sort((a,b)=> priorityRank[a.priority]-priorityRank[b.priority]);
  return suggestions;
}
function renderSuggestedTasks(){
  const wrap = document.getElementById("suggestedTasksWrap");
  if(!wrap) return;
  const allRaw = computeSuggestedTasks();

  // Prune stale dismissals: once a dismissed suggestion's underlying condition resolves (deposit
  // confirmed, DD item completed, deal un-stalls, etc.) it drops out of allRaw on its own — so any
  // dismissal no longer matching a live suggestion is dead weight and gets swept here rather than
  // growing settings/dismissedSuggestions forever.
  const liveSigKeys = new Set(allRaw.map(s=>s.sigKey));
  const pruned = new Set([...dismissedSuggestions].filter(k=>liveSigKeys.has(k)));
  if(pruned.size !== dismissedSuggestions.size){
    dismissedSuggestions = pruned;
    saveDismissedSuggestions();
  }

  const all = allRaw.filter(s=> !dismissedSuggestions.has(s.sigKey));
  const q = (document.getElementById("searchInput").value||"").trim().toLowerCase();
  const list = q ? all.filter(s=> matchesFilter([s.title,s.notes].join(" "), q)) : all;
  const dismissedCount = dismissedSuggestions.size;

  if(!list.length){
    wrap.innerHTML = `<div class="dash-card suggested-tasks-card" style="margin-top:16px;">
      <h4 class="section-label">Suggested tasks</h4>
      <div class="empty-hint">${all.length ? "No suggestions match your filter." : "Nothing to suggest right now — you're caught up."}${(!all.length && dismissedCount) ? ` (${dismissedCount} dismissed)` : ""}</div>
    </div>`;
    return;
  }
  wrap.innerHTML = `<div class="dash-card suggested-tasks-card" style="margin-top:16px;">
    <h4 class="section-label">Suggested tasks <span class="count-badge">${list.length}</span>${dismissedCount ? `<span class="cat-count">${dismissedCount} dismissed</span>` : ""}</h4>
    <div class="suggested-tasks-list">
      ${list.map((s,i)=>{
        const cat = SUGGESTED_TASK_CATEGORY_META[s.category];
        return `<div class="suggested-task-row">
          <span class="pill pill-solid pill-${cat.color}">${cat.label}</span>
          <div class="suggested-task-body">
            <span class="suggested-task-title">${escapeHtml(s.title)}</span>
            <span class="suggested-task-notes">${escapeHtml(s.notes)}</span>
          </div>
          <button type="button" class="btn btn-primary suggested-task-add" data-idx="${i}">+ Add</button>
          <button type="button" class="btn-icon suggested-task-dismiss" data-idx="${i}" title="Dismiss this suggestion">✕</button>
        </div>`;
      }).join("")}
    </div>
  </div>`;
  wrap.querySelectorAll(".suggested-task-add").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const s = list[Number(btn.getAttribute("data-idx"))];
      if(!s) return;
      btn.disabled = true;
      createTask({
        title: s.title, assignee: whoName(), dueDate: s.dueDate||"", priority: s.priority,
        relatedDealId: s.dealId, notes: s.notes, hjReview: false,
        column: "backlog", order: Date.now(), createdAt: new Date().toISOString(), completedAt: null,
      });
      showToast(`Added "${s.title}" to Tasks`, "good");
      renderSuggestedTasks();
    });
  });
  wrap.querySelectorAll(".suggested-task-dismiss").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const s = list[Number(btn.getAttribute("data-idx"))];
      if(!s) return;
      dismissedSuggestions.add(s.sigKey);
      saveDismissedSuggestions();
      renderSuggestedTasks();
    });
  });
}

/* =================== acquisitions pipeline: vertical stage-grouped layout =================== */
function stripPillPrefix(cls){ return String(cls||"").replace(/^pill-/,""); }

/* Totals & averages for one stage section — total purchase price is also shown in the
   stage-header subtotal, repeated here alongside the averages so the whole picture for a
   section (how many deals, what they're worth on average, how far along on average) sits
   in one place regardless of whether Compact or Detailed density is active. */
function stageSummaryBarHtml(list){
  if(!list.length) return "";
  const prices = list.map(([id,d])=>Number(d.purchasePrice)||0).filter(v=>v>0);
  const totalPrice = prices.reduce((s,v)=>s+v,0);
  const avgPrice = prices.length ? totalPrice/prices.length : null;
  const ppus = list.map(([id,d])=>pricePerUnit(d)).filter(v=>v!=null);
  const avgPpu = ppus.length ? ppus.reduce((s,v)=>s+v,0)/ppus.length : null;
  const pcts = list.map(([id,d])=>dealStageProgressPct(d).pct);
  const avgPct = pcts.length ? Math.round(pcts.reduce((s,v)=>s+v,0)/pcts.length) : 0;
  return `<div class="stage-summary-bar">
    <span class="stage-summary-item"><span class="stage-summary-label">Total price</span><span class="stage-summary-value">${totalPrice?fmtMoneyShort(totalPrice):"—"}</span></span>
    <span class="stage-summary-item"><span class="stage-summary-label">Avg price</span><span class="stage-summary-value">${avgPrice?fmtMoneyShort(avgPrice):"—"}</span></span>
    <span class="stage-summary-item"><span class="stage-summary-label">Avg $/unit</span><span class="stage-summary-value">${avgPpu?fmtMoneyShort(avgPpu):"—"}</span></span>
    <span class="stage-summary-item"><span class="stage-summary-label">Avg progress</span><span class="stage-summary-value">${avgPct}%</span></span>
  </div>`;
}

function stageHighlightFields(stageKey, d, extra){
  const {cap, uw, applicable, complete, ddPct} = extra;
  const priceStr = d.purchasePrice ? fmtMoneyShort(d.purchasePrice) : "—";
  const capStr = cap ? fmtMoneyShort(cap.basis) : "—";
  const marginStr = (uw && uw.marginRevenue!==null && uw.marginRevenue!==undefined) ? (uw.marginRevenue*100).toFixed(0)+"%" : "—";
  const marginCls = (uw && uw.marginRevenue!==null && uw.marginRevenue!==undefined) ? stripPillPrefix(marginPillClass(uw.marginRevenue)) : "";
  const debtEquityStr = cap ? `${fmtMoneyShort(cap.debtAmount)} / ${fmtMoneyShort(cap.equityAmount)}` : "—";
  const closeDate = d.closingDate ? fmtDate(d.closingDate)+urgencySuffix(d.closingDate) : "—";
  const closeCls = d.closingDate ? stripPillPrefix(urgencyClass(d.closingDate)) : "";
  const nonRefDate = d.inspectionEndDate ? fmtDate(d.inspectionEndDate)+urgencySuffix(d.inspectionEndDate) : "—";
  const nonRefCls = d.inspectionEndDate ? stripPillPrefix(urgencyClass(d.inspectionEndDate)) : "";
  const ppu = pricePerUnit(d);
  const ppuStr = ppu ? fmtMoneyShort(ppu)+"/unit" : "—";

  let fields;
  switch(stageKey){
    case "prospecting":
      fields = [
        {label:"Location", value: escapeHtml(d.address||"—")},
        {label:"Asking price", value: priceStr},
        {label:"Source", value: escapeHtml(d.source||"—")},
        {label:"Product line", value: escapeHtml(d.productLine||"—")},
        {label:"Criteria score", value: (d.icScore!=null && d.icScoreCount) ? `${d.icScore.toFixed(1)}/10` : "Not rated",
          cls: d.icScore==null ? "" : (d.icScore>=7.5?"good":d.icScore>=5?"warn":"bad")},
      ];
      break;
    case "underwriting":
      fields = [
        {label:"Purchase price", value: priceStr},
        {label:"Est. margin", value: marginStr, cls: marginCls},
        {label:"Capital needed", value: capStr},
        {label:"Debt / Equity", value: debtEquityStr},
      ];
      break;
    case "submitted_loi":
      fields = [
        {label:"Offer price", value: priceStr},
        {label:"LOI submitted", value: d.loiSubmittedDate?fmtDate(d.loiSubmittedDate):"—"},
        {label:"Expected close", value: closeDate, cls: closeCls},
        {label:"Capital needed", value: capStr},
      ];
      break;
    case "signed_loi":
      fields = [
        {label:"PSA / effective date", value: d.effectiveDate?fmtDate(d.effectiveDate):"—"},
        {label:"Non-refundable date", value: nonRefDate, cls: nonRefCls},
        {label:"Expected close", value: closeDate, cls: closeCls},
        {label:"Earnest money", value: d.deposit1Amount?fmtMoneyShort(d.deposit1Amount):"—"},
      ];
      break;
    case "signed_psa_dd":
      fields = [
        {label:"DD progress", value: `${complete}/${applicable} (${ddPct}%)`},
        {label:"Non-refundable date", value: nonRefDate, cls: nonRefCls},
        {label:"Expected close", value: closeDate, cls: closeCls},
        {label:"Earnest money", value: d.deposit1Amount?`${fmtMoneyShort(d.deposit1Amount)} · ${d.deposit1Status||"Not Due"}`:"—"},
      ];
      break;
    case "onboarded":
      fields = [
        {label:"Close date", value: (d.actualCloseDate||d.closingDate) ? fmtDate(d.actualCloseDate||d.closingDate) : "—"},
        {label:"Purchase price", value: priceStr},
        {label:"Capital deployed", value: capStr},
        {label:"Deal lead", value: escapeHtml(d.lead||"—")},
      ];
      break;
    case "dead":
      fields = [
        {label:"Purchase price", value: priceStr},
        {label:"Deal lead", value: escapeHtml(d.lead||"—")},
        {label:"Last updated", value: d.updatedAt ? fmtDate(d.updatedAt.slice(0,10)) : "—"},
        {label:"Source", value: escapeHtml(d.source||"—")},
      ];
      break;
    default:
      fields = [];
  }
  // Purchase price / targeted unit is important across every stage, so it's always the last tile —
  // same for market and acreage/$-per-acre, so both read at a glance in every stage's list without
  // opening the deal.
  fields.push({label:"Price / unit", value: ppuStr});
  fields.push({label:"Market", value: escapeHtml(dealMarketLabel(d))});
  fields.push({label:"Acreage", value: escapeHtml(acresSummaryText(d))});
  return fields;
}

function buildStageDealRow(id, d, stage){
  const row = document.createElement("div");
  const priority = dealPriority(d);
  row.className = "stage-row" + (priority==="high" ? " stage-row-priority-high" : priority==="medium" ? " stage-row-priority-medium" : "");
  row.style.borderLeftColor = `var(--${stage.color})`;
  row.addEventListener("click", (e)=>{
    if(e.target.closest(".move-select") || e.target.closest(".priority-select") || e.target.closest(".star-btn") || e.target.closest(".stage-owner-input") || e.target.closest(".link-icons")) return;
    openDealDetail(id);
  });

  const cap = calcCapitalStack(d);
  const uw = calcUnderwriting(d);
  const applicable = d.ddApplicable ?? DD_TOTAL;
  const complete = d.ddComplete ?? 0;
  const ddPct = applicable>0 ? Math.round((complete/applicable)*100) : 0;
  const highlights = stageHighlightFields(stage.key, d, {cap, uw, applicable, complete, ddPct});
  const owner = (d.stageOwners && d.stageOwners[stage.key]) || "";

  row.innerHTML = `
    <div class="stage-row-top">
      <div class="stage-row-title-wrap">
        <span class="stage-row-title"></span>
        <button class="star-btn${d.meetsTargetCriteria?" active":""}" title="Meets target criteria">★</button>
        <select class="priority-select" title="Priority"></select>
        ${productLineBadgeHtml(d)}${priorityBadgeHtml(d)}${recPillHtml(d)}${tierPillHtml(d)}${icSummaryPillHtml(d)}${icScorePillHtml(d)}${icDecisionPillHtml(d)}${icFlagBadgeHtml(d)}
      </div>
      ${d.address ? `<div class="stage-row-sub"></div>` : ""}
      ${dealProgressBarHtml(d, {size:"sm"})}
    </div>
    <div class="stage-row-fields">
      ${highlights.map(h=>`<div class="stage-field"><span class="stage-field-label">${h.label}</span><span class="stage-field-value${h.cls?" "+h.cls:""}">${h.value}</span></div>`).join("")}
    </div>
    <div class="stage-row-owner">
      <label class="stage-field-label">Responsible</label>
      <input class="cdate-input stage-owner-input" type="text" value="${escapeAttr(owner)}" placeholder="Assign owner…">
    </div>
    <div class="stage-row-actions">
      <select class="move-select"></select>
      <div class="link-icons">
        ${d.address ? `<a class="icon-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.address)}" target="_blank" rel="noopener" title="Open in Google Maps">📍</a>` : ""}
        ${d.folderUrl ? `<a class="icon-link" href="${normalizeUrl(d.folderUrl)}" target="_blank" rel="noopener" title="Project folder">📁</a>` : ""}
        ${d.proformaUrl ? `<a class="icon-link" href="${normalizeUrl(d.proformaUrl)}" target="_blank" rel="noopener" title="Pro forma">📈</a>` : ""}
      </div>
    </div>`;
  row.querySelector(".stage-row-title").textContent = d.name || "Untitled deal";
  if(d.address) row.querySelector(".stage-row-sub").textContent = d.address;
  row.querySelector(".star-btn").addEventListener("click", (e)=>{
    e.stopPropagation();
    updateDeal(id, {meetsTargetCriteria: !d.meetsTargetCriteria});
  });
  const prioritySel = row.querySelector(".priority-select");
  ["high","medium","low"].forEach(p=>{
    const o = document.createElement("option"); o.value=p; o.textContent=PRIORITY_META[p].label+" priority";
    if(priority===p) o.selected = true;
    prioritySel.appendChild(o);
  });
  colorSelectByStatus(prioritySel, PRIORITY_META[priority].cls);
  prioritySel.addEventListener("click", e=>e.stopPropagation());
  prioritySel.addEventListener("change", ()=> updateDeal(id, {priority: prioritySel.value}));
  const sel = row.querySelector(".move-select");
  DEAL_STAGES.forEach(s=>{
    const o = document.createElement("option"); o.value=s.key; o.textContent="Move to "+s.title;
    if((d.stage||"prospecting")===s.key) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("click", e=>e.stopPropagation());
  sel.addEventListener("change", ()=>{
    const newStage = sel.value, prevStage = d.stage||"prospecting";
    confirmStageChange(d, newStage, ()=> updateDeal(id, {stage: newStage, order: Date.now()}), ()=>{ sel.value = prevStage; });
  });
  const ownerInput = row.querySelector(".stage-owner-input");
  ownerInput.addEventListener("click", e=>e.stopPropagation());
  ownerInput.addEventListener("change", e=>{
    const next = Object.assign({}, d.stageOwners||{}, {[stage.key]: e.target.value.trim()});
    updateDeal(id, {stageOwners: next});
  });
  return row;
}

function setPipelineDensity(mode){
  pipelineDensity = mode;
  try{ localStorage.setItem("dealdesk_pipeline_density", mode); }catch(e){}
  renderPipelineStages();
}

    <span class="src-updated mono">${updated}</span>
    <select class="move-select src-move"></select>`;
  row.querySelector(".src-name").textContent = d.name || "Untitled deal";
  if(d.address) row.querySelector(".src-address").textContent = d.address;
  row.querySelector(".src-market").textContent = dealMarketLabel(d);
  const sel = row.querySelector(".src-move");
  DEAL_STAGES.forEach(s=>{
    const o = document.createElement("option"); o.value=s.key; o.textContent=s.title;
    if((d.stage||"prospecting")===s.key) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("click", e=>e.stopPropagation());
  sel.addEventListener("change", ()=>{
    const newStage = sel.value, prevStage = d.stage||"prospecting";
    confirmStageChange(d, newStage, ()=> updateDeal(id, {stage: newStage, order: Date.now()}), ()=>{ sel.value = prevStage; });
  });
  const ownerInput = row.querySelector(".src-owner-input");
  ownerInput.addEventListener("click", e=>e.stopPropagation());
  ownerInput.addEventListener("change", e=>{
    const next = Object.assign({}, d.stageOwners||{}, {[stage.key]: e.target.value.trim()});
    updateDeal(id, {stageOwners: next});
  });
  return row;
}

function renderCompareMatrix(){
  const wrap = document.getElementById("compareMatrixWrap");
  if(!wrap) return;
  const selected = [...compareSelectedIds].map(id=>[id, deals.get(id)]).filter(([id,d])=>d);
  if(selected.length<2){
    wrap.innerHTML = `<div class="stage-empty-line" style="padding:40px 20px;text-align:center;">Select at least 2 deals on the left to build a weighted comparison.</div>`;
    return;
  }

  const ctxOf = new Map();
  selected.forEach(([id,d])=>{
    const cap = calcCapitalStack(d);
    const uw = calcUnderwriting(d);
    const applicable = d.ddApplicable ?? DD_TOTAL;
    const complete = d.ddComplete ?? 0;
    ctxOf.set(id, {cap, uw, applicable, complete});
  });

  const raw = new Map();
  SCORING_CRITERIA.forEach(c=>{
    const m = new Map();
    selected.forEach(([id,d])=> m.set(id, c.get(d, ctxOf.get(id))));
    raw.set(c.key, m);
  });

  const norm = new Map();
  SCORING_CRITERIA.forEach(c=>{
    const m = raw.get(c.key);
    const vals = [...m.values()].filter(v=>v!=null);
    const lo = vals.length ? Math.min(...vals) : 0;
    const hi = vals.length ? Math.max(...vals) : 0;
    const out = new Map();
    selected.forEach(([id])=>{
      const v = m.get(id);
      if(v==null){ out.set(id, null); return; }
      if(hi===lo){ out.set(id, 100); return; }
      const pct = (v-lo)/(hi-lo);
      out.set(id, Math.round((c.dir==="higher" ? pct : 1-pct)*100));
    });
    norm.set(c.key, out);
  });

  const totals = new Map();
  selected.forEach(([id])=>{
    let sum=0, wsum=0;
    SCORING_CRITERIA.forEach(c=>{
      const s = norm.get(c.key).get(id);
      const w = Number(scoringWeights[c.key])||0;
      if(s!=null && w>0){ sum += s*w; wsum += w; }
    });
    totals.set(id, wsum ? Math.round(sum/wsum) : 0);
  });

  const ranked = [...selected].sort((a,b)=> (totals.get(b[0])-totals.get(a[0])));
  const topId = ranked.length ? ranked[0][0] : null;

  const fmtRaw = (c, v)=>{
    if(v==null) return "—";
    if(c.unit==="pct") return Math.round(v)+"%";
    if(c.unit==="money") return fmtMoneyShort(v);
    if(c.unit==="bool") return v>=100 ? "Yes" : "No";
    return v;
  };
  const scoreColor = (s)=>{
    if(s==null) return "";
    if(s>=70) return "good";
    if(s>=40) return "warn";
    return "bad";
  };

  wrap.innerHTML = `
    <table class="compare-table">
      <thead>
        <tr>
          <th class="compare-crit-col">Criterion <span class="compare-weight-hint">(weight 0–10)</span></th>
          ${ranked.map(([id,d])=>`<th class="compare-deal-col${id===topId?" is-top":""}">${id===topId?"🏆 ":""}${escapeHtml(d.name||"Untitled deal")}</th>`).join("")}
        </tr>
      </thead>
      <tbody>
        ${SCORING_CRITERIA.map(c=>`
          <tr>
            <td class="compare-crit-label">
              ${c.label}
              <input type="number" class="compare-weight-input" min="0" max="10" step="1" data-crit="${c.key}" value="${scoringWeights[c.key]}">
            </td>
            ${ranked.map(([id])=>{
              const v = raw.get(c.key).get(id);
              const s = norm.get(c.key).get(id);
              return `<td class="compare-cell compare-cell-${scoreColor(s)}">
                <span class="compare-cell-raw">${fmtRaw(c,v)}</span>
                ${s!=null ? `<span class="compare-cell-score mono">score ${s}</span>` : ""}
              </td>`;
            }).join("")}
          </tr>`).join("")}
        <tr class="compare-row-total">
          <td class="compare-crit-label">Weighted total</td>
          ${ranked.map(([id])=>`<td class="compare-cell compare-cell-total${id===topId?" is-top":""}"><span class="compare-cell-score mono">${totals.get(id)}</span></td>`).join("")}
        </tr>
      </tbody>
    </table>`;
  wrap.querySelectorAll(".compare-weight-input").forEach(inp=>{
    inp.addEventListener("click", e=>e.stopPropagation());
    inp.addEventListener("change", ()=>{
      const key = inp.getAttribute("data-crit");
      let v = Number(inp.value);
      if(!Number.isFinite(v)) v = 0;
      v = Math.max(0, Math.min(10, v));
      scoringWeights[key] = v;
      try{ localStorage.setItem("dealdesk_scoring_weights", JSON.stringify(scoringWeights)); }catch(e){}
      renderCompareMatrix();
    });
  });
}

function showToast(message, kind){
  const existing = document.getElementById("toastRoot");
  if(existing) existing.remove();
  const el = document.createElement("div");
  el.id = "toastRoot";
  el.className = "toast toast-"+(kind||"neutral");

  }, 4000);
}

/* =================== print / save-as-PDF (sandbox-safe) ===================
   window.print() alone is unreliable once this app runs inside a hosted artifact's sandboxed
   iframe — sandboxed iframes commonly block the native print dialog outright, which shows up
   as "the print button does nothing" with no error and no visible failure. This helper tries
   window.open() + print() in a real (unsandboxed) tab first, since that gives the best one-click
   experience when pop-ups happen to be allowed; if the pop-up is blocked or window.open() isn't
   permitted either (same sandbox restriction, likely in this hosting environment), it falls back
   to downloading a standalone, fully self-styled HTML file the person can open in any normal
   browser tab and print from there (Ctrl/Cmd+P), which always works because it's no longer
   running inside any sandbox. Reuses the exact overlay element (id and all) that's already on
   screen, so the existing #icMemoOverlay/#agendaPrintOverlay/#onePagerOverlay print CSS rules
   above apply identically either way. */
function openPrintableWindow(overlayEl, filename){
  const styleHtml = Array.from(document.querySelectorAll("style")).map(s=>s.outerHTML).join("\n");
  const docHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${filename||"Print"}</title>${styleHtml}<style>html,body{margin:0;background:#fff;}</style></head><body>${overlayEl.outerHTML}</body></html>`;
  let win = null;
  try{ win = window.open("", "_blank"); }catch(e){ win = null; }
  if(win && win.document){
    try{
      win.document.open(); win.document.write(docHtml); win.document.close();
      setTimeout(()=>{ try{ win.focus(); win.print(); }catch(e){} }, 350);
      return;
    }catch(e){ /* fall through to download below */ }
  }
  try{
    const blob = new Blob([docHtml], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = (filename||"deal-desk-print") + ".html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    if(typeof showToast === "function") showToast("Pop-ups are blocked here — downloaded a printable file instead. Open it, then press Ctrl/Cmd+P.", "good");
  }catch(e){
    if(typeof showToast === "function") showToast("Couldn't open a print preview.", "bad");
  }
}

function csvEscape(v){
  const s = String(v===undefined||v===null ? "" : v);
  if(/[",\n\r]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
async function exportPipelineCsv(){
  const btn = document.getElementById("exportCsvBtn");
  const dl = await ensureDownloadsCap();
  if(!dl){
    showToast("File export isn't available in this view.", "bad");
    return;
  }
  const rows = [...deals.entries()].filter(([id,d])=>dealPassesFilters(d));
  const headers = ["Deal name","Stage","Recommendation","Address","State","Market tier","Investment criteria assessed","IC decision","IC decided by","IC decision date","Purchase price","Targeted units","Price per unit","Capital needed","Debt","Equity","Est. margin %","DD complete","DD applicable","Source","Broker","Broker firm","Product line","Property type","Deal type","Deal lead","Meets target criteria","Next step","Decision required","Created","Last updated","Expected close date","Actual close date","Notes"];
  const lines = [headers.map(csvEscape).join(",")];
  rows.forEach(([id,d])=>{
    const cap = calcCapitalStack(d);
    const uw = calcUnderwriting(d);
    const stage = DEAL_STAGES.find(s=>s.key===(d.stage||"prospecting"));
    const ppu = pricePerUnit(d);
    const icAssessed = (d.icFit||0)+(d.icWatch||0)+(d.icNoFit||0);
    const icSummary = icAssessed ? `${icAssessed}/${d.icTotal||activeIcCriteria(d).length} (${d.icFit||0} fit, ${d.icWatch||0} watch, ${d.icNoFit||0} no-fit)` : "";
    lines.push([
      d.name||"", stage?stage.title:"", REC_META[d.recommendation]?REC_META[d.recommendation].label:"",
      d.address||"", dealStateCode(d)||"", d.marketTier?"Tier "+d.marketTier:"", icSummary,
      IC_DECISION_META[d.icDecision||""].label, d.icDecisionBy||"", d.icDecisionDate||"",
      d.purchasePrice??"", d.targetUnits??"", ppu?Math.round(ppu):"",
      cap?Math.round(cap.basis):"", cap?Math.round(cap.debtAmount):"", cap?Math.round(cap.equityAmount):"",
      (uw && uw.marginRevenue!=null) ? (uw.marginRevenue*100).toFixed(1) : "",
      d.ddComplete??"", d.ddApplicable??DD_TOTAL,
      d.source||"", (brokers.get(d.brokerId||"")||{}).name||"", (brokers.get(d.brokerId||"")||{}).firm||"",
      d.productLine||"", d.propertyType||"", d.dealType||"",
      d.lead||"", d.meetsTargetCriteria?"Yes":"No",
      d.nextStep||"", d.decisionRequired||"",
      d.createdAt?d.createdAt.slice(0,10):"", d.updatedAt?d.updatedAt.slice(0,10):"",
      d.closingDate||"", d.actualCloseDate||"", d.notes||"",
    ].map(csvEscape).join(","));
  });
  const csv = lines.join("\r\n");
  const stamp = new Date().toISOString().slice(0,10);
  if(btn){ btn.disabled = true; btn.textContent = "Exporting…"; }
  try{
    await dl.save({filename:`deal-desk-pipeline-${stamp}.csv`, data: csv});
    showToast("Pipeline exported.", "good");
  }catch(err){
    if(!err || err.code!=="declined"){
      showToast("Couldn't export the file"+(err && err.message ? ": "+err.message : "."), "bad");
    }
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "⬇ Export CSV"; }
  }
}

/* =================== deadline alerts & stalled deals =================== */
function getUrgentAlerts(dealMap, asOfIso){
  const map = dealMap || deals;
  const events = getDealEvents(map);
  const overdue = [], upcoming = [];
  events.forEach(e=>{
    if(e.type==="closed") return;
    const days = daysUntil(e.date, asOfIso);
    if(days===null) return;
    if(days<0) overdue.push(Object.assign({}, e, {days}));
    else if(days<=14) upcoming.push(Object.assign({}, e, {days}));
  });
  overdue.sort((a,b)=>a.days-b.days);
  upcoming.sort((a,b)=>a.days-b.days);

  const stalled = [];
  const now = asOfIso ? new Date(asOfIso+"T00:00:00").getTime() : Date.now();
  map.forEach((d,id)=>{
    const stage = d.stage||"prospecting";
    if(stage==="dead" || stage==="onboarded") return;
    const ref = d.updatedAt || d.createdAt;
    if(!ref) return;
    const t = new Date(ref).getTime();
    if(isNaN(t)) return;
    const days = Math.floor((now-t)/86400000);
    if(days>=21) stalled.push({dealId:id, name:d.name||d.address||"Untitled deal", days});
  });
  stalled.sort((a,b)=>b.days-a.days);
  return {overdue, upcoming, stalled};
}
function alertBarHtml(overdue, upcoming, stalled){
  if(!overdue.length && !upcoming.length && !stalled.length) return "";
  const chips = [];
  if(overdue.length) chips.push(`<button type="button" class="alert-chip alert-chip-bad" id="alertOverdueChip">⚠ ${overdue.length} date${overdue.length===1?"":"s"} overdue</button>`);
  if(upcoming.length) chips.push(`<button type="button" class="alert-chip alert-chip-warn" id="alertUpcomingChip">⏰ ${upcoming.length} due in 14 days</button>`);
  if(stalled.length) chips.push(`<button type="button" class="alert-chip alert-chip-neutral" id="alertStalledChip">🐌 ${stalled.length} stalled 21+ days</button>`);
  return `<div class="alert-bar">${chips.join("")}</div>`;
}
function wireAlertBar(overdue, upcoming, stalled){
  const ob = document.getElementById("alertOverdueChip");
  if(ob) ob.addEventListener("click", ()=> openAlertDetail("overdue", overdue));
  const ub = document.getElementById("alertUpcomingChip");
  if(ub) ub.addEventListener("click", ()=> openAlertDetail("upcoming", upcoming));
  const sb = document.getElementById("alertStalledChip");
  if(sb) sb.addEventListener("click", ()=> openAlertDetail("stalled", stalled));
}
function openAlertDetail(kind, list){
  const existing = document.getElementById("alertOverlay");
  if(existing) existing.remove();
  const titles = {
    overdue: "⚠ Overdue critical dates",
    upcoming: "⏰ Due in the next 14 days",
    stalled: "🐌 Stalled deals — no update in 21+ days",
  };
  const rowsHtml = list.map(item=>{
    if(kind==="stalled"){
      return `<button type="button" class="alert-detail-row" data-id="${item.dealId}">
        <span class="dot dot-neutral"></span>
        <span class="alert-detail-name">${escapeHtml(item.name)}</span>
        <span class="alert-detail-date mono">${item.days} days since last update</span>
      </button>`;
    }
    const meta = EVENT_TYPE_META[item.type] || {label:item.type, color:"neutral"};
    const dayLabel = item.days<0 ? `${Math.abs(item.days)}d overdue` : item.days===0 ? "today" : `in ${item.days}d`;
    return `<button type="button" class="alert-detail-row" data-id="${item.dealId}">
      <span class="dot dot-${meta.color}"></span>
      <span class="alert-detail-name">${escapeHtml(item.name)}</span>
      <span class="alert-detail-type">${escapeHtml(meta.label)}</span>
      <span class="alert-detail-date mono">${fmtDate(item.date)} · ${dayLabel}</span>
    </button>`;
  }).join("");
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "alertOverlay";
  overlay.innerHTML = `<div class="modal alert-modal">
    <div class="modal-head"><h2>${titles[kind]||"Alerts"}</h2><button type="button" class="btn-icon" id="alertCloseBtn" style="margin-left:auto;">✕ Close</button></div>
    <div class="alert-detail-list">${rowsHtml || `<div class="stage-empty-line" style="padding-left:0;">Nothing here</div>`}</div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById("alertCloseBtn").addEventListener("click", ()=> overlay.remove());
  overlay.querySelectorAll(".alert-detail-row").forEach(row=>{
    row.addEventListener("click", ()=>{
      overlay.remove();
      openDealDetail(row.getAttribute("data-id"));
    });
  });
}

/* A single scannable row per in-contract deal (Signed PSA/DD) with the core facts leadership
   asks for first — name, location, status, lot size, price, and the key dates — rather than
   needing to open each deal to find them. */
function basicsTableCardHtml(dealEntries){
  const rows = dealEntries.slice().sort((a,b)=> (a[1].name||a[1].address||"").localeCompare(b[1].name||b[1].address||""));
  if(!rows.length){
    return `<div class="dash-card basics-card" style="margin-bottom:16px;">
      <h4 class="section-label">Under contract — basics</h4>
      <div class="empty-hint">No deals are under contract yet — this fills in once a deal reaches Signed PSA/DD.</div>
    </div>`;
  }
  const rowHtml = ([id,d])=>{
    const stage = DEAL_STAGES.find(s=>s.key===(d.stage||"prospecting")) || DEAL_STAGES[0];
    const nextDep = nextDepositDue(d);
    return `<tr class="basics-row" data-deal="${escapeAttr(id)}">
      <td class="basics-td basics-td-name">${escapeHtml(d.name||"Untitled deal")}</td>
      <td class="basics-td">${escapeHtml(d.address||"—")}</td>
      <td class="basics-td"><span class="pill pill-solid pill-${stage.color}">${escapeHtml(stage.title)}</span></td>
      <td class="basics-td">${escapeHtml(d.psaStatus||"—")}</td>
      <td class="basics-td mono">${d.lotSizeAcres ? fmtAcres(d.lotSizeAcres) : "—"}</td>
      <td class="basics-td mono">${d.purchasePrice ? fmtMoneyShort(d.purchasePrice) : "—"}</td>
      <td class="basics-td mono">${perAcre(d) ? fmtMoneyShort(perAcre(d))+"/ac" : "—"}</td>
      <td class="basics-td mono">${d.effectiveDate ? fmtDate(d.effectiveDate) : "—"}</td>
      <td class="basics-td mono">${nextDep ? `<span class="basics-date-val ${stripPillPrefix(urgencyClass(nextDep.date))}">${fmtDate(nextDep.date)}${urgencySuffix(nextDep.date)}</span> ${fmtMoneyShort(nextDep.amount)}` : "—"}</td>
      <td class="basics-td mono">${d.inspectionEndDate ? `<span class="basics-date-val ${stripPillPrefix(urgencyClass(d.inspectionEndDate))}">${fmtDate(d.inspectionEndDate)}${urgencySuffix(d.inspectionEndDate)}</span>` : "—"}</td>
      <td class="basics-td mono">${d.closingDate ? `<span class="basics-date-val ${stripPillPrefix(urgencyClass(d.closingDate))}">${fmtDate(d.closingDate)}${urgencySuffix(d.closingDate)}</span>` : "—"}</td>
    </tr>`;
  };
  return `<div class="dash-card basics-card" style="margin-bottom:16px;">
    <h4 class="section-label">Under contract — basics <span class="cat-count">${rows.length} deal${rows.length===1?"":"s"}</span></h4>
    <div class="basics-table-wrap">
      <table class="basics-table">
        <thead><tr>
          <th>Project</th><th>Location</th><th>Status</th><th>PSA status</th><th>Lot size</th>
          <th>Purchase price</th><th>$/acre</th><th>Effective date</th><th>Next deposit due</th>
          <th>Inspection end</th><th>Closing date</th>
        </tr></thead>
        <tbody>${rows.map(rowHtml).join("")}</tbody>
      </table>
    </div>
  </div>`;
}

/* =================== dashboard: "Needs your attention" =================== */
/* One plain-language panel at the top of the dashboard for a non-deal-team audience (leadership) —
   merges overdue dates + decisions-needed into an urgent tier, and upcoming/stalled into a
   lighter "coming up" tier below it, rather than the small icon chips + separate card used before. */
function needsAttentionCardHtml(overdue, decisionEntries, upcoming, stalled){
  const flaggedEntries = [...deals.entries()].filter(([id,d])=> d.icFlagged && (d.stage||"prospecting")!=="dead");
  const urgentCount = overdue.length + decisionEntries.length + flaggedEntries.length;
  const urgentRows = [
    ...overdue.map(e=>{
      const meta = EVENT_TYPE_META[e.type]||{label:e.type};
      const amt = e.amount ? ` · ${fmtMoneyShort(e.amount)}` : "";
      return {dealId:e.dealId, cls:"attn-row-bad", name:e.name, text:`${meta.label} — ${Math.abs(e.days)}d overdue${amt}`};
    }),
    ...decisionEntries.map(([id,d])=> ({dealId:id, cls:"attn-row-bad", name:d.name||d.address||"Untitled deal", text:`Decision needed: ${d.decisionRequired}`})),
    ...flaggedEntries.map(([id,d])=> ({dealId:id, cls:"attn-row-flag", name:d.name||d.address||"Untitled deal", text:`🚩 Flagged for IC discussion${d.icFlagNote ? " — "+d.icFlagNote : ""}`})),
  ];
  const laterRows = [
    ...upcoming.map(e=>{
      const meta = EVENT_TYPE_META[e.type]||{label:e.type};
      const amt = e.amount ? ` · ${fmtMoneyShort(e.amount)}` : "";
      const dueText = e.days===0 ? "today" : `in ${e.days}d`;
      return {dealId:e.dealId, cls:"attn-row-warn", name:e.name, text:`${meta.label} — due ${dueText}${amt}`};
    }),
    ...stalled.map(s=> ({dealId:s.dealId, cls:"attn-row-neutral", name:s.name, text:`No update in ${s.days} days`})),
  ];
  const rowHtml = r => `<button type="button" class="attn-row ${r.cls}" data-deal="${escapeAttr(r.dealId)}">
      <span class="attn-row-name">${escapeHtml(r.name)}</span>
      <span class="attn-row-text">${escapeHtml(r.text)}</span>
    </button>`;
  return `<div class="dash-card needs-attn-card" id="needsAttentionCard" style="margin-bottom:16px;">
    <h4 class="section-label">Needs your attention${urgentCount?` <span class="count-badge">${urgentCount}</span>`:""}</h4>
    ${urgentRows.length ? `<div class="attn-list">${urgentRows.map(rowHtml).join("")}</div>` : `<div class="attn-clear">✓ Nothing overdue and no decisions pending right now.</div>`}
    ${laterRows.length ? `<div class="attn-subhead">Coming up</div><div class="attn-list attn-list-secondary">${laterRows.map(rowHtml).join("")}</div>` : ""}
  </div>`;
}

/* =================== dashboard: hero KPI (Closed deals + pipeline funnel) =================== */
/* The one number meant to be read from across the room in the weekly IC meeting — closed
   acquisitions in the selected window, since that's what the desk is actually judged on, not
   dollar volume. The goal, the big number, and the funnel below it all lead with deal count;
   dollar figures stick around only as smaller supporting context. */
const HERO_PERIOD_QUICK_PICKS = [
  {key:"ytd", label:"YTD"},
  {key:"t12", label:"Trailing 12 mo"},
  {key:"all", label:"All time"},
];
function heroPeriodSentence(){
  return heroPeriodStart ? `since ${fmtDate(heroPeriodStart)}` : "all time";
}
function heroPeriodShort(){
  return heroPeriodStart ? fmtDate(heroPeriodStart) : "all time";
}
function heroKpiCardHtml(closedCapitalPeriod, closedCountPeriod, funnelStages){
  const goalCount = dashboardGoal.amount||0;
  const pct = goalCount>0 ? Math.min(100, Math.round(closedCountPeriod/goalCount*100)) : 0;
  const goalLine = goalCount
    ? `${pct}% of ${goalCount} closing${goalCount===1?"":"s"} goal · ${fmtMoneyShort(closedCapitalPeriod)} in closed volume (${heroPeriodSentence()})`
    : `${fmtMoneyShort(closedCapitalPeriod)} in closed volume (${heroPeriodSentence()}) · no goal set yet`;
  const maxCount = Math.max(1, ...funnelStages.map(s=>s.count));
  return `<div class="hero-kpi-card">
    <div class="hero-kpi-top">
      <div>
        <div class="hero-kpi-label">Closed deals${dashboardGoal.label ? ` · ${escapeHtml(dashboardGoal.label)}` : ""}</div>
        <div class="hero-kpi-value">${closedCountPeriod}</div>
        <div class="hero-kpi-goal">${goalLine}</div>
      </div>
      <div class="hero-kpi-controls">
        <div class="hero-timeframe-toggle" id="heroTimeframeToggle">
          ${HERO_PERIOD_QUICK_PICKS.map(p=>
            `<button type="button" class="hero-timeframe-btn${heroPeriodStart===heroPeriodStartFor(p.key)?" active":""}" data-preset="${p.key}">${escapeHtml(p.label)}</button>`
          ).join("")}
        </div>
        <div class="hero-period-custom">
          <label for="heroPeriodStartInput" class="hero-period-custom-label">Since</label>
          <input type="date" id="heroPeriodStartInput" value="${heroPeriodStart||""}" max="${new Date().toISOString().slice(0,10)}">
        </div>
        <button type="button" class="hero-kpi-edit" id="heroKpiEditBtn">🎯 Edit goal</button>
      </div>
    </div>
    ${goalCount ? `<div class="hero-kpi-track"><div class="hero-kpi-fill" style="width:${pct}%"></div></div>` : ""}
    <div class="funnel-wrap">
      ${funnelStages.map(s=>{
        const w = s.count>0 ? Math.max(16, Math.round(s.count/maxCount*100)) : 6;
        const label = s.periodOnly ? `${s.label} (${heroPeriodShort()})` : s.label;
        return `<div class="funnel-row">
          <div class="funnel-track"><div class="funnel-fill funnel-fill-${s.color}" style="width:${w}%">
            <span class="funnel-fill-main">${escapeHtml(label)} · ${s.count}</span>
            <span class="funnel-fill-sub">${fmtMoneyShort(s.capital)}</span>
          </div></div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}
function openGoalEditModal(){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="overlay" id="goalEditOverlay">
    <div class="modal" style="width:min(360px,94vw);">
      <div class="modal-head"><h2>Edit closed deals goal</h2></div>
      <div class="modal-body">
        <div class="field"><label for="goalAmountInput">Target # of closings</label><input type="number" id="goalAmountInput" value="${dashboardGoal.amount||0}" min="0" step="1"></div>
        <div class="field" style="margin-top:10px;"><label for="goalLabelInput">Timeframe label</label><input type="text" id="goalLabelInput" value="${escapeAttr(dashboardGoal.label||"")}" placeholder="e.g. by 2026 EOY"></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-primary" id="goalSaveBtn">Save</button>
        <button class="btn btn-ghost" id="goalCancelBtn" style="margin-left:auto;">Cancel</button>
      </div>
    </div>
  </div>`;
  const close = ()=>{ root.innerHTML=""; };
  document.getElementById("goalEditOverlay").addEventListener("click", e=>{ if(e.target.id==="goalEditOverlay") close(); });
  document.getElementById("goalCancelBtn").addEventListener("click", close);
  document.getElementById("goalSaveBtn").addEventListener("click", ()=>{
    const amount = Math.max(0, Math.round(Number(document.getElementById("goalAmountInput").value)||0));
    const label = document.getElementById("goalLabelInput").value.trim();
    dashboardGoal = {amount, label};
    saveDashboardGoal();
    close();
    if(view==="dashboard") renderDashboard();
  });
}

/* =================== dashboard: prospects for review =================== */
/* Fresh prospects the team hasn't moved past the top of the funnel yet — the list an IC meeting
   works through week to week, separate from "Needs your attention" (which is about things already
   in motion running late) and the basics table (which only covers deals under contract). */
function prospectsForReviewCardHtml(dealEntries){
  const rows = dealEntries.slice().sort((a,b)=>{
    const pr = dealPriorityCompare(a[1], b[1]);
    return pr!==0 ? pr : (b[1].createdAt||"").localeCompare(a[1].createdAt||"");
  });
  if(!rows.length){
    return `<div class="dash-card prospects-card" style="margin-bottom:16px;">
      <h4 class="section-label">Prospects for review</h4>
      <div class="empty-hint">No new prospects waiting on a screening decision.</div>
    </div>`;
  }
  const rowHtml = ([id,d])=>{
    const recMeta = REC_META[d.recommendation];
    const days = d.createdAt ? Math.max(0, Math.floor((Date.now()-new Date(d.createdAt).getTime())/86400000)) : null;
    const bits = [d.source ? escapeHtml(d.source) : "", days!==null ? `${days}d in pipeline` : ""].filter(Boolean).join(" · ");
    const priority = dealPriority(d);
    const priorityCls = priority==="high" ? "attn-row-priority-high" : priority==="medium" ? "attn-row-priority-medium" : "attn-row-neutral";
    return `<button type="button" class="attn-row ${priorityCls}" data-deal="${escapeAttr(id)}">
      <span class="attn-row-name">${escapeHtml(d.name||d.address||"Untitled deal")}</span>
      <span class="attn-row-text"><span class="pill ${PRIORITY_META[priority].cls}">${PRIORITY_META[priority].label}</span> ${icScoreBadgeHtml(d)} ${recMeta ? `<span class="pill pill-solid ${recMeta.cls}">${recMeta.label}</span>` : `<span class="pill pill-neutral">Not screened</span>`} ${bits}</span>
    </button>`;
  };
  return `<div class="dash-card prospects-card" style="margin-bottom:16px;">
    <h4 class="section-label">Prospects for review <span class="count-badge count-badge-neutral">${rows.length}</span></h4>
    <div class="attn-list">${rows.map(rowHtml).join("")}</div>
  </div>`;
}

/* =================== dashboard: financing gaps =================== */
/* Surfaces where debt/equity still needs to be lined up on in-contract deals, and exactly which
   projects each gap belongs to — separate from the "Debt"/"Equity required" KPI totals above,
   which are the full forward-looking need, not what's still open. */
function financingGapsCardHtml(dealEntries){
  const rows = dealEntries.map(([id,d])=>{
    const debt = debtDealTotals(d);
    const equity = equityDealTotals(d);
    return {id, d, debtGap: Math.max(debt.gap||0,0), equityGap: Math.max(equity.gap||0,0)};
  }).filter(r=> (r.debtGap+r.equityGap) > 0).sort((a,b)=> (b.debtGap+b.equityGap)-(a.debtGap+a.equityGap));
  const totalDebtGap = rows.reduce((s,r)=>s+r.debtGap,0);
  const totalEquityGap = rows.reduce((s,r)=>s+r.equityGap,0);
  if(!rows.length){
    return `<div class="dash-card financing-gap-card" style="margin-bottom:16px;">
      <h4 class="section-label">Financing gaps</h4>
      <div class="attn-clear">✓ No open debt or equity gaps on in-contract deals.</div>
    </div>`;
  }
  const rowHtml = r => `<button type="button" class="attn-row attn-row-flag" data-deal="${escapeAttr(r.id)}">
      <span class="attn-row-name">${escapeHtml(r.d.name||r.d.address||"Untitled deal")}</span>
      <span class="attn-row-text">${[r.debtGap>0?`Debt gap ${fmtMoneyShort(r.debtGap)}`:"", r.equityGap>0?`Equity gap ${fmtMoneyShort(r.equityGap)}`:""].filter(Boolean).join(" · ")}</span>
    </button>`;
  return `<div class="dash-card financing-gap-card" style="margin-bottom:16px;">
    <h4 class="section-label">Financing gaps <span class="count-badge">${fmtMoneyShort(totalDebtGap+totalEquityGap)}</span></h4>
    <div class="financing-gap-sub">${totalDebtGap>0?`Debt: ${fmtMoneyShort(totalDebtGap)}`:""}${(totalDebtGap>0&&totalEquityGap>0)?" · ":""}${totalEquityGap>0?`Equity: ${fmtMoneyShort(totalEquityGap)}`:""} still open across ${rows.length} deal${rows.length===1?"":"s"}</div>
    <div class="attn-list">${rows.map(rowHtml).join("")}</div>
  </div>`;
}

  const applicable = d.ddApplicable ?? DD_TOTAL;

  const ddPct = applicable>0 ? Math.round((complete/applicable)*100) : 0;

/* =================== dashboard =================== */
function renderDashboard(){
  const wrap = document.getElementById("dashboardWrap");
  if(!wrap) return;
  const all = [...deals.values()];
  const filtered = all.filter(dealPassesFilters);
  const active = filtered.filter(d=> (d.stage||"prospecting")!=="dead");

  dashboardDealsFiltered = new Map([...deals.entries()].filter(([id,d])=>dealPassesFilters(d)));
  const activeEntries = [...deals.entries()].filter(([id,d])=>dealPassesFilters(d) && (d.stage||"prospecting")!=="dead");
  const decisionEntries = activeEntries.filter(([id,d])=>(d.decisionRequired||"").trim());

  /* Debt / equity are forward capital commitments, not pipeline-wide speculation or already-
     deployed capital — real only once a deal is under a signed purchase agreement, and no longer
     "needed" once it's onboarded/closed (that capital's already been put to work). Onboarded
     deals are tracked as a progress signal elsewhere (Avg days to close, the closed-deals trend,
     the Onboarded row in By stage) rather than folded into a forward-looking funding number. */
  const IN_CONTRACT_STAGES = new Set(["signed_psa_dd"]);
  const inContractDeals = active.filter(d=> IN_CONTRACT_STAGES.has(d.stage||"prospecting"));
  const inContractEntries = activeEntries.filter(([id,d])=> IN_CONTRACT_STAGES.has(d.stage||"prospecting"));
  let totalDebt=0, totalEquity=0, inContractPricedCount=0;
  inContractDeals.forEach(d=>{
    const cap = calcCapitalStack(d);
    if(cap){ totalDebt+=cap.debtAmount; totalEquity+=cap.equityAmount; inContractPricedCount++; }
  });
  /* "Purchase price" used to sum every non-dead deal from a fresh prospect through a closed
     project, which made the number impossible to read at a glance. Scoped the same way as
     Debt/Equity above — signed PSA — so it means one clear thing: what we're actually under
     contract to pay right now. */
  const totalPrice = inContractDeals.reduce((s,d)=> s+(Number(d.purchasePrice)||0), 0);
  /* "Total capital needed" adds one thing on top of in-contract: an LOI-stage deal that already
     has a firm deposit date on the calendar isn't speculative the way an early prospect is, so
     its capital need belongs in the forward-looking total too. An LOI deal still shopping around
     with no deposit date set stays out. */
  const LOI_STAGES = new Set(["submitted_loi","signed_loi"]);
  const hasFirmDepositDate = d => !!(
    (d.deposit1Date && d.deposit1Amount) ||
    (d.deposit2Date && d.deposit2Amount) ||
    (Array.isArray(d.extraDeposits) && d.extraDeposits.some(dep=>dep.date && dep.amount))
  );
  const capitalNeedDeals = active.filter(d=>{
    const stage = d.stage||"prospecting";
    if(IN_CONTRACT_STAGES.has(stage)) return true;
    if(LOI_STAGES.has(stage) && hasFirmDepositDate(d)) return true;
    return false;
  });
  let totalCapital=0;
  capitalNeedDeals.forEach(d=>{
    const cap = calcCapitalStack(d);
    if(cap) totalCapital += cap.basis;
  });
  /* Headline stat — closed capital is what the desk is actually judged on, not merely what's
     under contract, so the hero number tracks closings in the selected timeframe against an
     editable annual goal. The funnel underneath it shows the live pipeline behind that number:
     everything currently sitting at each earlier stage, next to how many have made it all the
     way to Closed in that same window. */
  const closedInPeriod = active.filter(d=> (d.stage||"prospecting")==="onboarded" && inHeroTimeframe(d.actualCloseDate));
  const closedCapitalPeriod = closedInPeriod.reduce((s,d)=> s+(Number(d.purchasePrice)||0), 0);
  const funnelProspecting = active.filter(d=> (d.stage||"prospecting")==="prospecting");
  const funnelLoi = active.filter(d=> LOI_STAGES.has(d.stage||"prospecting"));
  const funnelStages = [
    {key:"prospecting", label:"Prospecting", color:"stage1", count:funnelProspecting.length, capital: funnelProspecting.reduce((s,d)=>s+(Number(d.purchasePrice)||0),0)},
    {key:"loi", label:"LOI", color:"stage2", count:funnelLoi.length, capital: funnelLoi.reduce((s,d)=>s+(Number(d.purchasePrice)||0),0)},
    {key:"psa", label:"Signed PSA/DD", color:"stage3", count:inContractDeals.length, capital: inContractDeals.reduce((s,d)=>s+(Number(d.purchasePrice)||0),0)},
    {key:"closed", label:"Closed", color:"closed", count:closedInPeriod.length, capital: closedCapitalPeriod, periodOnly:true},
  ];
  const prospectingEntries = activeEntries.filter(([id,d])=> (d.stage||"prospecting")==="prospecting");
  const targetCount = active.filter(d=>d.meetsTargetCriteria).length;
  const stageCounts = DEAL_STAGES.map(s=>{
    const stageDeals = filtered.filter(d=>(d.stage||"prospecting")===s.key);
    const capital = stageDeals.reduce((sum,d)=>{ const cap=calcCapitalStack(d); return sum+(cap?cap.basis:(Number(d.purchasePrice)||0)); }, 0);
    const ages = stageDeals.map(d=>{
      const ref = d.updatedAt || d.createdAt;
      if(!ref) return null;
      const t = new Date(ref).getTime();
      return isNaN(t) ? null : Math.floor((Date.now()-t)/86400000);
    }).filter(n=>n!==null);
    const avgAge = ages.length ? Math.round(ages.reduce((a,b)=>a+b,0)/ages.length) : null;
    return {...s, count: stageDeals.length, capital, avgAge};
  });
  const closeDurations = active.filter(d=>d.actualCloseDate && d.createdAt).map(d=>{
    const days = Math.round((new Date(d.actualCloseDate+"T00:00:00") - new Date(d.createdAt)) / 86400000);
    return days;
  }).filter(n=>!isNaN(n) && n>=0);
  const avgDaysToClose = closeDurations.length ? Math.round(closeDurations.reduce((a,b)=>a+b,0)/closeDurations.length) : null;

  /* Each state/market bucket now also carries a `deals` list (id + the handful of fields the
     pipeline map's drill-down popup shows per deal) alongside the existing capital/count rollup
     and `names` (kept for anything else that still reads it). Built from activeEntries rather than
     `active` specifically so each deal keeps its id — the popup needs it to open the real deal
     detail slideover when a card is clicked. */
  const dealPopupSummary = (id, d) => {
    const stageMeta = DEAL_STAGES.find(s=>s.key===(d.stage||"prospecting")) || DEAL_STAGES[0];
    return {
      id, name: d.name||d.address||"Untitled deal",
      stageTitle: stageMeta.title, stageColor: stageMeta.color,
      price: d.purchasePrice ? fmtMoneyShort(d.purchasePrice) : "—",
      lead: d.lead || "Unassigned",
    };
  };
  const byState = new Map();
  activeEntries.forEach(([id,d])=>{
    const code = dealStateCode(d);
    if(!code) return;
    if(!byState.has(code)) byState.set(code, {count:0, capital:0, names:[], deals:[]});
    const s = byState.get(code);
    s.count++;
    const cap = calcCapitalStack(d);
    s.capital += cap ? cap.basis : (Number(d.purchasePrice)||0);
    s.names.push(d.name||d.address||"Untitled deal");
    s.deals.push(dealPopupSummary(id, d));
  });
  const unmapped = active.filter(d=>!dealStateCode(d));

  const byMarket = new Map();
  activeEntries.forEach(([id,d])=>{
    const key = dealMarketKey(d);
    const coords = key ? marketCoords(key) : null;
    if(!key || !coords) return;
    if(!byMarket.has(key)) byMarket.set(key, {count:0, capital:0, names:[], deals:[], lat:coords.lat, lon:coords.lon});
    const s = byMarket.get(key);
    s.count++;
    const cap = calcCapitalStack(d);
    s.capital += cap ? cap.basis : (Number(d.purchasePrice)||0);
    s.names.push(d.name||d.address||"Untitled deal");
    s.deals.push(dealPopupSummary(id, d));
  });
  const unmappedMarket = active.filter(d=>{
    const key = dealMarketKey(d);
    return !key || !marketCoords(key);
  });

  const sourceColors = ["accent","brass","good","warn","neutral","bad","accent","brass"];
  const sourceCounts = SOURCE_OPTIONS.map((s,i)=>({title:s, color:sourceColors[i%sourceColors.length], count: filtered.filter(d=>(d.source||"")===s).length}))
    .concat([{title:"Not set", color:"neutral", count: filtered.filter(d=>!d.source).length}])
    .filter(s=>s.count>0);
  const sourceMax = filtered.length || 1;

  const capNeedBuckets = bucketCapitalNeed(getCapitalNeedItems(dashboardDealsFiltered));

  const months = last6MonthKeys();
  const newByMonth = {}, closedByMonth = {};
  months.forEach(m=>{ newByMonth[m]=0; closedByMonth[m]=0; });
  filtered.forEach(d=>{
    const nk = (d.createdAt||"").slice(0,7);
    if(nk && nk in newByMonth) newByMonth[nk]++;
    const ck = (d.actualCloseDate||"").slice(0,7);
    if(ck && ck in closedByMonth) closedByMonth[ck]++;
  });
  const trendMax = Math.max(1, ...months.map(m=>Math.max(newByMonth[m], closedByMonth[m])));
  const totalNew6mo = months.reduce((s,m)=>s+newByMonth[m],0);
  const totalClosed6mo = months.reduce((s,m)=>s+closedByMonth[m],0);

  const productLines = [...new Set(all.map(d=>d.productLine).filter(Boolean))].sort();
  const leads = [...new Set(all.map(d=>d.lead).filter(Boolean))].sort();
  const filtersActive = anyDashboardFilterActive();
  const {overdue, upcoming, stalled} = getUrgentAlerts(deals);

  wrap.innerHTML = `
    ${heroKpiCardHtml(closedCapitalPeriod, closedInPeriod.length, funnelStages)}
    <div class="dash-filter-bar">
      <select id="filterStage"><option value="">All stages</option>${DEAL_STAGES.map(s=>`<option value="${s.key}">${s.title}</option>`).join("")}</select>
      <select id="filterProductLine"><option value="">All product lines</option>${productLines.map(p=>`<option value="${escapeAttr(p)}">${escapeHtml(p)}</option>`).join("")}</select>
      <select id="filterSource"><option value="">All sources</option>${SOURCE_OPTIONS.map(s=>`<option value="${s}">${s}</option>`).join("")}</select>
      <select id="filterPropType"><option value="">All property types</option>${propertyTypeOptions.map(s=>`<option value="${s}">${s}</option>`).join("")}</select>
      <select id="filterLead"><option value="">All deal leads</option>${leads.map(l=>`<option value="${escapeAttr(l)}">${escapeHtml(l)}</option>`).join("")}</select>
      <select id="filterState"><option value="">All states</option>${STATE_OPTIONS}</select>
      <select id="filterRecommendation"><option value="">All recommendations</option><option value="pursue">Pursue</option><option value="watch">Watch</option><option value="pass">Pass</option></select>
      <select id="filterMarketTier"><option value="">All market tiers</option><option value="1">Tier 1</option><option value="2">Tier 2</option><option value="3">Tier 3</option></select>
      <select id="filterIcDecision"><option value="">All IC decisions</option><option value="none">Not decided</option>${Object.entries(IC_DECISION_META).filter(([k])=>k).map(([k,m])=>`<option value="${k}">${m.label}</option>`).join("")}</select>
      <select id="filterModelStatus"><option value="">All model stages</option><option value="boe">Back-of-envelope only</option><option value="full">Full model built out</option></select>
      <select id="filterZoningStatus"><option value="">Zoning — any</option><option value="done">Zoning identified</option><option value="missing">Zoning missing</option></select>
      <select id="filterDemoStatus"><option value="">Demographics — any</option><option value="done">Demographics pulled</option><option value="missing">Demographics missing</option></select>
      <select id="filterOpenQuestions"><option value="">Open questions — any</option><option value="yes">Has open questions</option><option value="no">No open questions</option></select>
      ${filtersActive ? `<button type="button" class="btn-icon" id="filterClearBtn">✕ Clear filters</button>` : ""}
      ${filtersActive ? `<span class="filter-note">Showing ${filtered.length} of ${all.length} deals</span>` : ""}
      <button type="button" class="btn-icon" id="onePagerBtn" style="margin-left:auto;">🖨 One-pager</button>
    </div>
    <div class="dash-grid">
      <div class="dash-card">

          ${stageCounts.map(s=>`

/* =================== weekly agenda tab =================== */
/* A live walkthrough for the Harvey/Jay weekly review — same underlying data as the dashboard's
   own cards (reused directly wherever possible so the two views can't drift apart), sequenced as
   an actual meeting agenda: urgent items that need a decision today, then prospects, then the
   rest of the funnel in order, ending with a quick "what moved since we last met" recap. Numbered
   top to bottom per Brendan's ask — urgent first, prospects review second. */
function agendaInMotionCardHtml(entries, asOfIso){
  const rows = entries.slice().sort((a,b)=>{
    const at = a[1].updatedAt||a[1].createdAt||"", bt = b[1].updatedAt||b[1].createdAt||"";
    return at<bt ? -1 : at>bt ? 1 : 0; // oldest-touched first, so anything going quiet surfaces first
  });
  if(!rows.length) return `<div class="empty-hint" style="margin-left:36px;">Nothing in underwriting or LOI right now.</div>`;
  const refTime = asOfIso ? new Date(asOfIso+"T23:59:59").getTime() : Date.now();
  return `<div style="margin-left:36px;display:flex;flex-direction:column;gap:2px;">
    ${rows.map(([id,d])=>{
      const stage = DEAL_STAGES.find(s=>s.key===(d.stage||"prospecting")) || DEAL_STAGES[0];
      const note = (d.decisionRequired||d.nextStep||"").trim();
      const ref = d.updatedAt||d.createdAt;
      const days = ref ? Math.floor((refTime-new Date(ref).getTime())/86400000) : null;
      const priority = dealPriority(d);
      const priorityRowCls = priority==="high" ? " agenda-inmotion-row-priority-high" : priority==="medium" ? " agenda-inmotion-row-priority-medium" : "";
      return `<button type="button" class="agenda-inmotion-row${priorityRowCls}" data-deal="${escapeAttr(id)}">
        <span class="agenda-inmotion-name">${escapeHtml(d.name||d.address||"Untitled deal")} <span class="pill ${PRIORITY_META[priority].cls}" style="margin-left:2px;">${PRIORITY_META[priority].label}</span></span>
        <span class="pill pill-solid pill-${stage.color}">${escapeHtml(stage.title)}</span>
        <span class="agenda-inmotion-note">${note ? escapeHtml(note) : "—"}</span>
        <span class="agenda-inmotion-meta">${days!==null ? `${days}d since update${days>=21?" ⚠":""}` : ""}</span>
      </button>`;
    }).join("")}
  </div>`;
}
function agendaSinceLastMeetingHtml(closedRecent, newProspectsRecent){
  const closedHtml = closedRecent.length
    ? `<div class="agenda-recap-list">${closedRecent.map(([id,d])=>`<button type="button" class="agenda-recap-row" data-deal="${escapeAttr(id)}"><span class="agenda-recap-name">${escapeHtml(d.name||d.address||"Untitled deal")}</span><span class="agenda-recap-meta">${fmtDate(d.actualCloseDate)} · ${fmtMoneyShort(d.purchasePrice)}</span></button>`).join("")}</div>`
    : `<div class="empty-hint">No closings in this window.</div>`;
  const newHtml = newProspectsRecent.length
    ? `<div class="agenda-recap-list">${newProspectsRecent.map(([id,d])=>`<button type="button" class="agenda-recap-row" data-deal="${escapeAttr(id)}"><span class="agenda-recap-name">${escapeHtml(d.name||d.address||"Untitled deal")}</span><span class="agenda-recap-meta">${d.createdAt?fmtDate(d.createdAt.slice(0,10)):""}</span></button>`).join("")}</div>`
    : `<div class="empty-hint">No new prospects added in this window.</div>`;
  return `<div class="agenda-recap-cols">
    <div><div class="section-label" style="margin-bottom:6px;">Closed (${closedRecent.length})</div>${closedHtml}</div>
    <div><div class="section-label" style="margin-bottom:6px;">New prospects (${newProspectsRecent.length})</div>${newHtml}</div>
  </div>`;
}
function setAgendaMeetingDate(v){
  agendaMeetingDate = v || null;
  if(view==="agenda") renderAgendaView();
}
/* Print / save-as-PDF for the Weekly Agenda — same overlay + @media print pattern as the IC
   memo (see #icMemoOverlay above): clone whatever's currently on screen in #agendaWrap (so the
   PDF matches the meeting date already selected), swap the interactive date-picker bar for a
   plain text line, and let the browser's own print-to-PDF do the rest — no PDF library needed. */
function openAgendaPrintModal(){
  const wrap = document.getElementById("agendaWrap");
  if(!wrap) return;
  const meetingDate = agendaMeetingDate || new Date().toISOString().slice(0,10);
  const existing = document.getElementById("agendaPrintOverlay");
  if(existing) existing.remove();
  const introText = wrap.querySelector(".agenda-intro-date") ? wrap.querySelector(".agenda-intro-date").textContent : "";
  const contentClone = wrap.cloneNode(true);
  contentClone.removeAttribute("id");
  const introBar = contentClone.querySelector(".agenda-intro");
  if(introBar) introBar.remove(); // the print masthead below already carries the title + date
  const dateBar = contentClone.querySelector(".agenda-meeting-date");
  if(dateBar) dateBar.outerHTML = `<div class="agenda-meeting-date-print">Meeting date: ${escapeHtml(fmtDate(meetingDate))}</div>`;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "agendaPrintOverlay";
  overlay.innerHTML = `
    <div class="modal ic-memo-modal">
      <div class="modal-head no-print">
        <h2>🖨 Print agenda</h2>
        <div style="margin-left:auto;display:flex;gap:8px;">
          <button type="button" class="btn-icon" id="agendaPrintBtn">🖨 Print / Save as PDF</button>
          <button type="button" class="btn-icon" id="agendaPrintCloseBtn">✕ Close</button>
        </div>
      </div>
      <div class="ic-memo-body" id="agendaPrintArea">
        <div class="ic-memo-masthead">
          <div class="ic-memo-brand">Newgard Group · Weekly Acquisitions Review</div>
          <div class="ic-memo-date">Meeting date ${fmtDate(meetingDate)} · Prepared ${fmtDate(new Date().toISOString().slice(0,10))}${introText ? " · "+escapeHtml(introText) : ""}</div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("agendaPrintArea").appendChild(contentClone);
  overlay.addEventListener("click", e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById("agendaPrintCloseBtn").addEventListener("click", ()=> overlay.remove());
  document.getElementById("agendaPrintBtn").addEventListener("click", ()=> openPrintableWindow(overlay, "deal-desk-weekly-agenda-"+new Date().toISOString().slice(0,10)));
}
function renderAgendaView(){
  const wrap = document.getElementById("agendaWrap");
  if(!wrap) return;
  const meetingDate = agendaMeetingDate || new Date().toISOString().slice(0,10);
  const isToday = !agendaMeetingDate;
  const activeEntries = [...deals.entries()].filter(([id,d])=> (d.stage||"prospecting")!=="dead");
  const decisionEntries = activeEntries.filter(([id,d])=>(d.decisionRequired||"").trim());
  const {overdue, upcoming, stalled} = getUrgentAlerts(deals, meetingDate);
  const upcoming7 = upcoming.filter(e=>e.days<=7);
  const flaggedCount = activeEntries.filter(([id,d])=> d.icFlagged).length;
  const urgentTotal = overdue.length + decisionEntries.length + flaggedCount + upcoming7.length;

  const prospectingEntries = activeEntries.filter(([id,d])=> (d.stage||"prospecting")==="prospecting");
  const IN_MOTION_STAGES = new Set(["underwriting","submitted_loi","signed_loi"]);
  const inMotionEntries = activeEntries.filter(([id,d])=> IN_MOTION_STAGES.has(d.stage||"prospecting"));
  const IN_CONTRACT_STAGES = new Set(["signed_psa_dd"]);
  const inContractEntries = activeEntries.filter(([id,d])=> IN_CONTRACT_STAGES.has(d.stage||"prospecting"));
  const capNeedBuckets = bucketCapitalNeed(getCapitalNeedItems(deals), meetingDate);

  const weekAgo = addDaysIso(meetingDate, -7);
  const closedThisWeek = [...deals.entries()]
    .filter(([id,d])=>{ const days = d.actualCloseDate ? daysUntil(d.actualCloseDate, meetingDate) : null; return days!==null && days>=-7 && days<=0; })
    .sort((a,b)=> (b[1].actualCloseDate||"").localeCompare(a[1].actualCloseDate||""));
  const newProspectsThisWeek = [...deals.entries()].filter(([id,d])=>{
    if(!d.createdAt) return false;
    const days = daysUntil(d.createdAt.slice(0,10), meetingDate);
    return days!==null && days>=-7 && days<=0;
  }).sort((a,b)=> (b[1].createdAt||"").localeCompare(a[1].createdAt||""));

  const sectionData = {
    urgent: {
      title: "Urgent this week",
      sub: `Overdue dates, decisions needed, IC flags, and anything due in the 7 days after ${fmtDate(meetingDate)}.`,
      count: null,
      body: needsAttentionCardHtml(overdue, decisionEntries, upcoming7, stalled),
    },
    prospects: {
      title: "Prospects for review",
      sub: "Everything still at prospecting stage — go / watch / pass.",
      count: prospectingEntries.length,
      body: prospectsForReviewCardHtml(prospectingEntries),
    },
    inmotion: {
      title: "Deals in motion",
      sub: "Underwriting and LOI-stage deals — status and open decisions.",
      count: inMotionEntries.length,
      body: agendaInMotionCardHtml(inMotionEntries, meetingDate),
    },
    undercontract: {
      title: "Under contract — status check",
      sub: "Signed PSA/DD — dates, DD progress, and financing gaps.",
      count: inContractEntries.length,
      body: basicsTableCardHtml(inContractEntries) + financingGapsCardHtml(inContractEntries),
    },
    capital: {
      title: "Capital needed",
      sub: `Cash the desk needs to fund, by when — deposits and closing balances, counted forward from ${fmtDate(meetingDate)}.`,
      count: null,
      body: `<div style="margin-left:36px;">${capitalNeedCardHtml(capNeedBuckets)}</div>`,
    },
    recap: {
      title: "Since we last met",
      sub: `What's changed between ${fmtDate(weekAgo)} and ${fmtDate(meetingDate)}.`,
      count: null,
      body: agendaSinceLastMeetingHtml(closedThisWeek, newProspectsThisWeek),
    },
    comments: {
      title: "Special comments",
      sub: "Anything else for discussion that isn't captured in the sections above.",
      count: agendaItems.size || null,
      body: agendaCommentsCardHtml(),
    },
  };
  const order = getAgendaSectionOrder();
  const sectionsHtml = order.map((key, idx)=>{
    const s = sectionData[key];
    if(!s) return "";
    const isFirst = idx===0, isLast = idx===order.length-1;
    return `${idx>0 ? pageDividerLineHtml() : ""}
    <div class="agenda-step"${key==="recap"||key==="comments"?' style="margin-bottom:8px;"':""}>
      <div class="agenda-step-head">
        <span class="agenda-step-num">${idx+1}</span><span class="agenda-step-title">${escapeHtml(s.title)}</span>
        ${s.count!=null ? `<span class="agenda-step-count">${s.count}</span>` : ""}
        <span class="agenda-reorder no-print">
          <button type="button" class="agenda-reorder-btn" data-move="up" data-key="${key}"${isFirst?" disabled":""} title="Move section up">▲</button>
          <button type="button" class="agenda-reorder-btn" data-move="down" data-key="${key}"${isLast?" disabled":""} title="Move section down">▼</button>
        </span>
      </div>
      <div class="agenda-step-sub">${s.sub}</div>
      ${s.body}
    </div>`;
  }).join("");

  wrap.innerHTML = `
    <div class="agenda-intro">
      <div><span class="agenda-step-title">Weekly Acquisitions Review</span></div>

/* Section display order for the Weekly Agenda — persisted per-browser (like pipelineDensity /
   calendarRangeMonths) since it's a personal layout preference, not shared deal data. Filters out
   stale keys and appends any new section this build adds, so an old saved order never hides a
   section that didn't exist when it was saved. */
const AGENDA_SECTION_KEYS = ["urgent","prospects","inmotion","undercontract","capital","recap","comments"];
function getAgendaSectionOrder(){
  let saved = [];
  try{ saved = JSON.parse(localStorage.getItem("dealdesk_agenda_order")||"[]"); }catch(e){ saved = []; }
  const filtered = Array.isArray(saved) ? saved.filter(k=>AGENDA_SECTION_KEYS.includes(k)) : [];
  AGENDA_SECTION_KEYS.forEach(k=>{ if(!filtered.includes(k)) filtered.push(k); });
  return filtered;
}
function saveAgendaSectionOrder(order){
  try{ localStorage.setItem("dealdesk_agenda_order", JSON.stringify(order)); }catch(e){}
}
function moveAgendaSection(key, dir){
  const order = getAgendaSectionOrder();
  const idx = order.indexOf(key);
  if(idx<0) return;
  const swapIdx = idx+dir;
  if(swapIdx<0 || swapIdx>=order.length) return;
  const tmp = order[idx]; order[idx] = order[swapIdx]; order[swapIdx] = tmp;
  saveAgendaSectionOrder(order);
  renderAgendaView();
}

function last6MonthKeys(){
  const out=[];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const dt = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push(`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`);
  }
