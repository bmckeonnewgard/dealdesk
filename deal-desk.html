  const committed = sources
    .filter(s=> s.status==="committed" || s.status==="funded")
    .reduce((sum,s)=> sum+(Number(s.committedAmount)||0), 0);
  return {needed, committed, gap: Math.max(0, needed-committed)};
}
function equitySourceRowHtml(dealId, source, idx){
  const status = source.status || "";
  return `<div class="debt-source-row" data-deal="${escapeAttr(dealId)}" data-idx="${idx}">
    <input type="text" class="debt-source-type" placeholder="e.g. JV partner — Acme Capital" value="${escapeAttr(source.type||"")}">
    <select class="debt-source-status">
      ${EQUITY_STATUS_OPTIONS.map(k=>`<option value="${k}"${k===status?" selected":""}>${EQUITY_STATUS_META[k].label}</option>`).join("")}
    </select>
    <input type="text" class="debt-source-lender" placeholder="Investor" value="${escapeAttr(source.lenderName||"")}">
    <input type="number" class="debt-source-amount" placeholder="Amount" value="${source.committedAmount!=null?source.committedAmount:""}">
    <input type="date" class="debt-source-date" value="${escapeAttr(source.commitmentDate||"")}">
    <button type="button" class="btn-icon debt-source-remove" title="Remove equity source">✕</button>
  </div>`;
}
function equityDealCardHtml(id, d){
  const name = d.name || d.address || "Untitled deal";
  const sources = d.equitySources || [];
  const {needed, committed, gap} = equityDealTotals(d);
  return `<div class="debt-deal-card">
    <div class="debt-deal-head">
      <button type="button" class="debt-deal-name" data-deal="${escapeAttr(id)}">${escapeHtml(name)}</button>
      <span class="debt-deal-stat">Needed <b>${needed?fmtMoneyShort(needed):"—"}</b></span>
      <span class="debt-deal-stat">Committed <b>${fmtMoneyShort(committed)}</b></span>
      <span class="debt-deal-stat${gap>0?" debt-deal-stat-bad":""}">${gap>0?`Short <b>${fmtMoneyShort(gap)}</b>`:"<b>Covered</b>"}</span>
    </div>
    <div class="debt-source-list" data-deal="${escapeAttr(id)}">
      ${sources.length ? sources.map((s,i)=>equitySourceRowHtml(id,s,i)).join("") : `<div class="empty-hint" style="padding:6px 0;">No equity sources yet.</div>`}
    </div>
    <button type="button" class="btn-icon debt-add-source equity-add-source" data-deal="${escapeAttr(id)}">+ Add equity source</button>
  </div>`;
}
function wireEquityView(wrap){
  wrap.querySelectorAll(".debt-deal-name").forEach(btn=> btn.addEventListener("click", ()=> openDealDetail(btn.getAttribute("data-deal"))));
  wrap.querySelectorAll(".equity-add-source").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-deal");
      const d = deals.get(id); if(!d) return;
      const next = (d.equitySources||[]).concat([{type:"", status:"", lenderName:"", committedAmount:null, commitmentDate:""}]);
      d.equitySources = next;
      updateDeal(id, {equitySources: next});
      renderEquityView();
    });
  });
  wrap.querySelectorAll(".debt-source-row").forEach(row=>{
    const id = row.getAttribute("data-deal");
    const idx = Number(row.getAttribute("data-idx"));
    const d = deals.get(id); if(!d) return;
    const commit = patch=>{
      const next = (d.equitySources||[]).slice();
      next[idx] = Object.assign({}, next[idx], patch);
      d.equitySources = next;
      updateDeal(id, {equitySources: next});
    };
    const statusSel = row.querySelector(".debt-source-status");
    colorSelectByStatus(statusSel, (EQUITY_STATUS_META[statusSel.value]||EQUITY_STATUS_META[""]).cls);
    statusSel.addEventListener("change", ()=>{
      commit({status: statusSel.value});
      colorSelectByStatus(statusSel, (EQUITY_STATUS_META[statusSel.value]||EQUITY_STATUS_META[""]).cls);
      renderEquityView();
    });
    row.querySelector(".debt-source-type").addEventListener("change", e=> commit({type: e.target.value.trim()}));
    row.querySelector(".debt-source-lender").addEventListener("change", e=> commit({lenderName: e.target.value.trim()}));
    row.querySelector(".debt-source-amount").addEventListener("change", e=>{ commit({committedAmount: e.target.value===""?null:Number(e.target.value)}); renderEquityView(); });
    row.querySelector(".debt-source-date").addEventListener("change", e=> commit({commitmentDate: e.target.value}));
    row.querySelector(".debt-source-remove").addEventListener("click", ()=>{
      const next = (d.equitySources||[]).slice();
      next.splice(idx,1);
      d.equitySources = next;
      updateDeal(id, {equitySources: next});
      renderEquityView();
    });
  });
}
function renderEquityView(){
  const wrap = document.getElementById("equityWrap");
  if(!wrap) return;
  const all = [...deals.entries()];
  const preClose = all.filter(([id,d])=> (d.stage||"prospecting")==="signed_psa_dd");
  const closed = all.filter(([id,d])=> (d.stage||"prospecting")==="onboarded");
  preClose.sort((a,b)=> equityDealTotals(b[1]).gap - equityDealTotals(a[1]).gap);
  closed.sort((a,b)=> (b[1].actualCloseDate||"").localeCompare(a[1].actualCloseDate||""));

  let neededTotal=0, committedTotal=0;
  preClose.forEach(([id,d])=>{
    const t = equityDealTotals(d);
    neededTotal += t.needed; committedTotal += t.committed;
  });
  const gapTotal = Math.max(0, neededTotal-committedTotal);
  const noSourcesCount = preClose.filter(([id,d])=> !(d.equitySources && d.equitySources.length)).length;

  wrap.innerHTML = `
    ${pageDividerLineHtml()}
    <h3 class="capital-section-title">🤝 Equity financing</h3>
    <div class="kpi-grid" style="margin-bottom:16px;">
      <div class="kpi-tile"><span class="kpi-label">Equity needed</span><span class="kpi-value">${fmtMoneyShort(neededTotal)}</span><span class="kpi-sub">across ${preClose.length} in-contract deal${preClose.length===1?"":"s"}</span></div>
      <div class="kpi-tile"><span class="kpi-label">Committed</span><span class="kpi-value good">${fmtMoneyShort(committedTotal)}</span></div>
      <div class="kpi-tile"><span class="kpi-label">Gap</span><span class="kpi-value${gapTotal>0?" bad":""}">${fmtMoneyShort(gapTotal)}</span><span class="kpi-sub">${gapTotal>0?"not yet covered":"fully covered"}</span></div>
      <div class="kpi-tile"><span class="kpi-label">No sources yet</span><span class="kpi-value">${noSourcesCount}</span><span class="kpi-sub">of ${preClose.length} deal${preClose.length===1?"":"s"}</span></div>
    </div>
    ${preClose.length ? preClose.map(([id,d])=>equityDealCardHtml(id,d)).join("") : `<div class="empty-hint">No deals are under contract yet — this fills in once a deal reaches Signed PSA/DD.</div>`}
    ${closed.length ? `<details class="weekly-group" style="margin-top:16px;">
      <summary>Closed / funded<span class="weekly-group-count">${closed.length}</span></summary>
      <div style="padding:10px 13px;">${closed.map(([id,d])=>equityDealCardHtml(id,d)).join("")}</div>
    </details>` : ""}`;
  wireEquityView(wrap);
}

/* One broker's row in the stacked Brokers list — deliberately mirrors buildStageDealRow's
   structure/classes (stage-row-top/-title/-sub/-fields/-actions) so the two "stacked" views in
   the app read as one visual language, just grouped by relationship temperature instead of deal
   stage. The tier select lets you re-rate a broker right from the list, same convenience as the
   pipeline's inline "move to stage" select. */
function buildBrokerRow(id, b){
  const row = document.createElement("div");
  row.className = "broker-row";
  const tier = BROKER_TIER_META[b.tier||""] || BROKER_TIER_META[""];
  row.style.borderLeftColor = `var(--${tier.color})`;
  row.addEventListener("click", (e)=>{
    if(e.target.closest(".broker-tier-select")) return;
    openBrokerModal(id);
  });
  const stats = brokerDealStats(id);
  const contactBits = [];
  if(b.phone) contactBits.push(escapeHtml(b.phone));
  if(b.email) contactBits.push(escapeHtml(b.email));
  const contactHtml = contactBits.length ? contactBits.join(" · ") : `<span class="broker-card-nocontact">No contact info yet</span>`;

  row.innerHTML = `
    <div class="stage-row-top">
      <div class="stage-row-title-wrap">
        <span class="stage-row-title"></span>
        <span class="pill ${tier.cls}">${tier.label}</span>
        ${(b.markets && b.markets.length) ? b.markets.map(m=>`<span class="pill pill-neutral">${escapeHtml(m)}</span>`).join("") : ""}
      </div>
      ${b.firm ? `<div class="stage-row-sub"></div>` : ""}
    </div>
    <div class="stage-row-fields">
      <div class="stage-field"><span class="stage-field-label">Contact</span><span class="stage-field-value">${contactHtml}</span></div>
      <div class="stage-field"><span class="stage-field-label">Deals sent</span><span class="stage-field-value">${stats.count}</span></div>
      <div class="stage-field"><span class="stage-field-label">Active</span><span class="stage-field-value">${stats.activeCount}</span></div>
      <div class="stage-field"><span class="stage-field-label">$ Volume</span><span class="stage-field-value">${stats.totalVolume?fmtMoneyShort(stats.totalVolume):"—"}</span></div>
      <div class="stage-field"><span class="stage-field-label">Last deal</span><span class="stage-field-value">${stats.lastDealDate?fmtDate(stats.lastDealDate.slice(0,10)):"—"}</span></div>
    </div>
    <div class="stage-row-actions">
      <select class="move-select broker-tier-select" title="Rating"></select>
    </div>`;
  row.querySelector(".stage-row-title").textContent = b.name || "Unnamed";
  if(b.firm) row.querySelector(".stage-row-sub").textContent = b.firm;
  const tierSel = row.querySelector(".broker-tier-select");
  Object.entries(BROKER_TIER_META).forEach(([k,m])=>{
    const o = document.createElement("option"); o.value=k; o.textContent=m.label;
    if((b.tier||"")===k) o.selected = true;
    tierSel.appendChild(o);
  });
  tierSel.addEventListener("click", e=>e.stopPropagation());
  tierSel.addEventListener("change", ()=> updateBroker(id, {tier: tierSel.value}));
  return row;
}

function renderBrokersView(){
  const wrap = document.getElementById("brokersWrap");
  if(!wrap) return;
  const q = (document.getElementById("searchInput").value||"").trim().toLowerCase();
  let list = [...brokers.entries()];
  if(q) list = list.filter(([id,b])=> matchesFilter([b.name,b.firm,b.phone,b.email,b.notes,(b.markets||[]).join(" ")].join(" "), q));

  if(!brokers.size){
    wrap.innerHTML = `<div class="empty-hint">No brokers yet. Add one, or drop an OM into the pipeline (Acquisitions → "Start from an OM or listing") and we'll pick up the listing broker automatically.</div>`;
    return;
  }
  if(!list.length){
    wrap.innerHTML = `<div class="empty-hint">No brokers match your filter.</div>`;
    return;
  }

  const toolbar = document.createElement("div");
  toolbar.className = "pipeline-toolbar";
  toolbar.innerHTML = `<div class="pipeline-toolbar-left"><span class="filter-note">${list.length} broker${list.length===1?"":"s"}</span></div>`;

  wrap.innerHTML = "";
  wrap.appendChild(toolbar);

  BROKER_TIER_ORDER.forEach(tierKey=>{
    const tier = BROKER_TIER_META[tierKey];
    let group = list.filter(([id,b])=> (b.tier||"")===tierKey);
    group.sort((a,b)=> brokerLabel(a[1]).localeCompare(brokerLabel(b[1])));

    const section = document.createElement("details");
    section.className = "stage-section";
    section.open = true;
    const summary = document.createElement("summary");
    summary.className = "stage-header";
    summary.style.borderLeftColor = `var(--${tier.color})`;
    summary.style.background = `var(--${tier.color})`;
    summary.style.color = `var(--${tier.color}-ink)`;
    summary.innerHTML = `
      <h3 class="stage-header-title">${tier.label}</h3>
      <span class="stage-header-count mono">${group.length}</span>`;
    section.appendChild(summary);

    const body = document.createElement("div");
    body.className = "stage-body";
    if(group.length===0){
      const hint = document.createElement("div");
      hint.className = "stage-empty-line";
      hint.textContent = "No brokers at this rating";
      body.appendChild(hint);
    }
    group.forEach(([id,b])=> body.appendChild(buildBrokerRow(id,b)));
    section.appendChild(body);
    wrap.appendChild(section);
  });
}

/* opts.prefill: {name,firm,phone,email} to pre-fill a NEW broker (e.g. from OM extraction).
   opts.onCreate: called with the new broker's id right after it's created. */
function openBrokerModal(id, opts){
  opts = opts || {};
  brokerModalOnCreate = opts.onCreate || null;
  brokerModalPrefill = opts.prefill || null;
  openBrokerId = id;
  const existing = document.getElementById("brokerOverlay");
  if(existing) existing.remove();
  const isNew = !id;
  const b = isNew ? {} : (brokers.get(id) || {});
  const pre = isNew ? (brokerModalPrefill||{}) : {};

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "brokerOverlay";
  overlay.innerHTML = `
    <div class="modal broker-modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2>${isNew ? "Add broker" : "Broker"}</h2>
        <div style="margin-left:auto;display:flex;gap:8px;">
          ${!isNew ? `<button type="button" class="btn-icon" id="brokerDeleteBtn" title="Delete broker">🗑</button>` : ""}
          <button type="button" class="btn-icon" id="brokerCloseBtn">✕ Close</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <div class="field"><label for="brName">Name</label><input id="brName" type="text" placeholder="e.g. Jane Doe"></div>
          <div class="field"><label for="brFirm">Firm</label><input id="brFirm" type="text" placeholder="e.g. Newgard Group"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="brPhone">Phone</label><input id="brPhone" type="text" placeholder="Phone"></div>
          <div class="field"><label for="brEmail">Email</label><input id="brEmail" type="text" placeholder="Email"></div>
          <div class="field"><label for="brTier">Rating</label>
            <select id="brTier">${Object.entries(BROKER_TIER_META).map(([k,m])=>`<option value="${k}">${m.label}</option>`).join("")}</select>
          </div>
        </div>
        <div class="field"><label for="brNotes">Relationship notes</label><textarea id="brNotes" placeholder="Standing notes — e.g. 'good on off-market land', 'slow to respond'…"></textarea></div>
        <div class="field">
          <label for="brMarketInput">Markets</label>
          <div class="tag-input-wrap">
            <span class="tag-pills-list" id="brMarketsPillsList"></span>
            <input type="text" id="brMarketInput" placeholder="Type a market, press Enter…">
          </div>
        </div>
        ${!isNew ? `
        <div>
          <div class="deposit-extra-head"><h4 class="section-label" style="margin:0;">Call / activity log</h4><button type="button" class="btn-icon" id="brAddLogBtn">+ Add note</button></div>
          <div id="brokerActivityLog"></div>
        </div>
        <div>
          <h4 class="section-label">Deals sent</h4>
          <div id="brokerLinkedDeals"></div>
        </div>` : ""}
      </div>
      ${isNew ? `<div class="modal-foot">
        <button class="btn btn-primary" id="brSaveBtn">Add broker</button>
        <button class="btn btn-ghost" id="brCancelBtn" style="margin-left:auto">Cancel</button>
      </div>` : ""}
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById("brName").value = b.name || pre.name || "";
  document.getElementById("brFirm").value = b.firm || pre.firm || "";
  document.getElementById("brPhone").value = b.phone || pre.phone || "";
  document.getElementById("brEmail").value = b.email || pre.email || "";
  document.getElementById("brTier").value = b.tier || "";
  document.getElementById("brNotes").value = b.notes || "";

  const close = ()=>{ openBrokerId = null; overlay.remove(); };
  overlay.addEventListener("click", e=>{ if(e.target===overlay) close(); });
  const closeBtn = document.getElementById("brokerCloseBtn");
  if(closeBtn) closeBtn.addEventListener("click", close);
  const cancelBtn = document.getElementById("brCancelBtn");
  if(cancelBtn) cancelBtn.addEventListener("click", close);

  if(isNew){
    // A brand-new broker has no id yet (and isn't in the `brokers` map), so its markets are held
    // in this local array until "Add broker" is clicked, rather than routed through
    // addBrokerMarket/updateBroker (which need an existing broker record).
    let newMarkets = (pre.markets || []).slice();
    const renderNewMarketsPills = ()=>{
      const holder = document.getElementById("brMarketsPillsList");
      if(!holder) return;
      holder.innerHTML = newMarkets.map((m,i)=>
        `<span class="pill pill-neutral tag-pill">${escapeHtml(m)}<span class="tag-pill-remove" data-idx="${i}" title="Remove market">✕</span></span>`
      ).join("");
      holder.querySelectorAll(".tag-pill-remove").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          newMarkets = newMarkets.filter((_,i)=> i!==Number(btn.getAttribute("data-idx")));
          renderNewMarketsPills();
        });
      });
    };
    const addNewMarket = (value)=>{
      const v = (value||"").trim();
      if(!v || newMarkets.some(m=>m.toLowerCase()===v.toLowerCase())) return;
      newMarkets = newMarkets.concat([v]);
      renderNewMarketsPills();
    };
    const newMarketInput = document.getElementById("brMarketInput");
    newMarketInput.addEventListener("keydown", e=>{
      if(e.key==="Enter" || e.key===","){ e.preventDefault(); addNewMarket(newMarketInput.value); newMarketInput.value = ""; }
    });
    newMarketInput.addEventListener("blur", ()=>{ if(newMarketInput.value.trim()){ addNewMarket(newMarketInput.value); newMarketInput.value = ""; } });
    renderNewMarketsPills();

    document.getElementById("brSaveBtn").addEventListener("click", async ()=>{
      const name = document.getElementById("brName").value.trim();
      if(!name){ document.getElementById("brName").focus(); return; }
      const newId = await createBroker({
        name,
        firm: document.getElementById("brFirm").value.trim(),
        phone: document.getElementById("brPhone").value.trim(),
        email: document.getElementById("brEmail").value.trim(),
        tier: document.getElementById("brTier").value,
        notes: document.getElementById("brNotes").value.trim(),
        markets: newMarkets,
      });
      if(brokerModalOnCreate) brokerModalOnCreate(newId);
      close();
    });
  } else {
    const save = (patch)=> updateBroker(id, patch);
    document.getElementById("brName").addEventListener("change", e=> save({name: e.target.value.trim()}));
    document.getElementById("brFirm").addEventListener("change", e=> save({firm: e.target.value.trim()}));
    document.getElementById("brPhone").addEventListener("change", e=> save({phone: e.target.value.trim()}));
    document.getElementById("brEmail").addEventListener("change", e=> save({email: e.target.value.trim()}));
    document.getElementById("brTier").addEventListener("change", e=> save({tier: e.target.value}));
    document.getElementById("brNotes").addEventListener("change", e=> save({notes: e.target.value.trim()}));
    document.getElementById("brAddLogBtn").addEventListener("click", ()=>{
      const cur = brokers.get(id) || {};
      const next = (cur.activityLog||[]).concat([{date: new Date().toISOString().slice(0,10), note:"", link:"", author: whoName()||"", attachments:[]}]);
      updateBroker(id, {activityLog: next});
    });
    document.getElementById("brokerDeleteBtn").addEventListener("click", ()=>{
      openConfirm(`Delete <strong>${escapeHtml(b.name||"this broker")}</strong>? Deals already linked to them keep their history, but the link will be cleared. This can't be undone.`,
        ()=>{ deleteBroker(id); close(); });
    });
    const marketInput = document.getElementById("brMarketInput");
    marketInput.addEventListener("keydown", e=>{
      if(e.key==="Enter" || e.key===","){
        e.preventDefault();
        addBrokerMarket(marketInput.value);
        marketInput.value = "";
      }
    });
    marketInput.addEventListener("blur", ()=>{
      if(marketInput.value.trim()){ addBrokerMarket(marketInput.value); marketInput.value = ""; }
    });
    renderBrokerMarketsPills();
    renderBrokerActivityLog();
    renderBrokerLinkedDeals();
  }
}

/* Called on open (edit mode) and again whenever brokers/deals data changes underneath an open
   broker modal — refreshes only the derived, read-mostly sections (markets, activity log, linked
   deals), never the top contact fields or the market/note text still being typed, so a teammate's
   edit elsewhere can't blow away what's mid-edit locally. */
function renderBrokerModalContent(){
  if(!openBrokerId || !document.getElementById("brokerOverlay")) return;
  renderBrokerMarketsPills();
  renderBrokerActivityLog();
  renderBrokerLinkedDeals();
}

function addBrokerMarket(value){
  const v = (value||"").trim();
  if(!v || !openBrokerId) return;
  const cur = brokers.get(openBrokerId) || {};
  const markets = cur.markets || [];
  if(markets.some(m=>m.toLowerCase()===v.toLowerCase())) return; // no duplicates
  updateBroker(openBrokerId, {markets: markets.concat([v])});
}
function removeBrokerMarket(idx){
  if(!openBrokerId) return;
  const cur = brokers.get(openBrokerId) || {};
  updateBroker(openBrokerId, {markets: (cur.markets||[]).filter((_,i)=>i!==idx)});
}
function renderBrokerMarketsPills(){
  const holder = document.getElementById("brMarketsPillsList");
  if(!holder || !openBrokerId) return;
  const b = brokers.get(openBrokerId) || {};
  const markets = b.markets || [];
  holder.innerHTML = markets.map((m,i)=>
    `<span class="pill pill-neutral tag-pill">${escapeHtml(m)}<span class="tag-pill-remove" data-idx="${i}" title="Remove market">✕</span></span>`
  ).join("");
  holder.querySelectorAll(".tag-pill-remove").forEach(btn=>{
    btn.addEventListener("click", ()=> removeBrokerMarket(Number(btn.getAttribute("data-idx"))));
  });
}

function fmtFileSize(bytes){
  if(bytes==null) return "";
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/(1024*1024)).toFixed(1) + " MB";
}

/* Attachments live in Supabase Storage (bucket "broker-attachments", set up by supabase.sql),
   not in the docs table — only the {path,name,size,uploadedAt} pointer is stored on the log entry
   itself. The bucket is private, so opening a file means asking Storage for a fresh short-lived
   signed URL each time rather than storing a permanent one. `sb` is the raw supabase-js client
   (set up alongside `supabaseDb` near the top of this file) — Storage isn't part of the
   collection()/doc() adapter, so this talks to it directly. */
async function openBrokerLogAttachment(path){
  if(!sb){ showToast("File storage isn't connected", "bad"); return; }
  try{
    const { data, error } = await sb.storage.from("broker-attachments").createSignedUrl(path, 3600);
    if(error) throw error;
    window.open(data.signedUrl, "_blank", "noopener");
  }catch(err){
    console.error("Couldn't open attachment:", err);
    showToast("Couldn't open that file", "bad");
  }
}
async function removeBrokerLogAttachment(entryIdx, attIdx){
  const cur = brokers.get(openBrokerId);
  if(!cur) return;
  const list = (cur.activityLog||[]).slice();
  const entry = Object.assign({}, list[entryIdx]);
  const atts = (entry.attachments||[]).slice();
  const [removed] = atts.splice(attIdx,1);
  entry.attachments = atts;
  list[entryIdx] = entry;
  await updateBroker(openBrokerId, {activityLog: list});
  if(removed && sb){
    try{ await sb.storage.from("broker-attachments").remove([removed.path]); }
    catch(e){ console.error("Storage cleanup failed (file may be orphaned, harmless):", e); }
  }
  renderBrokerActivityLog();
}
async function handleBrokerLogFileUpload(entryIdx, fileList, statusEl){
  if(!sb){
    if(statusEl){ statusEl.textContent = "File storage isn't connected."; statusEl.classList.add("warn"); }
    return;
  }
  const brokerId = openBrokerId;
  const files = Array.from(fileList||[]);
  if(!files.length || !brokerId) return;
  for(const file of files){
    if(file.size > 50*1024*1024){
      if(statusEl){ statusEl.textContent = file.name + " is over the 50MB limit — try a smaller file."; statusEl.classList.add("warn"); }
      continue;
    }
    if(statusEl){ statusEl.textContent = "Uploading " + file.name + "…"; statusEl.classList.remove("warn"); }
    try{
      const safeName = file.name.replace(/[^\w.\-]+/g, "_");
      const path = brokerId + "/" + Date.now() + "_" + Math.random().toString(36).slice(2,8) + "_" + safeName;
      const { error } = await sb.storage.from("broker-attachments").upload(path, file);
      if(error) throw error;
      const cur = brokers.get(brokerId);
      if(!cur) return;
      const list = (cur.activityLog||[]).slice();
      const entry = Object.assign({}, list[entryIdx]);
      entry.attachments = (entry.attachments||[]).concat([{path, name: file.name, size: file.size, uploadedAt: new Date().toISOString()}]);
      list[entryIdx] = entry;
      await updateBroker(brokerId, {activityLog: list});
    }catch(err){
      console.error("Attachment upload failed:", err);
      if(statusEl){
        statusEl.textContent = "Couldn't upload " + file.name + " — " + ((err && err.message) || "try again");
        statusEl.classList.add("warn");
      }
      return;
    }
  }
  if(statusEl){ statusEl.textContent = ""; statusEl.classList.remove("warn"); }
  renderBrokerActivityLog();
}

/* =================== deal Excel-model upload + AI-extracted "gist" =================== */
/* The prompt asks the model to read the RAW, mechanically-flattened contents of an uploaded
   underwriting workbook (see flattenWorkbookText) and pull out whatever headline figures it can
   actually find — spreadsheet layouts vary wildly deal to deal, so this deliberately doesn't
   assume fixed cell positions the way a "real" Excel integration might; it leans on the model's
   reading comprehension instead, the same way OM/listing extraction already does for prose. */
const MODEL_GIST_PROMPT = (ctx)=> `You are a real estate acquisitions analyst at Newgard Development Group. You've been given the raw extracted contents of an Excel underwriting/financial model for a deal, and asked to produce a quick, readable summary of it for someone who doesn't want to open the spreadsheet themselves.

KNOWN DEAL FIELDS (already entered by the analyst — treat as ground truth):
- Project name: ${ctx.name || "(not given)"}
- Address: ${ctx.address || "(not given)"}
- Product line: ${ctx.productLine || "(not given)"}
- Purchase price: ${ctx.purchasePrice != null ? ctx.purchasePrice : "(not given)"}

RAW MODEL CONTENTS (mechanically extracted from the spreadsheet's cells, sheet by sheet as CSV — labels and values may be jumbled or repeated since this is not a clean export; use your judgment to find the real headline figures):
"""
${ctx.modelText || "(none)"}
"""

Return ONLY a JSON object with exactly these keys:
- "summary": 2-4 plain-language sentences on what this model shows — the deal's economics in a nutshell. This is the main "gist" someone would read instead of opening the spreadsheet.
- "keyFigures": an array of up to 8 objects {"label": short label, "value": short formatted value as a string} for the headline figures you can actually find in the extracted text (e.g. IRR, equity multiple, yield on cost, cap rate, total development cost, net margin, cash-on-cash, exit value — whichever of these the model actually contains). Only include a figure if you can point to where it came from in the text — never invent or estimate one.
- "risks": 1-2 sentences flagging anything in the model worth double-checking (a thin margin, an aggressive assumption, a stale-looking date) — or an empty string if nothing stands out.

If the extracted text doesn't look like a financial model at all (e.g. it's mostly blank, or clearly some other kind of document), still return the JSON shape above, but with "summary" explaining that you couldn't find recognizable model content, an empty "keyFigures" array, and an empty "risks" string.`;

/* Flattens every sheet in a parsed workbook to plain CSV-ish text, sheet by sheet, capped in
   length the same way OM/listing text extraction already is elsewhere in this file — the AI
   prompt above is what does the actual "reading", this just gets the raw cell contents to it. */
function flattenWorkbookText(workbook){
  const parts = [];
  (workbook.SheetNames||[]).forEach(name=>{
    const sheet = workbook.Sheets[name];
    if(!sheet) return;
    let csv = "";
    try{ csv = XLSX.utils.sheet_to_csv(sheet, {blankrows:false}); }catch(e){ csv = ""; }
    if(csv.trim()) parts.push(`--- Sheet: ${name} ---\n${csv.trim()}`);
  });
  return parts.join("\n\n").slice(0, 24000);
}

async function extractModelGist(dealId, arrayBuffer, statusEl){
  if(typeof XLSX === "undefined"){
    if(statusEl){ statusEl.textContent = "Uploaded — the summary tool didn't load. Refresh the page and try \"Regenerate summary\"."; statusEl.classList.add("warn"); }
    return;
  }
  let workbook;
  try{ workbook = XLSX.read(arrayBuffer, {type:"array"}); }
  catch(err){
    console.error("Workbook parse failed:", err);
    if(statusEl){ statusEl.textContent = "Uploaded, but couldn't read that as an Excel file — is it a valid .xlsx/.xls?"; statusEl.classList.add("warn"); }
    return;
  }
  const modelText = flattenWorkbookText(workbook);
  if(!modelText.trim()){
    if(statusEl){ statusEl.textContent = "Uploaded, but the file looks empty — no summary generated."; statusEl.classList.add("warn"); }
    return;
  }
  if(!sampleApi){
    if(statusEl){ statusEl.textContent = "Uploaded — AI summarizing isn't available in this view."; statusEl.classList.add("warn"); }
    return;
  }
  const d = deals.get(dealId) || {};
  if(statusEl){ statusEl.textContent = "Summarizing…"; statusEl.classList.remove("warn"); }
  try{
    const result = await sampleApi.json(MODEL_GIST_PROMPT({name:d.name, address:d.address, productLine:d.productLine, purchasePrice:d.purchasePrice, modelText}), {modelTier:"default"});
    if(!result || typeof result.summary!=="string") throw new Error("Unexpected response shape");
    await updateDeal(dealId, {modelGist: {
      summary: result.summary || "",
      keyFigures: Array.isArray(result.keyFigures) ? result.keyFigures.filter(f=>f && f.label && f.value).slice(0,8) : [],
      risks: result.risks || "",
      generatedAt: new Date().toISOString(),
    }});
    if(statusEl){ statusEl.textContent = ""; statusEl.classList.remove("warn"); }
  }catch(err){
    console.error("Model summary failed:", err);
    if(statusEl){ statusEl.textContent = "Uploaded, but summarizing failed" + (err && err.detail ? " — "+err.detail : "") + "."; statusEl.classList.add("warn"); }
  }
}

async function handleModelFileUpload(dealId, file, statusEl){
  if(!sb){ if(statusEl){ statusEl.textContent = "File storage isn't connected."; statusEl.classList.add("warn"); } return; }
  if(!/\.(xlsx|xls)$/i.test(file.name)){
    if(statusEl){ statusEl.textContent = "Only .xlsx/.xls files are supported."; statusEl.classList.add("warn"); }
    return;
  }
  if(file.size > 50*1024*1024){
    if(statusEl){ statusEl.textContent = file.name + " is over the 50MB limit — try a smaller file."; statusEl.classList.add("warn"); }
    return;
  }
  if(statusEl){ statusEl.textContent = "Uploading " + file.name + "…"; statusEl.classList.remove("warn"); }
  const prevFile = (deals.get(dealId)||{}).proformaFile;
  try{
    const safeName = file.name.replace(/[^\w.\-]+/g, "_");
    const path = dealId + "/" + Date.now() + "_" + Math.random().toString(36).slice(2,8) + "_" + safeName;
    const { error } = await sb.storage.from("deal-files").upload(path, file);
    if(error) throw error;
    await updateDeal(dealId, {proformaFile: {path, name: file.name, size: file.size, uploadedAt: new Date().toISOString()}, modelGist: null});
    if(prevFile && prevFile.path){
      try{ await sb.storage.from("deal-files").remove([prevFile.path]); }
      catch(e){ console.error("Storage cleanup failed (old model file may be orphaned, harmless):", e); }
    }
  }catch(err){
    console.error("Model file upload failed:", err);
    if(statusEl){ statusEl.textContent = "Couldn't upload " + file.name + " — " + ((err && err.message) || "try again"); statusEl.classList.add("warn"); }
    return;
  }
  renderModelFileSection();
  try{
    if(statusEl){ statusEl.textContent = "Reading the model…"; }
    const buf = await file.arrayBuffer();
    await extractModelGist(dealId, buf, statusEl);
  }catch(err){
    console.error("Model parse failed:", err);
    if(statusEl){ statusEl.textContent = "Uploaded, but couldn't read the file to summarize it — " + ((err && err.message)||"try again") + "."; statusEl.classList.add("warn"); }
  }
  renderModelFileSection();
}

async function regenerateModelGist(dealId, statusEl){
  const d = deals.get(dealId) || {};
  const file = d.proformaFile;
  if(!file || !sb) return;
  if(statusEl){ statusEl.textContent = "Fetching model…"; statusEl.classList.remove("warn"); }
  try{
    const { data, error } = await sb.storage.from("deal-files").createSignedUrl(file.path, 300);
    if(error) throw error;
    const res = await fetch(data.signedUrl);
    if(!res.ok) throw new Error("HTTP "+res.status);
    const buf = await res.arrayBuffer();
    await extractModelGist(dealId, buf, statusEl);
  }catch(err){
    console.error("Regenerate model summary failed:", err);
    if(statusEl){ statusEl.textContent = "Couldn't re-read the file — " + ((err && err.message)||"try again") + "."; statusEl.classList.add("warn"); }
    return;
  }
  renderModelFileSection();
}

async function openModelFile(path){
  if(!sb){ showToast("File storage isn't connected", "bad"); return; }
  try{
    const { data, error } = await sb.storage.from("deal-files").createSignedUrl(path, 3600);
    if(error) throw error;
    window.open(data.signedUrl, "_blank", "noopener");
  }catch(err){ console.error("Couldn't open model file:", err); showToast("Couldn't open that file", "bad"); }
}

async function removeModelFile(dealId){
  const d = deals.get(dealId) || {};
  const file = d.proformaFile;
  if(!file) return;
  await updateDeal(dealId, {proformaFile: null, modelGist: null});
  if(sb){
    try{ await sb.storage.from("deal-files").remove([file.path]); }
    catch(e){ console.error("Storage cleanup failed (harmless):", e); }
  }
  renderModelFileSection();
}

/* Re-rendered on open, after upload/remove/regenerate, and whenever this deal's data changes
   underneath the open panel (same conservative-realtime pattern as renderBrokerModalContent) —
   safe to always re-render since nothing here is a text input the analyst could be mid-typing in. */
function renderModelFileSection(){
  if(!openDealId) return;
  const wrap = document.getElementById("modelFileWrap");
  if(!wrap) return;
  const d = deals.get(openDealId) || {};
  const file = d.proformaFile;
  const gist = d.modelGist;
  wrap.innerHTML = `
    <div class="model-file-attach-area">
      ${file ? `<span class="pill pill-neutral tag-pill">
          <span class="model-file-open" id="modelFileOpenBtn">📎 ${escapeHtml(file.name)}${file.size!=null?` (${fmtFileSize(file.size)})`:""}</span>
          <span class="tag-pill-remove" id="modelFileRemoveBtn" title="Remove file">✕</span>
        </span>
        <button type="button" class="btn-icon" id="modelGistRegenBtn" title="Re-run the summary from this file">↻ Regenerate summary</button>`
        : `<label class="model-file-label">📎 Upload Excel model<input type="file" id="modelFileInput" accept=".xlsx,.xls"></label>`}
      <span class="model-file-status" id="modelFileStatus"></span>
    </div>
    ${gist ? `<div class="model-gist-box">
      <p class="model-gist-summary">${escapeHtml(gist.summary||"")}</p>
      ${gist.keyFigures && gist.keyFigures.length ? `<div class="model-gist-figures">${gist.keyFigures.map(f=>`<div class="model-gist-figure"><span class="model-gist-figure-label">${escapeHtml(f.label)}</span><span class="model-gist-figure-value">${escapeHtml(f.value)}</span></div>`).join("")}</div>` : ""}
      ${gist.risks ? `<p class="model-gist-summary" style="margin-top:8px;"><strong>Worth double-checking:</strong> ${escapeHtml(gist.risks)}</p>` : ""}
      <div class="model-gist-meta">Summarized ${gist.generatedAt?fmtDate(gist.generatedAt.slice(0,10)):""} from the uploaded file — always verify in the actual model before presenting to IC.</div>
    </div>` : (file ? `<div class="empty-hint" style="margin-top:8px;">No summary yet — click "Regenerate summary" above, or re-upload the file.</div>` : "")}
  `;
  if(file){
    const openBtn = document.getElementById("modelFileOpenBtn");
    if(openBtn) openBtn.addEventListener("click", ()=> openModelFile(file.path));
    const removeBtn = document.getElementById("modelFileRemoveBtn");
    if(removeBtn) removeBtn.addEventListener("click", ()=> removeModelFile(openDealId));
    const regenBtn = document.getElementById("modelGistRegenBtn");
    if(regenBtn) regenBtn.addEventListener("click", ()=> regenerateModelGist(openDealId, document.getElementById("modelFileStatus")));
  } else {
    const fileInput = document.getElementById("modelFileInput");
    if(fileInput) fileInput.addEventListener("change", (e)=>{
      const f = e.target.files[0];
      e.target.value = "";
      if(f) handleModelFileUpload(openDealId, f, document.getElementById("modelFileStatus"));
    });
  }
}

/* =================== contract documents (PSA/LOI/amendment upload + AI term extraction) =================== */
/* Unlike the single Excel-model file above, a deal accumulates contract documents over time — an
   LOI, then a PSA, then amendments that change specific terms — so this is a growing list
   (d.contractDocs), each entry its own upload with its own extraction pass. And unlike the model
   gist (a read-only summary), extraction results here are actual deal field values (purchase
   price, dates, deposits) that would otherwise require re-typing by hand — so every extraction
   goes through a review step (checkboxes, current value shown struck through next to the
   proposed one) before anything is written, rather than auto-applying. The same review flow
   naturally handles amendments too: re-uploading a later document just runs another pass against
   the deal's current values, and only what that document actually restates or changes shows up
   as a proposed change — nothing to special-case. */
const CONTRACT_DOCTYPE_META = {
  PSA:       {label:"PSA",       color:"accent"},
  LOI:       {label:"LOI",       color:"warn"},
  Amendment: {label:"Amendment", color:"brass"},
  Other:     {label:"Document",  color:"neutral"},
};
const CONTRACT_FIELD_LABELS = {
  psaStatus:         {label:"PSA status",              kind:"text", default:"Not Started"},
  purchasePrice:     {label:"Purchase price",           kind:"money"},
  lotSizeAcres:       {label:"Lot size (acres)",         kind:"acres"},
  effectiveDate:     {label:"PSA effective date",       kind:"date"},
  closingDate:       {label:"Expected close date",      kind:"date"},
  inspectionEndDate: {label:"Inspection / DD end date", kind:"date"},
  actualCloseDate:   {label:"Actual close date",        kind:"date"},
  deposit1Amount:    {label:"1st deposit amount",       kind:"money"},
  deposit1Date:      {label:"Earnest money date",       kind:"date"},
  deposit1Status:    {label:"1st deposit status",       kind:"text", default:"Not Due"},
  deposit2Amount:    {label:"2nd deposit amount",       kind:"money"},
  deposit2Date:      {label:"2nd deposit date",         kind:"date"},
  deposit2Status:    {label:"2nd deposit status",       kind:"text", default:"Not Due"},
};
function contractFieldDisplay(kind, v){
  if(v===null || v===undefined || v==="") return "—";
  if(kind==="money") return fmtMoneyShort(v);
  if(kind==="acres") return fmtAcres(v);
  if(kind==="date"){ const d = new Date(v+"T00:00:00"); return isNaN(d) ? String(v) : d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
  return String(v);
}

const CONTRACT_EXTRACT_PROMPT = (ctx)=> `You are a real estate acquisitions analyst at Newgard Development Group. You've been given the extracted text of a contract document — a Purchase & Sale Agreement (PSA), a Letter of Intent (LOI), or an amendment to either one — for a deal already in the pipeline. Pull out whatever deal terms it actually states so the pipeline entry can be updated automatically instead of someone re-typing what they just read.

KNOWN DEAL FIELDS (already on file — the CURRENT values). Only return a key below if THIS document explicitly states a value for it — whether that's the original terms or a change from these current values. If the document doesn't mention a field at all, omit that key (or use null) — never guess, never restate a current value just to fill the key in, and never invent a number or date:
- Project name: ${ctx.name || "(not given)"}
- Address: ${ctx.address || "(not given)"}
- Current PSA status: ${ctx.psaStatus || "Not Started"}
- Current purchase price: ${ctx.purchasePrice != null ? fmtMoneyShort(ctx.purchasePrice) : "(not set)"}
- Current lot size: ${ctx.lotSizeAcres != null ? ctx.lotSizeAcres+" ac" : "(not set)"}
- Current effective/execution date: ${ctx.effectiveDate || "(not set)"}
- Current expected closing date: ${ctx.closingDate || "(not set)"}
- Current inspection/DD end date: ${ctx.inspectionEndDate || "(not set)"}
- Current actual close date: ${ctx.actualCloseDate || "(not set)"}
- Current 1st deposit: ${ctx.deposit1Amount != null ? fmtMoneyShort(ctx.deposit1Amount) : "(not set)"}, due ${ctx.deposit1Date || "(not set)"}, status ${ctx.deposit1Status || "Not Due"}
- Current 2nd deposit: ${ctx.deposit2Amount != null ? fmtMoneyShort(ctx.deposit2Amount) : "(not set)"}, due ${ctx.deposit2Date || "(not set)"}, status ${ctx.deposit2Status || "Not Due"}
- Other deposits already on file: ${ctx.extraDepositLabels && ctx.extraDepositLabels.length ? ctx.extraDepositLabels.join("; ") : "(none)"}

DOCUMENT TEXT (mechanically extracted — may include OCR/layout noise; use your judgment):
"""
${ctx.text}
"""

Return ONLY a JSON object with exactly these keys:
- "docType": your best guess at what this document is — one of "PSA", "LOI", "Amendment", "Other"
- "docSummary": one short plain sentence describing this specific document, for someone scanning a list of uploaded files (e.g. "Executed PSA dated 10/27/25" or "First amendment extending the site plan approval date to 5/4/2026")
- "psaStatus": one of ${JSON.stringify(PSA_STATUS_OPTIONS)}, only if this document makes the status clear and it's different from "Current PSA status" above — otherwise null
- "purchasePrice": numeric dollars, no symbols/commas, or null
- "lotSizeAcres": numeric acres (convert from square feet by dividing by 43560 if that's what's given), or null
- "effectiveDate": ISO date (YYYY-MM-DD) the PSA/LOI was executed/effective, or null
- "closingDate": ISO date the deal is expected to close, or null
- "inspectionEndDate": ISO date the inspection / due-diligence / feasibility period ends (sometimes called the non-refundable date), or null
- "actualCloseDate": ISO date, ONLY if this document states the deal has already actually closed, or null
- "deposit1Amount": numeric dollars for the first/earnest money deposit, or null
- "deposit1Date": ISO date that deposit is/was due, or null
- "deposit1Status": one of ${JSON.stringify(DEPOSIT_STATUS_OPTIONS)}, or null
- "deposit2Amount": numeric dollars for a second deposit, or null
- "deposit2Date": ISO date, or null
- "deposit2Status": one of ${JSON.stringify(DEPOSIT_STATUS_OPTIONS)}, or null
- "extraDeposits": an array of any OTHER deposits this document describes beyond the first/second above (e.g. an extension deposit) that aren't already among "Other deposits already on file" — each as {"label": short description, "amount": numeric dollars, "date": ISO date or "", "status": one of ${JSON.stringify(DEPOSIT_STATUS_OPTIONS)}}. Empty array if none.
- "notesAddition": 2-5 sentences of plain-language, non-numeric context worth recording in the deal's notes — seller name, escrow/title company, commission structure and who pays it, intended use, or any other condition worth a human knowing about. Empty string if this document adds nothing new here.

If this text doesn't look like a real estate contract at all, still return this exact JSON shape with every field null/empty and "docType":"Other".`;

/* Reads plain text out of an uploaded contract file the same way OM/listing extraction already
   does (extractPdfText/loadPdfJs, defined above) — PDF via pdf.js, .txt/.md read directly. */
async function extractContractDocText(file){
  const isPdf = /\.pdf$/i.test(file.name) || (file.type||"")==="application/pdf";
  if(isPdf) return await extractPdfText(file);
  return (await file.text()) || "";
}

function contractDocStatus(msg, isWarn){
  const el = document.getElementById("contractDocStatus");
  if(!el) return;
  el.textContent = msg||"";
  el.classList.toggle("warn", !!isWarn);
}

async function handleContractDocUpload(dealId, file, statusEl){
  if(!sb){ contractDocStatus("File storage isn't connected.", true); return; }
  if(!/\.(pdf|txt|md)$/i.test(file.name)){
    contractDocStatus("Only .pdf, .txt, or .md files are supported right now — open it and paste the key terms into Notes instead.", true);
    return;
  }
  if(file.size > 50*1024*1024){
    contractDocStatus(file.name + " is over the 50MB limit — try a smaller file.", true);
    return;
  }
  contractDocStatus("Uploading " + file.name + "…");
  const d = deals.get(dealId) || {};
  const docs = (d.contractDocs || []).slice();
  let docIndex = docs.length;
  try{
    const safeName = file.name.replace(/[^\w.\-]+/g, "_");
    const path = dealId + "/contracts/" + Date.now() + "_" + Math.random().toString(36).slice(2,8) + "_" + safeName;
    const { error } = await sb.storage.from("deal-files").upload(path, file);
    if(error) throw error;
    docs.push({path, name:file.name, size:file.size, uploadedAt:new Date().toISOString(), docType:"", docSummary:""});
    await updateDeal(dealId, {contractDocs: docs});
  }catch(err){
    console.error("Contract document upload failed:", err);
    contractDocStatus("Couldn't upload " + file.name + " — " + ((err && err.message) || "try again"), true);
    return;
  }
  renderContractDocsList();
  try{
    contractDocStatus("Reading " + file.name + "…");
    const text = await extractContractDocText(file);
    if(!text || !text.trim()){
      contractDocStatus("Uploaded, but couldn't find readable text in " + file.name + " (it may be a scanned image) — paste the key terms into Notes instead.", true);
      return;
    }
    await runContractExtraction(dealId, docIndex, text);
  }catch(err){
    console.error("Contract extraction failed:", err);
    contractDocStatus("Uploaded, but reading the terms failed" + (err && err.detail ? " — "+err.detail : "") + " — fill them in manually or try \"Re-run extraction\" below.", true);
  }
  renderContractDocsList();
}

/* Re-reads an already-uploaded contract document from storage and runs extraction again — used
   both for "try again" after a failure and, just as usefully, for genuinely re-checking a document
   against whatever the deal's fields look like now. */
async function rerunContractDocExtraction(dealId, docIndex){
  const d = deals.get(dealId) || {};
  const doc = (d.contractDocs||[])[docIndex];
  if(!doc || !sb) return;
  contractDocStatus("Fetching " + doc.name + "…");
  try{
    const { data, error } = await sb.storage.from("deal-files").createSignedUrl(doc.path, 300);
    if(error) throw error;
    const res = await fetch(data.signedUrl);
    if(!res.ok) throw new Error("HTTP "+res.status);
    const blob = await res.blob();
    const file = new File([blob], doc.name, {type: blob.type});
    const text = await extractContractDocText(file);
    if(!text || !text.trim()){
      contractDocStatus("Couldn't find readable text in " + doc.name + ".", true);
      return;
    }
    contractDocStatus("Reading " + doc.name + "…");
    await runContractExtraction(dealId, docIndex, text);
  }catch(err){
    console.error("Re-run contract extraction failed:", err);
    contractDocStatus("Couldn't re-read " + doc.name + " — " + ((err && err.message)||"try again"), true);
  }
  renderContractDocsList();
}

let pendingContractExtraction = null; // {dealId, docIndex, result, diffs, notesAddition}

async function runContractExtraction(dealId, docIndex, text){
  const d = deals.get(dealId) || {};
  const ctx = {
    name: d.name, address: d.address, psaStatus: d.psaStatus,
    purchasePrice: d.purchasePrice, lotSizeAcres: d.lotSizeAcres,
    effectiveDate: d.effectiveDate, closingDate: d.closingDate,
    inspectionEndDate: d.inspectionEndDate, actualCloseDate: d.actualCloseDate,
    deposit1Amount: d.deposit1Amount, deposit1Date: d.deposit1Date, deposit1Status: d.deposit1Status,
    deposit2Amount: d.deposit2Amount, deposit2Date: d.deposit2Date, deposit2Status: d.deposit2Status,
    extraDepositLabels: (d.extraDeposits||[]).map(dep=> dep.label).filter(Boolean),
    text: text.slice(0, 24000),
  };
  const result = await sampleApi.json(CONTRACT_EXTRACT_PROMPT(ctx), {modelTier:"default"});
  if(!result || typeof result !== "object") throw new Error("Unexpected response shape");

  // Record what this document is, regardless of whether it turns up any field changes.
  const docs = (deals.get(dealId)||{}).contractDocs ? (deals.get(dealId).contractDocs).slice() : [];
  if(docs[docIndex]){
    docs[docIndex] = Object.assign({}, docs[docIndex], {
      docType: (result.docType && CONTRACT_DOCTYPE_META[result.docType]) ? result.docType : "Other",
      docSummary: result.docSummary || "",
    });
    await updateDeal(dealId, {contractDocs: docs});
  }

  const diffs = [];
  Object.keys(CONTRACT_FIELD_LABELS).forEach(key=>{
    if(!(key in result) || result[key]===null || result[key]===undefined || result[key]==="") return;
    const meta = CONTRACT_FIELD_LABELS[key];
    const from = (d[key] ?? meta.default ?? null);
    if(String(from ?? "") === String(result[key])) return; // already on file — nothing to apply
    diffs.push({key, label: meta.label, kind: meta.kind, from, to: result[key],
      fromDisplay: contractFieldDisplay(meta.kind, from), toDisplay: contractFieldDisplay(meta.kind, result[key])});
  });
  const extraDepositsNew = Array.isArray(result.extraDeposits) ? result.extraDeposits.filter(dep=> dep && dep.label && dep.amount!=null) : [];
  const notesAddition = (result.notesAddition||"").trim();

  if(!diffs.length && !extraDepositsNew.length && !notesAddition){
    pendingContractExtraction = null;
    contractDocStatus("Read " + (docs[docIndex]?docs[docIndex].name:"the document") + " — nothing new found to apply (terms already match what's on file).");
    renderContractExtractReview();
    return;
  }
  pendingContractExtraction = {dealId, docIndex, diffs, extraDepositsNew, notesAddition, docName: docs[docIndex]?docs[docIndex].name:"this document"};
  contractDocStatus("");
  renderContractExtractReview();
}

function renderContractExtractReview(){
  const wrap = document.getElementById("contractExtractReviewWrap");
  if(!wrap) return;
  const p = pendingContractExtraction;
  if(!p || p.dealId !== openDealId){ wrap.innerHTML = ""; return; }
  wrap.innerHTML = `
    <div class="contract-extract-review">
      <div class="contract-extract-review-head">Found in "${escapeHtml(p.docName)}" — review before applying:</div>
      <div class="contract-extract-review-rows">
        ${p.diffs.map((diff,i)=>`
          <label class="contract-extract-review-row">
            <input type="checkbox" class="contract-extract-check" data-idx="${i}" checked>
            <span class="contract-extract-review-label">${escapeHtml(diff.label)}</span>
            <span class="contract-extract-review-from">${escapeHtml(diff.fromDisplay)}</span>
            <span class="contract-extract-review-arrow">→</span>
            <span class="contract-extract-review-to">${escapeHtml(diff.toDisplay)}</span>
          </label>`).join("")}
        ${p.extraDepositsNew.map((dep,i)=>`
          <label class="contract-extract-review-row">
            <input type="checkbox" class="contract-extract-extra-check" data-idx="${i}" checked>
            <span class="contract-extract-review-label">${escapeHtml(dep.label)}</span>
            <span class="contract-extract-review-from">—</span>
            <span class="contract-extract-review-arrow">→</span>
            <span class="contract-extract-review-to">${escapeHtml(fmtMoneyShort(dep.amount))}${dep.date?" · "+escapeHtml(contractFieldDisplay("date",dep.date)):""}${dep.status?" · "+escapeHtml(dep.status):""}</span>
          </label>`).join("")}
      </div>
      ${p.notesAddition ? `<label class="contract-extract-review-row contract-extract-review-notes">
        <input type="checkbox" id="contractExtractNotesCheck" checked>
        <span class="contract-extract-review-label">Add to notes</span>
        <span class="contract-extract-notes-preview">${escapeHtml(p.notesAddition)}</span>
      </label>` : ""}
      <div class="contract-extract-actions">
        <button type="button" class="btn" id="contractExtractApplyBtn">Apply selected</button>
        <button type="button" class="btn btn-ghost" id="contractExtractDismissBtn">Dismiss</button>
      </div>
    </div>`;
  document.getElementById("contractExtractApplyBtn").addEventListener("click", applyContractExtraction);
  document.getElementById("contractExtractDismissBtn").addEventListener("click", ()=>{ pendingContractExtraction = null; renderContractExtractReview(); });
}

async function applyContractExtraction(){
  const p = pendingContractExtraction;
  if(!p) return;
  const wrap = document.getElementById("contractExtractReviewWrap");
  const patch = {};
  const appliedLabels = [];
  p.diffs.forEach((diff,i)=>{
    const cb = wrap.querySelector(`.contract-extract-check[data-idx="${i}"]`);
    if(cb && cb.checked){ patch[diff.key] = diff.to; appliedLabels.push(diff.label); }
  });
  const checkedExtras = p.extraDepositsNew.filter((dep,i)=>{
    const cb = wrap.querySelector(`.contract-extract-extra-check[data-idx="${i}"]`);
    return cb && cb.checked;
  });
  if(checkedExtras.length){
    const d = deals.get(p.dealId) || {};
    patch.extraDeposits = (d.extraDeposits||[]).concat(checkedExtras.map(dep=>({label:dep.label, amount:dep.amount, date:dep.date||"", status:dep.status||"Not Due"})));
    appliedLabels.push(checkedExtras.length===1 ? "1 additional deposit" : checkedExtras.length+" additional deposits");
  }
  const notesCheck = document.getElementById("contractExtractNotesCheck");
  if(notesCheck && notesCheck.checked && p.notesAddition){
    const d = deals.get(p.dealId) || {};
    const attribution = `From ${p.docName}:\n${p.notesAddition}`;
    patch.notes = (d.notes||"").trim() ? d.notes.trim() + "\n\n" + attribution : attribution;
    appliedLabels.push("Notes");
  }
  if(!Object.keys(patch).length){ pendingContractExtraction = null; renderContractExtractReview(); return; }

  // Clear the pending extraction BEFORE writing (rather than after), so any render triggered by
  // the writes below — including this app's own realtime round-trip on this same deal — can't
  // redisplay the just-applied checkboxes while the writes are still in flight.
  pendingContractExtraction = null;

  await updateDeal(p.dealId, patch);

  // Record on the document itself that it was applied, and what.
  const docs = (deals.get(p.dealId)||{}).contractDocs ? deals.get(p.dealId).contractDocs.slice() : [];
  if(docs[p.docIndex]){
    docs[p.docIndex] = Object.assign({}, docs[p.docIndex], {appliedAt:new Date().toISOString(), appliedSummary: appliedLabels.join(", ")});
    await updateDeal(p.dealId, {contractDocs: docs});
  }

  refreshSlideFieldsAfterExternalPatch(patch);
  renderContractExtractReview();
  renderContractDocsList();
  contractDocStatus("Applied: " + appliedLabels.join(", ") + ".");
}

/* Directly updates the raw <input> elements in the open deal panel after a patch is applied out
   from under it (rather than re-opening the whole panel, which would also blow away anything the
   analyst is mid-typing elsewhere in it — same conservative-realtime philosophy used throughout
   this file). CRITICAL_DATE_FIELDS already maps every date field this feature can touch. */
function refreshSlideFieldsAfterExternalPatch(patch){
  if(!openDealId) return;
  const setVal = (id, v)=>{ const el = document.getElementById(id); if(el) el.value = v; };
  if("purchasePrice" in patch) setVal("slidePrice", patch.purchasePrice ?? "");
  if("lotSizeAcres" in patch) setVal("slideLot", patch.lotSizeAcres ?? "");
  if("psaStatus" in patch) setVal("slidePsa", patch.psaStatus || "Not Started");
  if("deposit1Amount" in patch) setVal("slideDep1Amt", patch.deposit1Amount ?? "");
  if("deposit1Status" in patch) setVal("slideDep1Status", patch.deposit1Status || "Not Due");
  if("deposit2Amount" in patch) setVal("slideDep2Amt", patch.deposit2Amount ?? "");
  if("deposit2Date" in patch) setVal("slideDep2Date", patch.deposit2Date || "");
  if("deposit2Status" in patch) setVal("slideDep2Status", patch.deposit2Status || "Not Due");
  if("notes" in patch) setVal("slideNotes", patch.notes || "");
  CRITICAL_DATE_FIELDS.forEach(f=>{
    if(!(f.field in patch)) return;
    setVal(f.id, patch[f.field]||"");
    const mark = document.getElementById(f.id+"Mark");
    if(mark){ mark.textContent = patch[f.field] ? "✓" : "—"; mark.classList.toggle("done", !!patch[f.field]); }
  });
  if("purchasePrice" in patch || "lotSizeAcres" in patch){
    // updateCalcPerAcre() itself is scoped inside openDealDetail's closure and isn't reachable
    // from here — inline the same calculation rather than reaching in for it.
    const price = Number(document.getElementById("slidePrice").value||0);
    const lot = Number(document.getElementById("slideLot").value||0);
    const units = Number(document.getElementById("slideUnits").value||0);
    const perAcreEl = document.getElementById("calcPerAcre");
    if(perAcreEl) perAcreEl.textContent = (price>0 && lot>0) ? fmtMoneyShort(price/lot)+"/ac" : "—";
    const perUnitEl = document.getElementById("calcPerUnit");
    if(perUnitEl) perUnitEl.textContent = (price>0 && units>0) ? fmtMoneyShort(price/units)+"/unit" : "—";
  }
  if("extraDeposits" in patch) renderExtraDeposits();
}

async function removeContractDoc(dealId, docIndex){
  const d = deals.get(dealId) || {};
  const doc = (d.contractDocs||[])[docIndex];
  if(!doc) return;
  const docs = d.contractDocs.slice();
  docs.splice(docIndex, 1);
  await updateDeal(dealId, {contractDocs: docs});
  if(sb){
    try{ await sb.storage.from("deal-files").remove([doc.path]); }
    catch(e){ console.error("Storage cleanup failed (harmless):", e); }
  }
  if(pendingContractExtraction && pendingContractExtraction.dealId===dealId && pendingContractExtraction.docIndex===docIndex){
    pendingContractExtraction = null;
    renderContractExtractReview();
  }
  renderContractDocsList();
}

function renderContractDocsList(){
  if(!openDealId) return;
  const wrap = document.getElementById("contractDocsList");
  if(!wrap) return;
  const docs = (deals.get(openDealId)||{}).contractDocs || [];
  if(!docs.length){ wrap.innerHTML = ""; }
  else{
    wrap.innerHTML = docs.map((doc,i)=>{
      const meta = CONTRACT_DOCTYPE_META[doc.docType] || null;
      return `<div class="contract-doc-row">
        <span class="pill pill-${meta?meta.color:"neutral"}">${meta?escapeHtml(meta.label):"Reading…"}</span>
        <span class="contract-doc-open" data-path="${escapeAttr(doc.path)}">📎 ${escapeHtml(doc.name)}${doc.size!=null?` (${fmtFileSize(doc.size)})`:""}</span>
        <div class="contract-doc-actions">
          <button type="button" class="btn-icon" data-rerun-idx="${i}" title="Re-run extraction">↻ Re-run extraction</button>
          <span class="tag-pill-remove" data-remove-idx="${i}" title="Remove document">✕</span>
        </div>
        ${doc.docSummary ? `<span class="contract-doc-summary">${escapeHtml(doc.docSummary)}</span>` : ""}
        <span class="contract-doc-meta">Uploaded ${fmtDate(doc.uploadedAt.slice(0,10))}${doc.appliedAt ? ` · Applied ${fmtDate(doc.appliedAt.slice(0,10))}${doc.appliedSummary?" ("+escapeHtml(doc.appliedSummary)+")":""}` : " · not yet applied to the deal"}</span>
      </div>`;
    }).join("");
    wrap.querySelectorAll(".contract-doc-open").forEach(el=>{
      el.addEventListener("click", ()=> openModelFile(el.dataset.path));
    });
    wrap.querySelectorAll("[data-rerun-idx]").forEach(el=>{
      el.addEventListener("click", ()=> rerunContractDocExtraction(openDealId, Number(el.dataset.rerunIdx)));
    });
    wrap.querySelectorAll("[data-remove-idx]").forEach(el=>{
      el.addEventListener("click", ()=> removeContractDoc(openDealId, Number(el.dataset.removeIdx)));
    });
  }
  renderContractExtractReview();
}

function renderBrokerActivityLog(){
  const wrap = document.getElementById("brokerActivityLog");
  if(!wrap || !openBrokerId) return;
  const b = brokers.get(openBrokerId) || {};
  const list = b.activityLog || [];
  if(!list.length){
    wrap.innerHTML = `<div class="locked-note">No call notes yet.</div>`;
    return;
  }
  wrap.innerHTML = "";
  const sorted = list.map((entry,i)=>({entry,i})).sort((a,b2)=> (b2.entry.date||"").localeCompare(a.entry.date||""));
  sorted.forEach(({entry,i})=>{
    const row = document.createElement("div");
    row.className = "broker-log-row";
    row.innerHTML = `
      <input class="broker-log-date" type="date">
      <textarea class="broker-log-note" placeholder="What happened…"></textarea>
      <input class="broker-log-link" type="text" placeholder="Link (optional) — email, doc, recording…">
      <button type="button" class="btn-icon broker-log-remove" title="Remove note">✕</button>
      <div class="broker-log-attach-area">
        <div class="broker-log-attachments"></div>
        <label class="broker-log-file-label">📎 Attach file(s)<input type="file" class="broker-log-file-input" multiple></label>
        <span class="broker-log-attach-status"></span>
      </div>`;
    row.querySelector(".broker-log-date").value = entry.date||"";
    row.querySelector(".broker-log-note").value = entry.note||"";
    row.querySelector(".broker-log-link").value = entry.link||"";
    const commit = ()=>{
      const cur = brokers.get(openBrokerId);
      if(!cur) return;
      const next = (cur.activityLog||[]).slice();
      next[i] = Object.assign({}, next[i], {
        date: row.querySelector(".broker-log-date").value,
        note: row.querySelector(".broker-log-note").value.trim(),
        link: row.querySelector(".broker-log-link").value.trim(),
      });
      updateBroker(openBrokerId, {activityLog: next});
    };
    row.querySelector(".broker-log-date").addEventListener("change", commit);
    row.querySelector(".broker-log-note").addEventListener("change", commit);
    row.querySelector(".broker-log-link").addEventListener("change", commit);
    row.querySelector(".broker-log-remove").addEventListener("click", ()=>{
      const cur = brokers.get(openBrokerId);
      if(!cur) return;
      const next = (cur.activityLog||[]).filter((_,idx)=>idx!==i);
      updateBroker(openBrokerId, {activityLog: next});
      renderBrokerActivityLog();
    });

    const atts = entry.attachments || [];
    const attachHolder = row.querySelector(".broker-log-attachments");
    attachHolder.innerHTML = atts.map((att,ai)=>
      `<span class="pill pill-neutral tag-pill">
        <span class="broker-log-attachment-open" data-ai="${ai}">📎 ${escapeHtml(att.name)}${att.size!=null?` (${fmtFileSize(att.size)})`:""}</span>
        <span class="tag-pill-remove" data-ai="${ai}" title="Remove attachment">✕</span>
      </span>`
    ).join("");
    attachHolder.querySelectorAll(".broker-log-attachment-open").forEach(el=>{
      el.addEventListener("click", ()=> openBrokerLogAttachment(atts[Number(el.getAttribute("data-ai"))].path));
    });
    attachHolder.querySelectorAll(".tag-pill-remove").forEach(el=>{
      el.addEventListener("click", ()=> removeBrokerLogAttachment(i, Number(el.getAttribute("data-ai"))));
    });
    row.querySelector(".broker-log-file-input").addEventListener("change", (e)=>{
      const statusEl = row.querySelector(".broker-log-attach-status");
      handleBrokerLogFileUpload(i, e.target.files, statusEl);
      e.target.value = "";
    });

    wrap.appendChild(row);
  });
}

function renderBrokerLinkedDeals(){
  const wrap = document.getElementById("brokerLinkedDeals");
  if(!wrap || !openBrokerId) return;
  const stats = brokerDealStats(openBrokerId);
  if(!stats.deals.length){
    wrap.innerHTML = `<div class="locked-note">No deals linked to this broker yet.</div>`;
    return;
  }
  const sorted = stats.deals.slice().sort((a,b)=> (b[1].createdAt||"").localeCompare(a[1].createdAt||""));
  wrap.innerHTML = `<div class="broker-deal-list">${sorted.map(([id,d])=>{
    const stage = DEAL_STAGES.find(s=>s.key===(d.stage||"prospecting")) || DEAL_STAGES[0];
    return `<div class="broker-deal-row" data-id="${escapeAttr(id)}">
      <span class="broker-deal-name">${escapeHtml(d.name||"Untitled deal")}</span>
      <span class="pill pill-${stage.color}">${escapeHtml(stage.title)}</span>
      <span class="broker-deal-price mono">${d.purchasePrice ? fmtMoneyShort(d.purchasePrice) : "—"}</span>
    </div>`;

  wrap.querySelectorAll(".broker-deal-row").forEach(row=>{

    });
  });
}

/* =================== confirm dialog =================== */
function openConfirm(message, onConfirm, confirmLabel, onCancel){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="overlay" id="confirmOverlay">
      <div class="modal" style="width:min(380px,100%)" role="alertdialog" aria-modal="true">
        <div class="modal-head"><h2>Are you sure?</h2></div>
        <div class="confirm-text">${message}</div>
        <div class="modal-foot">
          <button class="btn btn-danger" id="confirmYes">${escapeHtml(confirmLabel||"Delete")}</button>
          <button class="btn btn-ghost" id="confirmNo" style="margin-left:auto">Cancel</button>
        </div>
      </div>
    </div>`;
  const close = ()=>{ root.innerHTML=""; };
  document.getElementById("confirmOverlay").addEventListener("click", e=>{ if(e.target.id==="confirmOverlay"){ close(); if(onCancel) onCancel(); } });
  document.getElementById("confirmNo").addEventListener("click", ()=>{ close(); if(onCancel) onCancel(); });
  document.getElementById("confirmYes").addEventListener("click", ()=>{ close(); onConfirm(); });
}

/* Gate for moving a deal INTO Onboarded — the point where a project stops being merely
   underwritten/negotiated and becomes a committed, resourced project. If there's no recorded
   Go decision from the Investment Criteria / Go-No-Go panel, this asks for confirmation
   instead of silently onboarding an unreviewed deal. `apply` runs on confirm (or immediately
   if no gate applies); `cancel` runs only if the user backs out, so callers can reset any
   UI (e.g. a <select>) that already changed visually. */
function confirmStageChange(d, newStage, apply, cancel){
  if(newStage==="onboarded" && (d.icDecision||"")!=="go"){
    const cur = IC_DECISION_META[d.icDecision||""] || IC_DECISION_META[""];
    openConfirm(
      `This deal doesn't have a recorded <strong>Go</strong> decision (currently: ${escapeHtml(cur.label)}). Move to <strong>Onboarded</strong> anyway?`,
      apply, "Move to Onboarded anyway", cancel
    );
  } else {
    apply();
  }
}

/* =================== password gate ===================
   Client-side only: there is no backend here, so this cannot stop someone who opens dev tools
   and reads the page source or the stored hash. It's a lightweight deterrent against casual/
   accidental visitors (e.g. the link getting passed around or indexed), not real access control —
   the real access boundary is this artifact's own sharing setting (owner/editor/viewer / "anyone
   with the link"), set from the artifact's share menu, independent of this gate. */
const PW_GATE_HASH = "e908ee7f28b12ab3af4b5034d16bda0df3bdb422918bfa3ae1765eb36c5e25a4";
const PW_GATE_STORAGE_KEY = "dealdesk_gate_ok";
async function pwGateSha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function pwGateUnlock(){
  const overlay = document.getElementById("pwGateOverlay");
  if(overlay) overlay.remove();
  boot();
}
function initPasswordGate(){
  let alreadyOk = false;
  try{ alreadyOk = localStorage.getItem(PW_GATE_STORAGE_KEY) === "1"; }catch(e){}
  if(alreadyOk){ pwGateUnlock(); return; }
  const form = document.getElementById("pwGateForm");
  const input = document.getElementById("pwGateInput");
  const errEl = document.getElementById("pwGateError");
  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const hash = await pwGateSha256Hex(input.value||"");
    if(hash === PW_GATE_HASH){
      try{ localStorage.setItem(PW_GATE_STORAGE_KEY, "1"); }catch(e){}
      pwGateUnlock();
    } else {
      errEl.textContent = "Incorrect password.";
      input.value = "";
      input.focus();
    }
  });
  input.focus();
}
initPasswordGate();
