/* =================== dashboard: closed-deals trajectory =================== */
/* Cumulative line WITHIN the selected window — "Since" resets the baseline to zero at the start
   date and only counts closings on/after it, so the total badge and the line always agree with
   what's on screen. (Earlier version computed one all-time cumulative total and just cropped the
   x-axis to the window, which left the line — and the total badge — silently including closings
   from before the window. That's the "dates aren't working" bug: e.g. Since=Sep 1 still showed a
   deal that actually closed in August as "1 closed" in the Sep-only view.) When no Since date is
   set, "all time" still anchors the x-axis to the first-ever closing so the chart doesn't pad out
   years of empty months. */
function buildClosedTrajectory(dealMap, sinceDate, asOfDate){
  const asOf = asOfDate || null;
  const since = sinceDate || null;
  const now = asOf ? new Date(asOf+"T00:00:00") : new Date();
  const closedMonths = [...(dealMap||deals).values()]
    .filter(d=>d.actualCloseDate && (!asOf || d.actualCloseDate<=asOf) && (!since || d.actualCloseDate>=since))
    .map(d=>d.actualCloseDate.slice(0,7)).sort();
  let startY, startM;
  if(since){
    [startY, startM] = since.slice(0,7).split("-").map(Number);
  } else if(closedMonths.length){
    [startY, startM] = closedMonths[0].split("-").map(Number);
  } else {
    return {months:[], counts:[], cumulative:[], total:0};
  }
  const months = [];
  let y=startY, m=startM;
  while(y<now.getFullYear() || (y===now.getFullYear() && m<=now.getMonth()+1)){
    months.push(`${y}-${String(m).padStart(2,"0")}`);
    m++; if(m>12){ m=1; y++; }
  }
  const counts = months.map(mk=> closedMonths.filter(k=>k===mk).length);
  let running=0;
  const cumulative = counts.map(c=>{ running+=c; return running; });
  return {months, counts, cumulative, total:running};
}
/* Quick-pick shortcuts for the trajectory's start date, relative to whatever "as of" end date is
   set (or today) — "12 mo" / "24 mo" just fill in that computed date, same pattern as the hero
   stat above: the date field itself is always the source of truth and stays directly editable. */
function closedTrajStartFor(preset){
  if(preset==="all") return "";
  const ref = closedTrajectoryAsOfDate ? new Date(closedTrajectoryAsOfDate+"T00:00:00") : new Date();
  const months = Number(preset)||12;
  const d = new Date(ref.getFullYear(), ref.getMonth()-months, ref.getDate());
  return d.toISOString().slice(0,10);
}
function closedTrajectoryPeriodLabel(){
  const parts = [closedTrajectoryStartDate ? `since ${fmtDate(closedTrajectoryStartDate)}` : "all time"];
  if(closedTrajectoryAsOfDate) parts.push(`as of ${fmtDate(closedTrajectoryAsOfDate)}`);
  return parts.join(" · ");
}
function closedTrajectoryCardHtml(dealMap){
  const rangeBtnsHtml = [{key:"all",label:"All time"},{key:"12",label:"12 mo"},{key:"24",label:"24 mo"}]
    .map(r=>`<button type="button" class="btn-icon${(closedTrajectoryStartDate||"")===closedTrajStartFor(r.key)?" active":""}" data-range="${r.key}">${r.label}</button>`).join("");
  const asOfControlHtml = `<div class="closed-asof">
    <label for="closedAsOfInput">As of</label>
    <input type="date" id="closedAsOfInput" value="${closedTrajectoryAsOfDate||""}" max="${new Date().toISOString().slice(0,10)}">
    ${closedTrajectoryAsOfDate ? `<button type="button" class="btn-icon" id="closedAsOfResetBtn" title="Reset to today">✕</button>` : ""}
    <label for="closedSinceInput" style="margin-left:8px;">Since</label>
    <input type="date" id="closedSinceInput" value="${closedTrajectoryStartDate||""}" max="${new Date().toISOString().slice(0,10)}">
  </div>`;
  if(closedTrajectoryStartDate && closedTrajectoryAsOfDate && closedTrajectoryStartDate>closedTrajectoryAsOfDate){
    return `<div class="dash-card" id="closedTrajectoryCard" style="margin-top:16px;">
      <div class="cal-head"><h4 class="section-label">Closed deals — trajectory</h4>${asOfControlHtml}</div>
      <div class="empty-hint">"Since" is after "As of" — pick a since date on or before ${fmtDate(closedTrajectoryAsOfDate)}.</div>
    </div>`;
  }
  const {months, counts, cumulative, total} = buildClosedTrajectory(dealMap, closedTrajectoryStartDate, closedTrajectoryAsOfDate);
  if(!months.length){
    return `<div class="dash-card" id="closedTrajectoryCard" style="margin-top:16px;">
      <div class="cal-head"><h4 class="section-label">Closed deals — trajectory</h4>${asOfControlHtml}</div>
      <div class="empty-hint">No closed deals ${closedTrajectoryAsOfDate ? `as of ${fmtDate(closedTrajectoryAsOfDate)}` : "yet — this fills in as deals close"}.</div>
    </div>`;
  }
  const n = months.length;
  const W=720, H=160, padL=28, padR=12, padT=14, padB=22;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const maxY = Math.max(1, ...cumulative);
  const xFor = i => n>1 ? padL + (i/(n-1))*innerW : padL+innerW/2;
  const yFor = v => padT + innerH - (v/maxY)*innerH;
  const points = cumulative.map((v,i)=> `${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(" ");
  const areaPoints = `${xFor(0).toFixed(1)},${(padT+innerH).toFixed(1)} ${points} ${xFor(n-1).toFixed(1)},${(padT+innerH).toFixed(1)}`;
  const monthLabel = mk=>{ const [yy,mm]=mk.split("-"); return new Date(Number(yy),Number(mm)-1,1).toLocaleDateString(undefined,{month:"short",year:"2-digit"}); };
  const dots = cumulative.map((v,i)=> `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="2.6" class="traj-dot"><title>${monthLabel(months[i])}: ${v} closed in window (${counts[i]} that month)</title></circle>`).join("");
  const labelEvery = Math.max(1, Math.ceil(n/8));
  const xLabels = months.map((mk,i)=>{
    if(i%labelEvery!==0 && i!==n-1) return "";
    const [yy,mm] = mk.split("-");
    return `<text x="${xFor(i).toFixed(1)}" y="${H-6}" class="traj-axis-label" text-anchor="middle">${new Date(Number(yy),Number(mm)-1,1).toLocaleDateString(undefined,{month:"short"})}</text>`;
  }).join("");
  const svg = `<svg viewBox="0 0 ${W} ${H}" class="traj-svg" role="img" aria-label="Cumulative closed deals over time">
    <polygon points="${areaPoints}" class="traj-area"></polygon>
    <polyline points="${points}" class="traj-line"></polyline>
    ${dots}${xLabels}
  </svg>`;
  return `<div class="dash-card" id="closedTrajectoryCard" style="margin-top:16px;">
    <div class="cal-head">
      <h4 class="section-label">Closed deals — trajectory</h4>
      <div class="cal-range-toggle" id="closedRangeToggle">${rangeBtnsHtml}</div>
    </div>
    ${asOfControlHtml}
    <div class="traj-total"><span class="traj-total-value">${total}</span><span class="traj-total-label">closed ${closedTrajectoryPeriodLabel()}</span></div>
    ${svg}
  </div>`;
}

/* Real Leaflet + OpenStreetMap tile map (free, no API key). State mode plots one marker per state
   at its STATE_META centroid; market mode plots one marker per resolved "City, ST" at its real
   coordinates from MARKET_COORDS (see the big constants near STATE_META) — both lookups are the
   same ones the old flat-SVG version used, just handed to real map tiles instead of a hand-drawn
   projection. This only became possible once the app moved off the Claude artifact sandbox, which
   couldn't reach a live tile host at runtime.

   The card's container (#pipelineMap) is fully rebuilt on every dashboard re-render (renderDashboard
   replaces its parent's innerHTML each time), so there's no persisted Leaflet instance to manage —
   each call below gets a fresh element and creates a fresh map on it. */
/* Free geocoding via OpenStreetMap's Nominatim (no API key) — used to place a Leaflet marker for
   a deal's address on the IC memo. Cached in memory per address for this session/tab so repeat
   views of the same memo don't re-hit the service (Nominatim's usage policy caps casual use to
   roughly one request/second; a small in-memory cache keeps this app well under that even if
   several memos get opened back to back). */
const _geocodeCache = new Map();
async function geocodeAddress(address){
  const key = (address||"").trim().toLowerCase();
  if(!key) return null;
  if(_geocodeCache.has(key)) return _geocodeCache.get(key);
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`, {
      headers: { "Accept": "application/json" },
    });
    if(!res.ok) throw new Error("geocode request failed");
    const data = await res.json();
    const hit = (data && data[0]) ? { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) } : null;
    _geocodeCache.set(key, hit);
    return hit;
  }catch(e){
    _geocodeCache.set(key, null);
    return null;
  }
}
/* Live location map near the top of a deal's detail panel — deliberately separate from (and
   simpler than) the printable IC memo's map: it renders once when the panel opens and again
   whenever the analyst changes the address or the map-address override, rather than on every
   realtime update, since re-creating a live Leaflet instance on every remote edit elsewhere in
   the deal would be wasted work and a distracting flicker for no benefit. geocodeAddress's own
   in-memory cache keeps repeat opens of the same deal free. */
async function renderDealLocationMap(dealId, addr){
  const wrap = document.getElementById("dealLocationMapWrap");
  if(!wrap) return;
  addr = (addr||"").trim();
  if(!addr){ wrap.innerHTML = ""; return; }
  wrap.innerHTML = `<div class="deal-location-map-loading" id="dealLocationMapSlot">Loading map…</div>`;
  const hit = await geocodeAddress(addr);
  const slot = document.getElementById("dealLocationMapSlot");
  if(!slot || openDealId!==dealId) return; // panel closed, or switched to a different deal while geocoding
  if(!hit || typeof L === "undefined"){
    slot.textContent = "Map unavailable for this address — check it looks right, or use the Google Maps link under Links.";
    return;
  }
  slot.className = "deal-location-map";
  slot.textContent = "";
  const map = L.map(slot, { scrollWheelZoom:false, dragging:true }).setView([hit.lat, hit.lon], 15);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
  }).addTo(map);
  L.marker([hit.lat, hit.lon]).addTo(map);
  attachCtrlScrollZoom(map, slot);
}
function cssVar(name, fallback){
  try{
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }catch(e){ return fallback; }
}
/* All three Leaflet maps in the app (pipeline map, deal detail map, IC memo map) are created with
   scrollWheelZoom:false so a plain scroll over one of them scrolls the page like anything else on
   it, rather than hijacking the scroll to zoom. This adds back a deliberate way to zoom by wheel —
   hold Ctrl (or Cmd on Mac) while scrolling, the same convention Google Maps embeds use — without
   touching Leaflet's own scroll handling at all: we do the zoom ourselves only when that modifier
   is held, and otherwise leave the event alone so the page scrolls normally. Wheel deltas are
   accumulated and converted to whole zoom levels using the same 60px-per-level Leaflet's own
   handler defaults to, so a trackpad's stream of small events doesn't zoom far faster than a mouse
   wheel's few large ones. A plain scroll (no modifier) briefly flashes a hint over the map instead
   of silently doing nothing, so the gesture is discoverable the first time someone tries it. */
function attachCtrlScrollZoom(map, el){
  const PX_PER_ZOOM_LEVEL = 60;
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||"");
  let accum = 0, hintEl = null, hintTimer = null;
  const flashHint = ()=>{
    if(!hintEl){
      hintEl = document.createElement("div");
      hintEl.className = "map-scroll-hint";
      hintEl.textContent = isMac ? "Use ⌘ + scroll to zoom the map" : "Use ctrl + scroll to zoom the map";
      el.appendChild(hintEl);
    }
    hintEl.classList.add("visible");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(()=>{ if(hintEl) hintEl.classList.remove("visible"); }, 900);
  };
  el.addEventListener("wheel", e=>{
    if(!(e.ctrlKey || e.metaKey)){ flashHint(); return; } // no modifier — let the page scroll
    e.preventDefault();
    accum += e.deltaY;
    if(Math.abs(accum) < PX_PER_ZOOM_LEVEL) return;
    const steps = Math.trunc(accum / PX_PER_ZOOM_LEVEL);
    accum -= steps * PX_PER_ZOOM_LEVEL;
    const point = map.mouseEventToContainerPoint(e);
    map.setZoomAround(point, map.getZoom() - steps);
  }, { passive:false });
}
/* Builds the drill-down popup shown when a state/market dot is clicked: a scrollable list of
   compact deal cards (name, stage, price, lead) plus a "View all in pipeline" footer link. Cards
   are clickable — they open the real deal detail slideover directly, without leaving the
   Dashboard — and the footer link is the only thing that still jumps to the filtered Acquisitions
   board, so that jump is now a deliberate choice instead of firing on every dot click. Delegated
   click handling for both is wired once via the map's "popupopen" event in renderPipelineMap,
   since this string gets handed to Leaflet's bindPopup rather than inserted with listeners attached. */
function pipelinePopupHtml(label, s, viewAllState){
  const dealsHtml = s.deals.map(d=>`
    <button type="button" class="pipeline-popup-deal" data-deal-id="${escapeAttr(d.id)}">
      <span class="pipeline-popup-deal-name">${escapeHtml(d.name)}</span>
      <span class="pipeline-popup-deal-meta">
        <span class="pill pill-${d.stageColor}">${escapeHtml(d.stageTitle)}</span>
        <span class="pipeline-popup-deal-price">${d.price}</span>
        <span class="pipeline-popup-deal-lead">· ${escapeHtml(d.lead)}</span>
      </span>
    </button>`).join("");
  return `<div class="pipeline-popup">
    <div class="pipeline-popup-head">${escapeHtml(label)}</div>
    <div class="pipeline-popup-sub">${s.count} deal${s.count>1?"s":""} · ${fmtMoneyShort(s.capital)} capital</div>
    <div class="pipeline-popup-list">${dealsHtml}</div>
    <button type="button" class="pipeline-popup-viewall" data-view-all-state="${escapeAttr(viewAllState)}">View all ${s.count} in pipeline →</button>
  </div>`;
}
function renderPipelineMap(byState, byMarket){
  const el = document.getElementById("pipelineMap");
  if(!el || typeof L === "undefined") return;
  const mode = pipelineMapMode==="market" ? "market" : "state";
  const dataMap = mode==="market" ? byMarket : byState;

  let maxCap = 0, totalPlotted = 0;
  dataMap.forEach(s=>{ if(s.capital>maxCap) maxCap=s.capital; totalPlotted += s.count; });
  const rFor = (capital)=>{
    if(!capital || !maxCap) return 6;
    return 6 + Math.sqrt(capital/maxCap)*15;
  };

  if(totalPlotted===0){
    el.innerHTML = `<div class="map-empty">${mode==="market"
      ? `No deals plotted yet — add a "City, ST" to a deal's address to place it on the market map.`
      : `No deals plotted yet — set a State (or a "City, ST" address) on a deal to place it here.`}</div>`;
    return;
  }

  el.innerHTML = ""; // fresh container each render — Leaflet attaches to a clean element
  const accent = cssVar("--accent", "#183139");
  const brass = cssVar("--brass", "#2C7E97");
  const map = L.map(el, { scrollWheelZoom:false, worldCopyJump:true }).setView([39.5, -98.35], 4);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
  }).addTo(map);
  attachCtrlScrollZoom(map, el);

  // One delegated listener handles every popup this map ever opens (each dot's popup content is
  // freshly rendered by Leaflet on open, so listeners can't be attached until then).
  map.on("popupopen", e=>{
    const popupEl = e.popup.getElement();
    if(!popupEl) return;
    popupEl.querySelectorAll(".pipeline-popup-deal").forEach(btn=>{
      btn.addEventListener("click", ()=> openDealDetail(btn.dataset.dealId));
    });
    const viewAllBtn = popupEl.querySelector(".pipeline-popup-viewall");
    if(viewAllBtn) viewAllBtn.addEventListener("click", ()=>{
      const st = viewAllBtn.dataset.viewAllState;
      dashboardFilters.state = (dashboardFilters.state===st) ? "" : st;
      setView("pipeline");
    });
  });

  const markers = [];
  const addMarker = (lat, lon, r, color, popupHtml)=>{
    const m = L.circleMarker([lat,lon], { radius:r, color, weight:1.5, fillColor:color, fillOpacity:.45 }).addTo(map);
    m.bindPopup(popupHtml, {maxWidth:240, minWidth:200});
    markers.push(m);
  };

  if(mode==="state"){
    Object.entries(STATE_META).forEach(([code,meta])=>{
      const s = byState.get(code);
      if(!s) return;
      const r = meta.inset ? Math.min(rFor(s.capital), 12) : rFor(s.capital);
      addMarker(meta.lat, meta.lon, r, accent, pipelinePopupHtml(meta.name, s, code));
    });
  } else {
    byMarket.forEach((s, key)=>{
      const r = rFor(s.capital);
      const st = key.split(",").pop().trim();
      addMarker(s.lat, s.lon, r, brass, pipelinePopupHtml(key, s, st));
    });
  }

  if(markers.length){
    try{ map.fitBounds(L.featureGroup(markers).getBounds().pad(0.25), {maxZoom:6}); }catch(e){}
  }
}

/* =================== dashboard: important dates =================== */
/* Only genuinely forward-looking due-dates belong here (things that can legitimately be
   "overdue" or "coming up"): DD/inspection deadline, deposits, and the closing balance.
   Record-of-what-already-happened dates (LOI submitted, materials received, underwriting
   complete, IC approval, PSA/effective date) are milestones, not deadlines — they're still
   fully visible on the deal's own Critical Dates checklist, just not fed into the alert/
   calendar "due date" machinery where they'd always read as overdue the moment they're filled
   in (see CRITICAL_DATE_FIELDS in the deal detail view). */
function getDealEvents(dealMap){
  const events = [];
  (dealMap || deals).forEach((d,id)=>{
    if((d.stage||"prospecting")==="dead") return;
    const name = d.name || d.address || "Untitled deal";
    if(d.inspectionEndDate){
      events.push({dealId:id, name, type:"inspection", date:d.inspectionEndDate, amount:null});
    }
    if(d.deposit1Amount && CAPNEED_OPEN_STATUSES.has(d.deposit1Status||"Not Due")){
      const date = d.deposit1Date || d.effectiveDate;
      if(date) events.push({dealId:id, name, type:"deposit1", date, amount:Number(d.deposit1Amount)||0});
    }
    if(d.deposit2Date && d.deposit2Amount && CAPNEED_OPEN_STATUSES.has(d.deposit2Status||"Not Due")){
      events.push({dealId:id, name, type:"deposit2", date:d.deposit2Date, amount:Number(d.deposit2Amount)||0});
    }
    const extraDeposits = d.extraDeposits||[];
    const extraDepositTotal = extraDeposits.reduce((s,dep)=> s+(Number(dep.amount)||0), 0);
    extraDeposits.forEach(dep=>{
      if(dep.date && dep.amount && CAPNEED_OPEN_STATUSES.has(dep.status||"Not Due")) events.push({dealId:id, name: dep.label ? `${name} — ${dep.label}` : name, type:"deposit2", date:dep.date, amount:Number(dep.amount)||0});
    });
    if(d.closingDate && !d.actualCloseDate){
      const price = Number(d.purchasePrice)||0;
      const dep1 = Number(d.deposit1Amount)||0;
      const dep2 = Number(d.deposit2Amount)||0;
      const balance = price ? Math.max(price - dep1 - dep2 - extraDepositTotal, 0) : null;
      events.push({dealId:id, name, type:"closing", date:d.closingDate, amount:balance});
    }
    if(d.actualCloseDate){
      const price = Number(d.purchasePrice)||0;
      const dep1 = Number(d.deposit1Amount)||0;
      const dep2 = Number(d.deposit2Amount)||0;
      const balance = price ? Math.max(price - dep1 - dep2 - extraDepositTotal, 0) : null;
      events.push({dealId:id, name, type:"closed", date:d.actualCloseDate, amount:balance});
    }
  });
  events.sort((a,b)=> a.date<b.date ? -1 : a.date>b.date ? 1 : 0);
  return events;
}

/* =================== dashboard: capital needed (30/60/90) =================== */
/* Cash the desk still needs to fund — deposits not yet paid/applied/refunded, plus the
   balance due at closing on deals that haven't closed — bucketed by how soon it's due. */
const CAPNEED_OPEN_STATUSES = new Set(["Not Due","Due"]);
/* Deposits are funded through equity almost always (per Brendan), so every deposit item is treated
   as 100% equity. The balance due at closing is the one piece that actually draws on the debt
   facility, so it splits by the deal's own debt/equity ratio (dealDebtPct) — same ratio used on the
   deal's own capital-stack tile, so the two views can't disagree. */
function capNeedSplit(category, amount, d){
  if(category==="deposit") return {debtAmount:0, equityAmount:amount};
  const debtPct = dealDebtPct(d);
  const debtAmount = amount*(debtPct/100);
  return {debtAmount, equityAmount: amount-debtAmount};
}
function getCapitalNeedItems(dealMap){
  const items = [];
  (dealMap || deals).forEach((d,id)=>{
    if((d.stage||"prospecting")==="dead") return;
    const name = d.name || d.address || "Untitled deal";
    const extraDeposits = d.extraDeposits||[];
    const extraDepositTotal = extraDeposits.reduce((s,dep)=> s+(Number(dep.amount)||0), 0);
    if(d.deposit1Amount && CAPNEED_OPEN_STATUSES.has(d.deposit1Status||"Not Due")){
      const date = d.deposit1Date || d.effectiveDate;
      const amount = Number(d.deposit1Amount)||0;
      if(date) items.push({dealId:id, name, label:"1st deposit", category:"deposit", date, amount, ...capNeedSplit("deposit", amount, d)});
    }
    if(d.deposit2Amount && d.deposit2Date && CAPNEED_OPEN_STATUSES.has(d.deposit2Status||"Not Due")){
      const amount = Number(d.deposit2Amount)||0;
      items.push({dealId:id, name, label:"2nd deposit", category:"deposit", date:d.deposit2Date, amount, ...capNeedSplit("deposit", amount, d)});
    }
    extraDeposits.forEach(dep=>{
      if(dep.date && dep.amount && CAPNEED_OPEN_STATUSES.has(dep.status||"Not Due")){
        const amount = Number(dep.amount)||0;
        items.push({dealId:id, name, label: dep.label?`Deposit — ${dep.label}`:"Additional deposit", category:"deposit", date:dep.date, amount, ...capNeedSplit("deposit", amount, d)});
      }
    });
    if(d.closingDate && !d.actualCloseDate){
      const price = Number(d.purchasePrice)||0;
      const dep1 = Number(d.deposit1Amount)||0;
      const dep2 = Number(d.deposit2Amount)||0;
      const balance = price ? Math.max(price - dep1 - dep2 - extraDepositTotal, 0) : 0;
      if(balance>0) items.push({dealId:id, name, label:"Balance due at closing", category:"closing", date:d.closingDate, amount:balance, ...capNeedSplit("closing", balance, d)});
    }
  });
  return items;
}
function bucketCapitalNeed(items, asOfIso){
  const buckets = {overdue:[], d30:[], d60:[], d90:[]};
  items.forEach(item=>{
    const days = daysUntil(item.date, asOfIso);
    if(days===null) return;
    if(days<0) buckets.overdue.push(item);
    else if(days<=30) buckets.d30.push(item);
    else if(days<=60) buckets.d60.push(item);
    else if(days<=90) buckets.d90.push(item);
  });
  return buckets;
}
const CAPNEED_WINDOWS = [
  {key:"d30", label:"Next 30 days"},
  {key:"d60", label:"31–60 days"},
  {key:"d90", label:"61–90 days"},
];
function capNeedSum(list, field){ return list.reduce((s,i)=> s+(Number(field?i[field]:i.amount)||0), 0); }
function capitalNeedCardHtml(buckets){
  const colsHtml = CAPNEED_WINDOWS.map(w=>{
    const list = buckets[w.key].slice().sort((a,b)=> a.date<b.date?-1:1);
    const total = capNeedSum(list);
    const depositTotal = capNeedSum(list.filter(i=>i.category==="deposit"));
    const closingTotal = capNeedSum(list.filter(i=>i.category==="closing"));
    const debtTotal = capNeedSum(list, "debtAmount");
    const equityTotal = capNeedSum(list, "equityAmount");
    const itemsHtml = list.length ? list.map(item=>{
      return `<button type="button" class="capneed-item" data-deal="${escapeAttr(item.dealId)}" title="${escapeAttr(item.name+" — "+item.label+" · "+fmtDate(item.date)+" · "+fmtMoneyShort(item.debtAmount)+" debt / "+fmtMoneyShort(item.equityAmount)+" equity")}">
        <span class="capneed-item-name">${escapeHtml(item.name)}</span>
        <span class="capneed-item-label">${escapeHtml(item.label)} · ${fmtDate(item.date)}</span>
        <span class="capneed-item-amt">${fmtMoneyShort(item.amount)}</span>
      </button>`;
    }).join("") : `<div class="capneed-empty">Nothing due</div>`;
    return `<div class="capneed-col">
      <div class="capneed-col-head">
        <span class="capneed-col-label">${w.label}</span>
        <span class="capneed-col-total">${fmtMoneyShort(total)}</span>
      </div>
      <div class="capneed-breakdown">
        <div class="capneed-bd-row"><span class="dot dot-accent"></span>Deposits<span class="capneed-bd-amt">${fmtMoneyShort(depositTotal)}</span></div>
        <div class="capneed-bd-row"><span class="dot dot-brass"></span>Closing<span class="capneed-bd-amt">${fmtMoneyShort(closingTotal)}</span></div>
      </div>
      <div class="capneed-breakdown capneed-breakdown-funding">
        <div class="capneed-bd-row"><span class="dot dot-neutral"></span>Debt<span class="capneed-bd-amt">${fmtMoneyShort(debtTotal)}</span></div>
        <div class="capneed-bd-row"><span class="dot dot-good"></span>Equity<span class="capneed-bd-amt">${fmtMoneyShort(equityTotal)}</span></div>
      </div>
      <div class="capneed-items">${itemsHtml}</div>
    </div>`;
  }).join("");
  return `<div class="dash-card" id="capitalNeedCard" style="margin-bottom:16px;">
    <h4 class="section-label">Capital needed — next 90 days</h4>
    <div class="capneed-grid">${colsHtml}</div>
  </div>`;
}

/* =================== dashboard: deal-quality / screening-accuracy rollup =================== */
/* Are our screening calls actually predicting which deals go on to close? Buckets each dimension's
   *decided* deals (reached Signed PSA/DD or later = "converted", or Dead/Passed = "dead") into a
   conversion rate — deals still active with no outcome yet are shown as context but excluded from
   the rate itself, since their outcome isn't known. */
function dealOutcomeBucket(d){
  const stage = d.stage || "prospecting";
  if(stage==="dead") return "dead";
  if(stage==="signed_psa_dd" || stage==="onboarded") return "converted";
  return "pending";
}
function outcomeBreakdown(dealList, groupFn, order){
  const groups = new Map();
  dealList.forEach(d=>{
    const key = groupFn(d);
    if(key===null || key===undefined) return;
    if(!groups.has(key)) groups.set(key, {converted:0, dead:0, pending:0});
    groups.get(key)[dealOutcomeBucket(d)]++;
  });
  return order.filter(k=>groups.has(k)).map(k=>{
    const g = groups.get(k);
    const decided = g.converted+g.dead;
    return {key:k, ...g, decided, rate: decided ? Math.round(g.converted/decided*100) : null};
  });
}
function qualityRowHtml(label, g){
  const total = g.converted+g.dead+g.pending;
  return `<div class="quality-row">
    <span class="quality-row-label">${escapeHtml(label)}</span>
    <span class="quality-row-track">${g.decided ? `<span class="quality-row-fill" style="width:${g.rate}%"></span>` : ""}</span>
    <span class="quality-row-stat">${g.rate!==null ? `${g.rate}% converted` : "—"}</span>
    <span class="quality-row-meta">${g.converted} signed/closed · ${g.dead} dead · ${g.pending} still pending (${total} total)</span>
  </div>`;
}
function dealQualityCardHtml(dealMap){
  const list = [...dealMap.values()];
  const icRows = outcomeBreakdown(list, d=>d.icDecision||null, ["go","hold","no_go"]);
  const recRows = outcomeBreakdown(list, d=>d.recommendation||null, ["pursue","watch","pass"]);
  const targetRows = outcomeBreakdown(list, d=>d.meetsTargetCriteria ? "yes" : "no", ["yes","no"]);
  const notDecided = list.filter(d=>!d.icDecision).length;
  if(!icRows.length && !recRows.length && !targetRows.length){
    return `<div class="dash-card quality-card" style="margin-top:16px;">
      <h4 class="section-label">Deal quality — is screening predicting outcomes?</h4>
      <div class="empty-hint">Once deals have an IC decision, recommendation, or target-criteria flag and have moved to signed or dead, this shows whether those calls are actually panning out.</div>
    </div>`;
  }
  return `<div class="dash-card quality-card" style="margin-top:16px;">
    <h4 class="section-label">Deal quality — is screening predicting outcomes?</h4>
    <p class="quality-sub">Of decided deals (signed or dead — pending deals aren't counted in the rate yet), how often each call turned out right.</p>
    ${icRows.length ? `<div class="quality-group">
      <div class="quality-group-title">By IC decision${notDecided?` <span class="quality-group-note">(${notDecided} not yet decided)</span>`:""}</div>
      ${icRows.map(g=>qualityRowHtml(IC_DECISION_META[g.key].label, g)).join("")}
    </div>` : ""}
    ${recRows.length ? `<div class="quality-group">
      <div class="quality-group-title">By recommendation</div>
      ${recRows.map(g=>qualityRowHtml(REC_META[g.key].label, g)).join("")}
    </div>` : ""}
    ${targetRows.length ? `<div class="quality-group">
      <div class="quality-group-title">By meets-target-criteria</div>
      ${targetRows.map(g=>qualityRowHtml(g.key==="yes"?"Meets target criteria":"Doesn't meet target criteria", g)).join("")}
    </div>` : ""}
  </div>`;
}

/* =================== dashboard: passed deals & hit rate =================== */
/* How many deals have been marked Dead/Passed, when, and what share of *decided* deals (passed +
   actually signed/closed) that represents — the same converted-vs-dead split dealQualityCardHtml
   already computes above, just as one overall number plus the actual list of passed deals, since
   "how many and when" was the ask, not another breakdown by decision/recommendation. Pass dates
   come from the stage-change activity log (see logDealActivity) — the same source
   buildDealGanttRow already relies on for its per-deal timeline — falling back to the deal's
   last-updated timestamp for a deal that predates activity logging, and to its created date if
   even that's missing, so nothing shows up dateless just because it's old. */
function dealPassedAt(id, d){
  const hit = activityLog.find(a=> a.dealId===id && !a.created && Array.isArray(a.changes)
    && a.changes.some(c=>c.field==="stage" && c.to==="Dead / Passed"));
  return (hit && hit.at) || d.updatedAt || d.createdAt || null;
}
function passedDealsCardHtml(dealMap){
  const passed = [...dealMap.entries()]
    .filter(([id,d])=> (d.stage||"prospecting")==="dead")
    .map(([id,d])=> ({id, d, at: dealPassedAt(id,d)}))
    .sort((a,b)=> (b.at||"").localeCompare(a.at||""));
  const convertedCount = [...dealMap.values()].filter(d=>{
    const s = d.stage||"prospecting";
    return s==="signed_psa_dd" || s==="onboarded";
  }).length;
  const decided = passed.length + convertedCount;
  const rate = decided ? Math.round(convertedCount/decided*100) : null;
  const now = Date.now();
  const last30 = passed.filter(p=> p.at && now-new Date(p.at).getTime() <= 30*86400000).length;
  const last90 = passed.filter(p=> p.at && now-new Date(p.at).getTime() <= 90*86400000).length;
  const rowsHtml = passed.length ? passed.slice(0,50).map(({id,d,at})=>{
    const bits = [dealMarketLabel(d), d.purchasePrice ? fmtMoneyShort(d.purchasePrice) : ""].filter(Boolean).join(" · ");
    return `<div class="weekly-row" data-deal="${escapeAttr(id)}">
      <span class="weekly-row-name">${escapeHtml(d.name||d.address||"Untitled deal")}</span>
      <span class="weekly-row-text">${escapeHtml(bits)}</span>
      <span class="weekly-row-meta">${at ? fmtDate(at.slice(0,10)) : "—"}</span>
    </div>`;
  }).join("") : "";
  return `<div class="dash-card" style="margin-top:16px;">
    <h4 class="section-label">Passed deals &amp; hit rate</h4>
    <div class="kpi-grid" style="margin-bottom:14px;">
      <div class="kpi-tile"><span class="kpi-label">Passed / dead</span><span class="kpi-value">${passed.length}</span><span class="kpi-sub">${last30} in last 30 days · ${last90} in last 90</span></div>
      <div class="kpi-tile"><span class="kpi-label">Signed / closed</span><span class="kpi-value good">${convertedCount}</span></div>
      <div class="kpi-tile"><span class="kpi-label">Hit rate</span><span class="kpi-value">${rate!==null?rate+"%":"—"}</span><span class="kpi-sub">${decided} decided deal${decided===1?"":"s"} so far</span></div>
    </div>
    ${passed.length ? `<div class="weekly-group">${rowsHtml}</div>` : `<div class="empty-hint">No deals have been marked Dead / Passed yet.</div>`}
  </div>`;
}

/* =================== dashboard: "What changed" weekly digest =================== */
/* Powered by the activity log written in logDealActivity/logDealCreated (see updateDeal/createDeal) —
   a curated, field-level diff of notable deal changes, since current-state fields alone can't answer
   "what changed since last week." Grouped into new deals / stage moves / decisions / everything else
   so it stays a quick read rather than a full audit trail. */
function getActivityInRange(days){
  const cutoff = Date.now() - days*86400000;
  return activityLog.filter(a=> a.at && new Date(a.at).getTime() >= cutoff);
}
function weeklyRowText(row){
  if(row.type==="created") return "New deal added";
  const c = row.change;
  if(c.field==="stage") return `${c.from} → ${c.to}`;
  if(c.field==="decisionRequired") return (c.to && c.to!=="—") ? `Flagged for decision: ${c.to}` : "Decision resolved";
  return `${c.label}: ${c.from} → ${c.to}`;
}
function weeklyRowMeta(row){
  const date = row.at ? fmtDate(row.at.slice(0,10)) : "";
  return [date, row.who].filter(Boolean).join(" · ");
}
const WEEKLY_GROUP_META = [
  {key:"created",  label:"New deals",           open:true},
  {key:"stage",    label:"Stage moves",         open:true},
  {key:"decision", label:"Decisions flagged",   open:false},
  {key:"other",    label:"Other updates",       open:false},
];
function weeklySummaryCardHtml(){
  const entries = getActivityInRange(weeklySummaryRangeDays);
  const groups = {created:[], stage:[], decision:[], other:[]};
  entries.forEach(a=>{
    if(a.created){ groups.created.push({type:"created", dealId:a.dealId, dealName:a.dealName, at:a.at, who:a.who}); return; }
    (a.changes||[]).forEach(c=>{
      const row = {type:"change", dealId:a.dealId, dealName:a.dealName, at:a.at, who:a.who, change:c};
      if(c.field==="stage") groups.stage.push(row);
      else if(c.field==="decisionRequired") groups.decision.push(row);
      else groups.other.push(row);
    });
  });
  Object.values(groups).forEach(list=> list.sort((a,b)=> (b.at||"").localeCompare(a.at||"")));
  const totalCount = groups.created.length+groups.stage.length+groups.decision.length+groups.other.length;
  const groupsHtml = WEEKLY_GROUP_META.filter(g=>groups[g.key].length).map(g=>{
    const rows = groups[g.key].slice(0,20);
    return `<details class="weekly-group"${g.open?" open":""}>
      <summary>${g.label}<span class="weekly-group-count">${groups[g.key].length}</span></summary>
      ${rows.map(r=>`<div class="weekly-row" data-deal="${escapeAttr(r.dealId)}">
        <span class="weekly-row-name">${escapeHtml(r.dealName)}</span>

        <span class="weekly-row-meta">${escapeHtml(weeklyRowMeta(r))}</span>
      </div>`).join("")}
    </details>`;
  }).join("");
  const rangeLabel = weeklySummaryRangeDays===7?"7 days":weeklySummaryRangeDays===14?"14 days":"30 days";
  return `<div class="dash-card weekly-card" style="margin-top:16px;">
    <div class="cal-head">
      <h4 class="section-label">What changed <span class="weekly-total">— last ${rangeLabel}</span></h4>
      <div class="cal-range-toggle">
        <button type="button" class="btn-icon${weeklySummaryRangeDays===7?" active":""}" id="weekly7Btn">7d</button>
        <button type="button" class="btn-icon${weeklySummaryRangeDays===14?" active":""}" id="weekly14Btn">14d</button>
        <button type="button" class="btn-icon${weeklySummaryRangeDays===30?" active":""}" id="weekly30Btn">30d</button>
      </div>
    </div>
    ${totalCount ? groupsHtml : `<div class="empty-hint">No tracked changes in this window${activityLog.length?"":" yet — this builds up as deals are updated going forward"}.</div>`}
  </div>`;
}

/* =================== dashboard: project timeline (Gantt) =================== */
/* Per-deal horizontal timeline — colored segments show time actually spent in each pipeline
   stage (reconstructed from the "stage" changes already recorded in the activity log, see
   logDealActivity), with dollar-due markers (deposits, closing balance) overlaid at their date.
   Answers "where is this deal in the process, and when does money move" in one glance, instead
   of needing the stage column and the payment calendar separately. Deals older than the activity
   log (or that haven't changed stage since) fall back to a single segment from their created date. */
function buildDealGanttRow(id, d){
  const name = d.name || d.address || "Untitled deal";
  const stage = d.stage || "prospecting";
  const stageMeta = DEAL_STAGES.find(s=>s.key===stage) || DEAL_STAGES[0];
  const keyByTitle = t => (DEAL_STAGES.find(s=>s.title===t)||{}).key || null;
  const stageEvents = activityLog
    .filter(a=> a.dealId===id && !a.created && Array.isArray(a.changes))
    .flatMap(a=> a.changes.filter(c=>c.field==="stage").map(c=>({at:a.at, from:c.from, to:c.to})))
    .filter(e=>e.at)
    .sort((a,b)=> a.at<b.at?-1:1);

  const segments = [];
  let curStage = stageEvents.length ? (keyByTitle(stageEvents[0].from) || stage) : stage;
  let curStart = d.createdAt || (stageEvents[0] && stageEvents[0].at) || null;
  if(curStart){
    stageEvents.forEach(ev=>{
      const toKey = keyByTitle(ev.to);
      if(!toKey) return;
      segments.push({stage:curStage, start:curStart, end:ev.at});
      curStage = toKey;
      curStart = ev.at;
    });
    const endRef = stage==="onboarded" ? (d.actualCloseDate ? d.actualCloseDate+"T00:00:00" : new Date().toISOString())
      : stage==="dead" ? (d.updatedAt || curStart)
      : null; // still active — draw out to "today"
    segments.push({stage:curStage, start:curStart, end:endRef, ongoing: endRef===null});
  }
  const markers = getCapitalNeedItems(new Map([[id,d]]));
  return {id, name, stage, stageMeta, segments, markers};
}
function renderGanttChart(dealMap){
  const el = document.getElementById("ganttGrid");
  if(!el) return;
  const rows = [...dealMap.entries()]
    .filter(([id,d])=> (d.stage||"prospecting")!=="dead")
    .map(([id,d])=> buildDealGanttRow(id,d))
    .filter(r=> r.segments.length);

  if(!rows.length){
    el.innerHTML = `<div class="empty-hint">No active deals with dates yet.</div>`;
    return;
  }

  const now = Date.now();
  const MIN_LOOKBACK = now - 365*86400000;
  const MAX_LOOKAHEAD = now + 545*86400000;
  let min = now - 30*86400000, max = now + 60*86400000;
  rows.forEach(r=>{
    r.segments.forEach(seg=>{
      const s = new Date(seg.start).getTime();
      if(!isNaN(s)) min = Math.min(min, Math.max(s, MIN_LOOKBACK));
      const e = seg.end ? new Date(seg.end).getTime() : now;
      if(!isNaN(e)) max = Math.max(max, Math.min(e, MAX_LOOKAHEAD));
    });
    r.markers.forEach(m=>{
      const t = new Date(m.date+"T00:00:00").getTime();
      if(!isNaN(t)){ min = Math.min(min, Math.max(t, MIN_LOOKBACK)); max = Math.max(max, Math.min(t, MAX_LOOKAHEAD)); }
    });
  });
  const span = Math.max(max-min, 86400000);
  const pctOf = t => Math.min(100, Math.max(0, ((t-min)/span)*100));

  rows.forEach(r=>{
    const dueDates = r.markers.map(m=>new Date(m.date+"T00:00:00").getTime()).filter(n=>!isNaN(n));
    r.sortKey = dueDates.length ? Math.min(...dueDates) : Infinity;
  });
  rows.sort((a,b)=> a.sortKey-b.sortKey);

  const ticks = [];
  const startD = new Date(min);
  let cursor = new Date(startD.getFullYear(), startD.getMonth(), 1);
  let guard = 0;
  while(cursor.getTime() <= max && guard<80){
    ticks.push(new Date(cursor));
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
    guard++;
  }
  const todayPct = pctOf(now);
  const headerHtml = ticks.map(t=>{
    const pct = pctOf(t.getTime());
    const label = t.getMonth()===0 ? t.toLocaleDateString(undefined,{month:"short",year:"numeric"}) : t.toLocaleDateString(undefined,{month:"short"});
    return `<span class="gantt-tick" style="left:${pct}%">${label}</span>`;
  }).join("");

  const rowsHtml = rows.map(r=>{
    const segHtml = r.segments.map(seg=>{
      const s = new Date(seg.start).getTime();
      const e = seg.end ? new Date(seg.end).getTime() : now;
      if(isNaN(s)||isNaN(e)) return "";
      const left = pctOf(s);
      const width = Math.max(pctOf(e)-left, 1.2);
      const meta = DEAL_STAGES.find(x=>x.key===seg.stage) || DEAL_STAGES[0];
      const label = `${meta.title} — ${fmtDate((seg.start||"").slice(0,10))} to ${seg.ongoing?"ongoing":fmtDate((seg.end||"").slice(0,10))}`;
      return `<span class="gantt-seg${seg.ongoing?" gantt-seg-ongoing":""}" style="left:${left}%;width:${width}%;background:var(--${meta.color})" title="${escapeAttr(r.name+" — "+label)}"></span>`;
    }).join("");
    const markHtml = r.markers.map(m=>{
      const t = new Date(m.date+"T00:00:00").getTime();
      if(isNaN(t)) return "";
      const pct = pctOf(t);
      const days = daysUntil(m.date);
      const cls = (days!==null && days<0) ? "gantt-marker-bad" : m.category==="closing" ? "gantt-marker-brass" : "gantt-marker-accent";
      return `<button type="button" class="gantt-marker ${cls}" style="left:${pct}%" data-deal="${escapeAttr(r.id)}" title="${escapeAttr(r.name+" — "+m.label+" · "+fmtDate(m.date)+" · "+fmtMoneyShort(m.amount))}"></button>`;
    }).join("");
    return `<div class="gantt-row">
      <button type="button" class="gantt-row-name" data-deal="${escapeAttr(r.id)}">${escapeHtml(r.name)}</button>
      <div class="gantt-row-track">
        <span class="gantt-today-line" style="left:${todayPct}%"></span>
        ${segHtml}${markHtml}
      </div>
      <span class="pill pill-${r.stageMeta.color} gantt-row-pill">${escapeHtml(r.stageMeta.title)}</span>
    </div>`;
  }).join("");

  el.innerHTML = `
    <div class="gantt-chart">
      <div class="gantt-header">
        <span class="gantt-row-name-spacer"></span>
        <div class="gantt-header-track">${headerHtml}<span class="gantt-tick gantt-tick-today" style="left:${todayPct}%">Today</span></div>
        <span class="gantt-row-pill-spacer"></span>
      </div>
      <div class="gantt-body">${rowsHtml}</div>
    </div>
    <div class="map-legend" style="margin-top:10px;">
      ${DEAL_STAGES.filter(s=>s.key!=="dead").map(s=>`<span class="legend-item"><span class="legend-swatch" style="background:var(--${s.color});"></span>${s.title}</span>`).join("")}
      <span class="legend-item"><span class="legend-swatch" style="background:var(--accent);border-radius:50%;"></span>Deposit due</span>
      <span class="legend-item"><span class="legend-swatch" style="background:var(--brass);border-radius:50%;"></span>Closing balance due</span>
      <span class="legend-item"><span class="legend-swatch" style="background:var(--bad);border-radius:50%;"></span>Overdue</span>
    </div>`;

  el.querySelectorAll(".gantt-row-name, .gantt-marker").forEach(btn=>{
    btn.addEventListener("click", ()=> openDealDetail(btn.getAttribute("data-deal")));
  });
}

const CAL_TL_COLW = 100;
function renderCalendarGrid(events){
  const el = document.getElementById("calGrid");
  if(!el) return;
  const now = new Date();
  const todayIso = now.toISOString().slice(0,10);
  const rangeStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const months = [];
  for(let i=0;i<calendarRangeMonths;i++) months.push(new Date(rangeStart.getFullYear(), rangeStart.getMonth()+i, 1));
  const rangeStartIso = `${rangeStart.getFullYear()}-${String(rangeStart.getMonth()+1).padStart(2,"0")}-01`;

  const relevant = events.filter(ev=> ev.type!=="closed");
  const overdue = relevant.filter(ev=> ev.date < todayIso).sort((a,b)=> a.date<b.date?-1:1);

  const byMonth = new Map();
  relevant.forEach(ev=>{
    if(ev.date < rangeStartIso) return;
    const key = ev.date.slice(0,7);
    if(!byMonth.has(key)) byMonth.set(key, []);
    byMonth.get(key).push(ev);
  });

  let yearRow = "", i = 0;
  while(i<months.length){
    const y = months[i].getFullYear();
    let span = 0;
    while(i+span<months.length && months[i+span].getFullYear()===y) span++;
    yearRow += `<div class="cal-tl-year" style="width:${span*CAL_TL_COLW}px">${y}</div>`;
    i += span;
  }

  const curKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const monthRow = months.map(m=>{
    const key = `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,"0")}`;
    return `<div class="cal-tl-month${key===curKey?" is-current":""}" style="width:${CAL_TL_COLW}px">${m.toLocaleDateString(undefined,{month:"short"})}</div>`;
  }).join("");

  const contentRow = months.map(m=>{
    const key = `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,"0")}`;
    const evs = (byMonth.get(key)||[]).sort((a,b)=> a.date<b.date?-1:1);
    const cards = evs.map(ev=>{
      const meta = EVENT_TYPE_META[ev.type]||{label:ev.type,color:"neutral"};
      return `<button type="button" class="cal-tl-card cal-tl-card-${meta.color}" data-deal="${escapeAttr(ev.dealId)}" title="${escapeAttr(ev.name+" — "+meta.label+(ev.amount?" · "+fmtMoneyShort(ev.amount):""))}">
        <span class="cal-tl-card-name">${escapeHtml(ev.name)}</span>
        <span class="cal-tl-card-date mono">${fmtDate(ev.date)}${ev.amount?" · "+fmtMoneyShort(ev.amount):""}</span>
      </button>`;
    }).join("");
    return `<div class="cal-tl-col${key===curKey?" is-current":""}" style="width:${CAL_TL_COLW}px">${cards}</div>`;
  }).join("");

  const shownEvents = [...overdue, ...[...byMonth.values()].flat()];
  const typesPresent = [...new Set(shownEvents.map(ev=>ev.type))];
  const legendHtml = typesPresent.map(t=>{
    const meta = EVENT_TYPE_META[t]||{label:t,color:"neutral"};
    return `<span class="legend-item"><span class="legend-swatch" style="background:var(--${meta.color});"></span>${meta.label}</span>`;
  }).join("");

  el.innerHTML = `
    ${overdue.length ? `<div class="cal-pastdue">
      <span class="cal-pastdue-label">Past due</span>
      <div class="cal-pastdue-list">
        ${overdue.map(ev=>`<button type="button" class="cal-pastdue-chip" data-deal="${escapeAttr(ev.dealId)}">${escapeHtml(ev.name)} · ${fmtDate(ev.date)}</button>`).join("")}
      </div>
    </div>` : ""}
    <div class="cal-tl-scroll">
      <div class="cal-tl-inner">
        <div class="cal-tl-row cal-tl-row-year">${yearRow}</div>
        <div class="cal-tl-row cal-tl-row-month">${monthRow}</div>
        <div class="cal-tl-row cal-tl-row-content">${contentRow || `<div class="stage-empty-line">No dates in this range</div>`}</div>
      </div>
    </div>
    ${legendHtml ? `<div class="cal-tl-legend">${legendHtml}</div>` : ""}`;

  el.querySelectorAll(".cal-tl-card, .cal-pastdue-chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      setView("pipeline");
      openDealDetail(btn.getAttribute("data-deal"));
    });
  });
}

function renderUpcomingList(events){

  const pr = PRIORITY_META[d.priority]||PRIORITY_META.medium;
  const deal = d.relatedDealId ? deals.get(d.relatedDealId) : null;

  card.innerHTML = `

      ${d.hjReview ? `<span class="pill pill-hj">🎯 Harvey/Jay review</span>` : ""}

      ${d.assignee ? `<span class="pill pill-assignee pill-accent"></span>` : ""}

    ${deal ? `<div class="link-tag">🏠 <span></span></div>` : ""}
    <div class="card-foot">
      <select class="move-select"></select>
    </div>`;
  card.querySelector(".card-title").textContent = d.title || "Untitled task";
  card.querySelector(".pill-priority").textContent = pr.label;
  if(d.dueDate){ card.querySelector(".pill-due").textContent = fmtDate(d.dueDate)+urgencySuffix(d.dueDate); }
  if(d.assignee){ card.querySelector(".pill-assignee").textContent = d.assignee; }
  if(deal){ card.querySelector(".link-tag span").textContent = deal.name || deal.address || "Deal"; }
  const sel = card.querySelector(".move-select");
  TASK_COLUMNS.forEach(c=>{
    const o = document.createElement("option"); o.value=c.key; o.textContent="Move to "+c.title;
    if((d.column||"backlog")===c.key) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("click", e=>e.stopPropagation());
  sel.addEventListener("change", ()=> updateTask(id, taskColumnPatch(sel.value)));
  return card;
}

/* Lazily loads pdf.js from cdnjs the first time a PDF needs reading — most sessions never
   touch this, so it's not worth loading on every page load. Falls back gracefully (the caller
   catches and asks the user to paste text instead) if the library or its worker can't load. */
let pdfjsLoadPromise = null;
function loadPdfJs(){
  if(pdfjsLoadPromise) return pdfjsLoadPromise;
  const PDFJS_VERSION = "3.11.174";
  pdfjsLoadPromise = new Promise((resolve, reject)=>{
    if(window.pdfjsLib){ resolve(window.pdfjsLib); return; }
    const s = document.createElement("script");
    s.src = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.js`;
    s.onload = ()=>{
      try{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.js`;
        resolve(window.pdfjsLib);
      }catch(err){ reject(err); }
    };
    s.onerror = ()=> reject(new Error("Couldn't load the PDF reader."));
    document.head.appendChild(s);
  });
  return pdfjsLoadPromise;
}
async function extractPdfText(file){
  const pdfjsLib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const doc = await pdfjsLib.getDocument({data: buf}).promise;
  let text = "";
  const maxPages = Math.min(doc.numPages, 40);
  for(let i=1;i<=maxPages;i++){
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(" ") + "\n\n";
  }
  return text.trim();
}

const SCREEN_DEAL_PROMPT = (ctx)=> `You are a real estate acquisitions analyst doing a first-pass screen on a potential deal for Newgard Development Group, before it goes into the pipeline. Give a quick, honest read — this is not a full underwriting, just a basic pursue/watch/pass call to help triage incoming deals.

- Project name: ${ctx.name || "(not given)"}
- Address: ${ctx.address || "(not given)"}
- Property type: ${ctx.propertyType || "(not given)"}
- Product line: ${ctx.productLine || "(not given)"}

- Lot size (acres): ${ctx.lotSizeAcres != null ? ctx.lotSizeAcres : "(not given)"}
- Deal type: ${ctx.dealType || "(not given)"}
- Source: ${ctx.source || "(not given)"}

${ctx.criteria && ctx.criteria.length ? `SCREENING CRITERIA for this product line — rate the deal against EACH one individually (see criteriaRatings below), then let those ratings inform your overall read:
${ctx.criteria.map(c=>`- [${c.key}] (${c.type==="binary"?"binary — rate 0 or 10 only":"scale — rate 0-10, tenths allowed"}) ${c.label}: ${c.requirement}`).join("\n")}
` : ""}
OM / LISTING TEXT (may be empty if the analyst only filled in the fields above):
"""
${ctx.omText || "(none provided)"}
"""

Return ONLY a JSON object with exactly these keys:
- "name": project/property name if the OM text reveals one not already known above (string or null — leave null if the known field above already has it)
- "address": address if the OM text reveals one not already known above (string or null — leave null if the known field above already has it)
- "purchasePrice": asking/list price in dollars, numeric only, if stated in the OM text and not already known above (number or null)

- "summary": 2-3 plain-language sentences on why, covering the strongest points for and against
- "risks": 1-3 sentences on the key risks or open questions worth flagging before this goes further
${ctx.criteria && ctx.criteria.length ? `- "criteriaRatings": an object keyed by each criterion's [key] above, value = your rating (a number). For a binary criterion use exactly 0 or 10; for a scale criterion use 0-10 with up to one decimal. Only rate a criterion if the OM text or known fields actually support a judgment — omit the key entirely (don't guess) if there isn't enough to go on.

/* Overall score for a not-yet-created deal, computed the exact same way as recomputeIcCriteria's
   icScore (average of every numeric per-criterion rating, rounded to one decimal) — so the number
   shown here in the Screen result matches what the deal will show once it's actually added and
   its screening-criteria section takes over. */
function screenScoreFromRatings(criteria, ratings){
  let sum=0, count=0;
  (criteria||[]).forEach(c=>{
    const r = ratings ? ratings[c.key] : undefined;
    if(typeof r==="number" && !isNaN(r)){ sum += Math.max(0, Math.min(10, r)); count++; }
  });
  return count ? {score: Math.round((sum/count)*10)/10, count} : {score:null, count:0};
}
/* Read-only per-criterion breakdown for the Screen result modal — same rating scale/coloring as
   the deal-detail screening-criteria section (buildIcCriteriaList), but simplified to a label +
   rating pill + optional note since nothing is editable yet (the deal doesn't exist until the
   analyst confirms "Add to Prospecting pipeline"). */
function screenCriteriaBreakdownHtml(criteria, ratings, notesMap){
  const rated = (criteria||[]).filter(c=> typeof (ratings||{})[c.key]==="number" && !isNaN(ratings[c.key]));
  if(!rated.length) return "";
  const rows = rated.map(c=>{
    const r = Math.max(0, Math.min(10, ratings[c.key]));
    const cls = r>=7.5 ? "pill-good" : r>=5 ? "pill-warn" : "pill-bad";
    const ratingLabel = c.type==="binary" ? (r>=5 ? "Meets" : "Doesn't meet") : `${r.toFixed(1)}/10`;
    const note = (notesMap && notesMap[c.key]) ? `<div class="ic-row-line-label" style="margin-top:2px;">${escapeHtml(notesMap[c.key])}</div>` : "";
    return `<div class="ic-row" style="padding:7px 0;">
      <div class="ic-row-top" style="gap:8px;">
        <span class="ic-row-label" style="flex:1;">${escapeHtml(c.label)}</span>
        <span class="pill ${cls}">${ratingLabel}</span>
      </div>
      ${note}
    </div>`;
  }).join("");
  return `<div style="display:flex;flex-direction:column;gap:0;margin-top:2px;">${rows}</div>`;
}

async function confirmAddScreenedDeal(){
  const result = lastScreenResult, answers = lastScreenAnswers, criteria = lastScreenCriteria || [];
  if(!result || !answers) return;
  const name = answers.name || result.name || "Untitled deal";
  const recommendation = ["pursue","watch","pass"].includes(result.recommendation) ? result.recommendation : "";
  const newId = await createDeal({
    name,
    address: answers.address || result.address || "",
    lotSizeAcres: answers.lotSizeAcres != null ? answers.lotSizeAcres : (result.lotSizeAcres != null ? result.lotSizeAcres : null),
    purchasePrice: answers.purchasePrice != null ? answers.purchasePrice : (result.purchasePrice != null ? result.purchasePrice : null),
    state: "", lead: whoName(), notes: "",
    stage: "prospecting",
    psaStatus: "Not Started",
    meetsTargetCriteria: false,
    fund: "", propertyType: answers.propertyType || "", dealType: answers.dealType || "", stageOwners: {},
    targetUnits: null,
    productLine: answers.productLine || "",
    source: answers.source || "", brokerId: "",
    photoUrl1: "", photoUrl2: "", photoUrl3: "",
    effectiveDate: "", inspectionEndDate: "", closingDate: "", actualCloseDate: "",
    loiSubmittedDate: "", materialsReceivedDate: "", underwritingCompleteDate: "", icApprovalDate: "",
    deposit1Amount: null, deposit1Status: "Not Due", deposit1Date: "",
    deposit2Amount: null, deposit2Date: "", deposit2Status: "Not Due",
    extraDeposits: [],
    icDecision: "", icDecisionBy: "", icDecisionDate: "", icDecisionNotes: "",
    folderUrl: "", proformaUrl: "",
    grossDevelopableSf: null, buildCostPerSf: null,
    softCostPct: 20, contingencyPct: 5,
    salePricePerSf: null, sellingCostPct: 6,
    debtPct: 65,
    recommendation, execSummary: result.summary||"", risks: result.risks||"",
    order: Date.now(),
    createdAt: new Date().toISOString(),
  });
  // Carry the AI's per-criterion ratings (if any) onto the new deal's screening-criteria
  // subcollection, deriving a fit/watch/nofit status from each rating so the existing Go/No-Go
  // tallies are populated too — the analyst can still adjust every rating and status by hand.
  if(newId && result.criteriaRatings && typeof result.criteriaRatings==="object"){
    const notes = (result.criteriaNotes && typeof result.criteriaNotes==="object") ? result.criteriaNotes : {};
    const writes = criteria.filter(c=> typeof result.criteriaRatings[c.key]==="number" && !isNaN(result.criteriaRatings[c.key])).map(c=>{
      let rating = Math.max(0, Math.min(10, Math.round(result.criteriaRatings[c.key]*10)/10));
      const status = rating>=7 ? "fit" : rating>=4 ? "watch" : "nofit";
      return setCriteriaItem(newId, c.key, {rating, status, notes: notes[c.key] || ""});
    });
    if(writes.length) await Promise.all(writes);
  }
  const overlay = document.getElementById("screenResultOverlay");
  if(overlay) overlay.remove();
  showToast(`Added "${name}" to Prospecting`, "good");
  resetScreenForm();
  setView("pipeline");
}

/* What makes a deal a fit, defined per product line (e.g. "Porsche Design Clubhouse" vs.
   another line) rather than per property type — this is what the Screen tab weighs a new
   deal against and what the IC scorecard shows on each deal. Persisted to everyone via
   settings/criteriaSets. Rebuilds only when the tab is opened or the underlying settings
   change remotely (see rebuildCriteriaView), never on unrelated deal updates, so an in-
   progress edit here doesn't get wiped by someone else's change elsewhere in the app. */
function renderCriteriaView(){
  const wrap = document.getElementById("criteriaWrap");
  if(!wrap) return;
  if(criteriaViewBuilt) return;
  criteriaViewBuilt = true;

  if(!productLineOptions.length){
    wrap.innerHTML = `<div class="dash-card screen-card">

    </div>`;

    return;
  }

  if(!criteriaViewSelectedLine || !productLineOptions.includes(criteriaViewSelectedLine)){
    criteriaViewSelectedLine = productLineOptions[0];
  }
  const selected = criteriaViewSelectedLine;
  const rows = criteriaSets[selected] || [];

  wrap.innerHTML = `
    <div class="dash-card screen-card">
      <p class="screen-section-label">Product line</p>
      <div class="criteria-line-picker" id="criteriaLinePicker">
        ${productLineOptions.map(line=>`<span class="criteria-line-chip-wrap">
          <button type="button" class="criteria-line-chip${line===selected?" active":""}" data-line="${escapeAttr(line)}">${escapeHtml(line)}</button>
          <button type="button" class="criteria-line-chip-del" data-line="${escapeAttr(line)}" title="Delete this product line">✕</button>
        </span>`).join("")}

      </div>
    </div>
    <div class="dash-card screen-card" style="margin-top:14px;">
      <div class="screen-actions" style="justify-content:space-between; margin-top:0;">
        <p class="screen-section-label" style="margin:0;">Screening criteria — ${escapeHtml(selected)}</p>
        <button class="btn" id="criteriaLoadStarterBtn" type="button">Load Auto Condo starter set</button>
      </div>
      <p class="locked-note" style="margin:6px 0 12px;">These are what "Screen" and the IC scorecard weigh a ${escapeHtml(selected)} deal against. Changes save immediately for everyone.</p>
      <div class="catmgr-list" id="criteriaRowsList" style="max-height:none;">
        ${rows.length ? rows.map((c,i)=>`<div class="mc-row" data-idx="${i}">
          <div class="field"><label>Label</label><input type="text" class="crit-label" data-idx="${i}" value="${escapeAttr(c.label)}"></div>
          <div class="field"><label>Requirement</label><input type="text" class="crit-req" data-idx="${i}" value="${escapeAttr(c.requirement)}"></div>
          <div class="field"><label>Rating type</label><select class="crit-type" data-idx="${i}">
            <option value="scale"${c.type!=="binary"?" selected":""}>Scale 0–10</option>
            <option value="binary"${c.type==="binary"?" selected":""}>Binary Yes/No</option>
          </select></div>
          <button type="button" class="btn-icon crit-remove" data-idx="${i}" title="Remove">✕</button>
        </div>`).join("") : `<div class="empty-hint">No criteria yet for ${escapeHtml(selected)} — add one below, or load the Auto Condo starter set.</div>`}
      </div>
      <div class="field-row" style="margin-top:10px;align-items:flex-end;">
        <div class="field" style="flex:1;"><label for="critNewLabel">Add criterion — label</label><input type="text" id="critNewLabel" placeholder="e.g. Parking ratio"></div>
        <div class="field" style="flex:2;"><label for="critNewReq">Requirement</label><input type="text" id="critNewReq" placeholder="What we're looking for…"></div>
        <div class="field"><label for="critNewType">Rating type</label><select id="critNewType"><option value="scale">Scale 0–10</option><option value="binary">Binary Yes/No</option></select></div>
        <button type="button" class="btn btn-primary" id="critAddBtn" type="button">+ Add</button>
      </div>
    </div>
  `;

  wrap.querySelectorAll(".criteria-line-chip[data-line]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      criteriaViewSelectedLine = btn.getAttribute("data-line");
      rebuildCriteriaView();
    });
  });
  wrap.querySelectorAll(".criteria-line-chip-del").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const line = btn.getAttribute("data-line");
      const refCount = [...deals.values()].filter(d=>(d.productLine||"").trim()===line).length;
      const critCount = (criteriaSets[line]||[]).length;
      const parts = [];
      if(critCount) parts.push(`its ${critCount} screening criterion${critCount===1?"":"a"}`);
      if(refCount) parts.push(`${refCount} deal${refCount===1?"":"s"} tagged with it (they'll fall back to master or custom criteria)`);
      openConfirm(
        `Delete the product line "${escapeHtml(line)}"${parts.length ? ` — this also removes ${parts.join(" and ")}.` : "."} This can't be undone.`,
        ()=>{
          productLineOptions = productLineOptions.filter(l=>l!==line);
          delete criteriaSets[line];
          if(criteriaViewSelectedLine===line) criteriaViewSelectedLine = "";
          saveCategorySettings();
          saveCriteriaSets();
          rebuildCriteriaView();
        },
        "Delete product line"
      );
    });
  });
  document.getElementById("criteriaAddLineBtn").addEventListener("click", ()=> openCategoryManagerModal("productLine"));
  document.getElementById("criteriaLoadStarterBtn").addEventListener("click", ()=>{
    const doLoad = ()=>{
      criteriaSets[selected] = masterIcCriteria.map(c=> Object.assign({}, c));
      saveCriteriaSets();
      rebuildCriteriaView();
    };
    if(rows.length){
      openConfirm(`Replace the ${rows.length} existing criteria for "${escapeHtml(selected)}" with the Auto Condo starter set? This can't be undone.`, doLoad, "Replace");
    } else {
      doLoad();
    }
  });
  wrap.querySelectorAll(".crit-label, .crit-req, .crit-type").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const idx = Number(inp.getAttribute("data-idx"));
      const list = (criteriaSets[selected] || []).slice();
      const item = list[idx];
      if(!item) return;
      if(inp.classList.contains("crit-label")) item.label = inp.value.trim() || item.label;
      else if(inp.classList.contains("crit-type")) item.type = inp.value;
      else item.requirement = inp.value.trim();
      criteriaSets[selected] = list;
      saveCriteriaSets();
    });
  });
  wrap.querySelectorAll(".crit-remove").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = Number(btn.getAttribute("data-idx"));
      const list = (criteriaSets[selected] || []).slice();
      list.splice(idx,1);
      criteriaSets[selected] = list;
      saveCriteriaSets();
      rebuildCriteriaView();
    });
  });
  document.getElementById("critAddBtn").addEventListener("click", ()=>{
    const labelInput = document.getElementById("critNewLabel");
    const reqInput = document.getElementById("critNewReq");
    const typeInput = document.getElementById("critNewType");
    const label = labelInput.value.trim();
    if(!label) return;
    const list = (criteriaSets[selected] || []).slice();
    const key = slugifyCriterionKey(label, list.map(c=>c.key));
    list.push({key, label, requirement: reqInput.value.trim(), type: typeInput.value});
    criteriaSets[selected] = list;
    saveCriteriaSets();
    rebuildCriteriaView();
  });
}

/* Drag-to-resize for the deal detail slideover's left edge. Re-wired every time openDealDetail
   runs (it rebuilds the panel's markup from scratch each open, so any listener bound to the old
   handle element is already gone) — each drag/touch session adds its own move/end listeners and
   tears them down on release, so nothing accumulates across repeated opens. The width itself is
   read from and written back to the module-level slideoverWidth/--slideover-w (see above), not
   fixed here, so it's already correct the instant this panel opens. */
function initSlideResizeHandle(){
  const handle = document.getElementById("slideResizeHandle");
  if(!handle) return;
  const MIN_W = 420;
  const maxW = ()=> Math.min(1400, Math.round(window.innerWidth*0.96));
  function beginResize(startX, startWidth){
    document.body.classList.add("slide-resizing");
    handle.classList.add("dragging");
    function move(clientX){
      const w = Math.min(maxW(), Math.max(MIN_W, startWidth + (startX - clientX)));
      document.documentElement.style.setProperty("--slideover-w", w+"px");
    }
    function onMouseMove(e){ move(e.clientX); }
    function onTouchMove(e){ if(e.touches[0]){ move(e.touches[0].clientX); e.preventDefault(); } }
    function end(){
      document.body.classList.remove("slide-resizing");
      handle.classList.remove("dragging");
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", end);
      document.removeEventListener("touchmove", onTouchMove);
      document.removeEventListener("touchend", end);
      const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--slideover-w"), 10);
      if(w){ slideoverWidth = w; try{ localStorage.setItem("dealdesk_slideover_width", String(w)); }catch(e){} }
    }
    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", end);
    document.addEventListener("touchmove", onTouchMove, {passive:false});
    document.addEventListener("touchend", end);
  }
  handle.addEventListener("mousedown", e=>{ e.preventDefault(); beginResize(e.clientX, slideoverWidth); });
  handle.addEventListener("touchstart", e=>{ if(e.touches[0]) beginResize(e.touches[0].clientX, slideoverWidth); }, {passive:true});
  handle.addEventListener("dblclick", ()=>{
    slideoverWidth = 720;
    applySlideoverWidth();
    try{ localStorage.setItem("dealdesk_slideover_width", "720"); }catch(e){}
  });
}

/* Wires the "record a gate decision" form once per deal-detail open — deliberately not rebuilt by
   the derived-render hooks (unlike renderGateLogSummary below it) so an in-progress note or answer
   selection survives an unrelated field's realtime update, matching how the site-conditions
   repeatable rows are kept separate from refreshSiteCondPreview. */
function wireGateLogForm(dealId){
  const gateSel = document.getElementById("gateLogGate");
  const answerSel = document.getElementById("gateLogAnswer");
  const reasonWrap = document.getElementById("gateLogReasonWrap");
  const reasonSel = document.getElementById("gateLogReason");
  const deciderInput = document.getElementById("gateLogDecider");
  const dateInput = document.getElementById("gateLogDate");
  const noteInput = document.getElementById("gateLogNote");
  const submitBtn = document.getElementById("gateLogSubmit");
  if(!gateSel || !submitBtn) return;

  gateSel.innerHTML = GATES.map(g=>`<option value="${g.key}">${escapeHtml(g.label)}</option>`).join("");
  reasonSel.innerHTML = GATE_REASON_CODES.map(c=>`<option value="${c}">${c}</option>`).join("");

  function populateAnswers(){
    const g = GATES.find(x=>x.key===gateSel.value) || GATES[0];
    answerSel.innerHTML = g.answers.map(a=>`<option value="${escapeAttr(a)}">${escapeHtml(a)}</option>`).join("");
    refreshReasonVisibility();
  }
  function refreshReasonVisibility(){
    reasonWrap.hidden = !gateNeedsReasonCode(answerSel.value);
  }
  gateSel.addEventListener("change", populateAnswers);
  answerSel.addEventListener("change", refreshReasonVisibility);
  populateAnswers();
  deciderInput.value = whoName() || "";
  dateInput.value = new Date().toISOString().slice(0,10);

  submitBtn.addEventListener("click", ()=>{
    const d = deals.get(dealId);
    if(!d) return;
    const entry = {
      gate: gateSel.value,
      answer: answerSel.value,
      decider: deciderInput.value.trim(),
      at: dateInput.value || new Date().toISOString().slice(0,10),
      reasonCode: (!reasonWrap.hidden && reasonSel.value) ? reasonSel.value : "",
      note: noteInput.value.trim(),
      loggedAt: new Date().toISOString(),
    };
    const next = (d.gateLog||[]).concat([entry]);
    d.gateLog = next;
    updateDeal(dealId, {gateLog: next});
    noteInput.value = "";
    renderGateLogSummary();
  });
}

function renderUwTiles(dealLike){
  const tilesEl = document.getElementById("uwTiles");
  const spreadEl = document.getElementById("uwSpread");
  if(!tilesEl) return;
  const uw = calcUnderwriting(dealLike);
  if(!uw || !uw.sf){
    tilesEl.innerHTML = `<div class="locked-note">Fill in gross SF, build cost, and sale price to see the math.</div>`;
    if(spreadEl) spreadEl.textContent = "";
    return;
  }
  const mCls = uw.marginRevenue===null ? "" : (uw.marginRevenue>=0.20?"good":uw.marginRevenue>=0.10?"warn":"bad");
  tilesEl.innerHTML = `
    <div class="uw-tile"><span class="uw-label">Total dev. cost</span><span class="uw-value">${fmtMoneyShort(uw.totalDevCost)}</span></div>
    <div class="uw-tile"><span class="uw-label">Gross revenue</span><span class="uw-value">${uw.grossRevenue?fmtMoneyShort(uw.grossRevenue):"—"}</span></div>
    <div class="uw-tile"><span class="uw-label">Net profit</span><span class="uw-value${uw.netProfit<0?" bad":""}">${fmtMoneyShort(uw.netProfit)}</span></div>
    <div class="uw-tile"><span class="uw-label">Margin · profit on cost</span><span class="uw-value ${mCls}">${uw.marginRevenue!==null?(uw.marginRevenue*100).toFixed(1)+"%":"—"}<span class="uw-sub"> / ${uw.marginCost!==null?(uw.marginCost*100).toFixed(1)+"%":"—"}</span></span></div>`;
  if(spreadEl){
    spreadEl.textContent = uw.costPerSf!==null
